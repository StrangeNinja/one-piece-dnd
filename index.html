const ICON=`<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><circle cx="7" cy="5" r="2.2" fill="currentColor"/><circle cx="13" cy="10" r="2.2" fill="currentColor"/><circle cx="8" cy="15" r="2.2" fill="currentColor"/></svg>`;
const darkQ=matchMedia("(prefers-color-scheme: dark)");
/* dice: "fis" (cada jugador tira sus dados y la app da la receta, predeterminado) o "dig" (la app tira) */
const okLook=v=>v&&PALS[v.pal]&&MODES[v.mode]?{pal:v.pal,mode:v.mode,dice:DICE[v.dice]?v.dice:"fis"}:null;
function readLook(){try{return okLook(JSON.parse(localStorage.getItem(LOOK_KEY)))}catch(e){return null}}
let look=readLook()||{pal:"grand",mode:"auto",dice:"fis"};
const isDark=()=>look.mode==="night"||(look.mode==="auto"&&darkQ.matches);
function applyLook(){const r=document.documentElement;r.dataset.pal=look.pal;r.dataset.theme=isDark()?"dark":"light";
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(r).getPropertyValue("--bg").trim();
  const d=document.getElementById("lk");if(d&&d.open)drawLook()}
/* fromCloud: el valor viene de Firebase, no hay que volver a subirlo */
function setLook(v,fromCloud){v=okLook(v);if(!v||(v.pal===look.pal&&v.mode===look.mode&&v.dice===look.dice))return;look=v;
  try{localStorage.setItem(LOOK_KEY,JSON.stringify(look))}catch(e){}
  applyLook();if(typeof onLook==="function")onLook();if(!fromCloud&&typeof lookToCloud==="function")lookToCloud(look)}
function drawLook(){const t=isDark()?"dark":"light";
  document.getElementById("lk").innerHTML=`<div class="lk-in"><div class="lk-top"><b>Apariencia</b><button class="btn" data-lk="close">Cerrar</button></div>
  <h3>Paleta</h3><div class="lk-pal">${Object.entries(PALS).map(([k,n])=>`<button data-lkpal="${k}" aria-pressed="${look.pal===k}"><span class="sw" data-pal="${k}" data-theme="${t}"><i></i><i></i><i></i><i></i></span>${n}</button>`).join("")}</div>
  <h3>Modo</h3><div class="lk-mode">${Object.entries(MODES).map(([k,n])=>`<button data-lkmode="${k}" aria-pressed="${look.mode===k}">${n}</button>`).join("")}</div>
  <h3>Dados</h3><div class="lk-mode lk-two">${Object.entries(DICE).map(([k,n])=>`<button data-lkdice="${k}" aria-pressed="${look.dice===k}">${n}</button>`).join("")}</div>
  <p class="note" style="margin-top:6px">${look.dice==="fis"?"Tiras tus dados y la app te dice qué tirar. Puedes anotar el resultado.":"La app tira los dados por ti."}</p>
  <p class="lk-ver">Versión ${APP_VERSION}</p></div>`}
function openLook(){let d=document.getElementById("lk");
  if(!d){d=document.createElement("dialog");d.id="lk";d.className="lk";d.setAttribute("aria-label","Apariencia");document.body.append(d);
    d.addEventListener("click",e=>{const b=e.target.closest("button");if(e.target===d||(b&&b.dataset.lk==="close"))return d.close();if(!b)return;
      const k=b.dataset.lkpal?"pal":b.dataset.lkmode?"mode":"dice",val=b.dataset["lk"+k];
      setLook({...look,[k]:val});d.querySelector(`[data-lk${k}="${val}"]`)?.focus()})}
  drawLook();d.showModal()}
applyLook();darkQ.addEventListener("change",applyLook);
addEventListener("storage",e=>{if(e.key===LOOK_KEY){const v=readLook();if(v){look=v;applyLook()}}});
</script>

   cargas = nivel + competencia, se recuperan con descanso largo. La Voluntad solo se usa para la fruta, nunca para el Haki. */

function roll(expr,crit=false,max=false){
  let tot=0,rolls=[],mod=0;
  for(const p of expr.replace(/\s/g,"").replace(/-/g,"+-").split("+")){
    const m=p.match(/^(\d+)d(\d+)$/);
    if(m){const n=(+m[1])*(crit?2:1);for(let i=0;i<n;i++){const r=max?+m[2]:d(+m[2]);rolls.push(r);tot+=r}}
    else if(p){mod+=+p;tot+=+p}}
  return{tot,txt:"["+rolls.join(", ")+"]"+(mod?(mod>0?" + ":" − ")+Math.abs(mod):"")};
}

function spellDice(base,s,lvl,c){
  const n=s.cantrip?(c.level>=17?3:c.level>=11?2:c.level>=5?1:0):s.up?Math.floor(Math.max(0,lvl-s.l)/(s.ue||1)):0;

  const a=base.match(/^(\d+)d(\d+)$/),b=per.match(/^(\d+)d(\d+)$/);
  return a&&b&&a[2]===b[2]?`${+a[1]+b[1]*n}d${a[2]}`:base+("+"+per).repeat(n);
}

    h+=`<section><h2>${COST[cost]}${cost==="accion"?` <small>Crítico con ${c.critMin}–20</small>`:""}</h2><div class="list">${list.map(([a,i])=>actBtn(a,i)).join("")}</div></section>`;
  }
  if(c.caster)h+=spellSec(c);
  if(c.fruit)h+=fruitSec(c);
  if(c.items)h+=itemSec(c);
  if(c.companion)h+=compSec(c);
  if(c.role)h+=roleSec(c);
  h+=`<section><h2>Reacciones especiales <small>2 por ronda · ${c.prof} usos c/u por descanso corto</small></h2><div class="list">`;
  for(const s of SPECIALS){
    let big="";
    if(s.kind==="attack"){const st=wStats(c.weapons[s.w]);big=`${sgn(st.hit)}<small>${c.weapons[s.w].dice}${sgn(st.mod)}</small>`}
    if(s.kind==="reduce")big=`−1d10+${c.level}<small>daño</small>`;
    if(s.kind==="flash")big=`${sgn(sv(c,"DES"))}<small>salv. DES</small>`;
    h+=`<button class="act" data-sr="${s.id}" ${S.sr[s.id]<=0?"disabled":""}><span class="n">${s.name}</span><span class="big">${big}</span><span class="d">${s.note} · quedan ${S.sr[s.id]}</span></button>`;
  }
  h+=`</div></section>`;
  const free=c.actions.map((a,i)=>[a,i]).filter(([a])=>a.cost==="gratis"&&!a.role&&!a.fruitAct&&(!a.only||S[a.only])&&formShows(c,a));
  if(free.length)h+=`<section><h2>Sin coste</h2><div class="list">${free.map(([a,i])=>actBtn(a,i)).join("")}</div></section>`;
  const out=c.actions.map((a,i)=>[a,i]).filter(([a])=>a.cost==="fuera"&&!a.role);
  if(out.length)h+=`<section><h2>Fuera de combate</h2><div class="list">${out.map(([a,i])=>actBtn(a,i)).join("")}</div></section>`;

  h+=`<section><h2>Salvaciones</h2><div class="saves">${Object.entries(c.saves).map(([k,[,p]])=>`<button class="${p?"pro":""}" data-save="${k}">${k}<span>${sgn(sv(c,k))}</span></button>`).join("")}</div>${c.passive?`<p class="note" style="margin-top:8px">${c.passive}</p>`:""}</section>`;
  if(c.abil)h+=`<section><details class="skills" ${skillsOpen?"open":""}><summary><h2><span>Habilidades</span><small>Percepción pasiva ${10+skillBonus(c,"percepcion")} · Perspicacia pasiva ${10+skillBonus(c,"perspicacia")}</small></h2></summary>
    ${["FUE","DES","INT","SAB","CAR"].map(ab=>`<div class="lvlhead"><b>${ab}</b><span class="tip">${sgn(abilOf(c)[ab])}</span></div><div class="sk">${SKILLS.filter(s=>s[3]===ab).map(([id,n,en])=>{const p=(c.skills||{})[id]||0;
      return`<button data-skill="${id}"><span>${n} <small class="en">${en}</small></span><b>${p?`<i class="dot" aria-label="${p>1?"pericia":"competente"}">${p>1?"●●":"●"}</i>`:""}${sgn(skillBonus(c,id))}</b></button>`}).join("")}</div>`).join("")}
    <p class="note" style="margin-top:8px">● competente · ●● pericia (competencia doble)</p></details></section>`;

  h+=`<section><h2>Sueños y prestigio</h2><div class="box2">
    <div class="resrow"><span>Puntos de sueño</span><div class="pips">${Array.from({length:c.level},(_,j)=>`<button class="pip gold ${j<S.dream?"":"used"}" data-dreamp="${j}" aria-label="Punto de sueño"></button>`).join("")}</div></div>
    <p class="note">+1d6 a un ataque, prueba o salvación (tras tirar), o convierte una salvación de muerte fallida en éxito. Se renuevan al subir de nivel.</p>
    <div class="prest"><span class="num">${S.prestige}</span><span class="lbl">Puntos de prestigio. Te los da el DM por acciones épicas.</span>
      <button class="btn gold" data-do="p+">+1</button><button class="btn" data-do="pspend">Gastar</button></div>
    ${spendOpen?`<div class="costs">${RARITY.map(([n,v])=>`<button data-buy="${v}" data-rn="${n}" ${S.prestige<v?"disabled":""}>${n} · ${v}</button>`).join("")}</div><p class="note">Avisa al DM qué avance compraste para agregarlo a tu ficha.</p>`:""}
    ${S.plog.length?`<div class="log">${S.plog.slice(0,5).map(l=>`<div>${l}</div>`).join("")}</div>`:""}
  </div></section>`;

  h+=`<section><h2>Recursos <small>toca para corregir</small></h2><div class="box2">${c.resources.map(r=>`<div class="resrow"><span>${r.name}<br><small style="font-weight:400">${{long:"desc. largo",short:"desc. corto",none:"manual"}[r.rest]}</small></span>${r.counter
    ?`<div class="cnt"><b>${S.res[r.id]}<small>/${r.max}</small></b><button class="btn" data-cnt="${r.id}" data-n="-1" aria-label="Quitar 1">−1</button><button class="btn" data-cnt="${r.id}" data-n="1" aria-label="Sumar 1">+1</button><button class="btn" data-cnt="${r.id}" data-n="max">${r.fill||"Llenar"}</button>${r.dawn?`<button class="btn" data-dawn="${r.id}">Amanecer +${r.dawn}</button>`:""}</div>`
    :`<div class="pips">${Array.from({length:r.max},(_,j)=>`<button class="pip ${j<S.res[r.id]?"":"used"}" data-res="${r.id}" data-j="${j}" aria-label="${r.name}"></button>`).join("")}</div>`}</div>`).join("")}</div></section>`;

  h+=`<section><h2>Estados</h2><div class="conds">${CONDS.map(x=>`<button data-cond="${x}" aria-pressed="${S.conds.includes(x)}">${x}</button>`).join("")}</div>
    <div class="resrow" style="margin-top:10px"><span>Agotamiento<br><small style="font-weight:400">baja 1 con descanso largo</small></span><div class="cnt"><b>${S.exh}<small>/6</small></b><button class="btn" data-exh="-1" aria-label="Quitar 1 nivel">−1</button><button class="btn" data-exh="1" aria-label="Sumar 1 nivel">+1</button></div></div></section>`;
  h+=`<section><h2>Descansos</h2><div class="row2">
     <button class="btn ${armed==="short"?"arm":""}" data-do="short">${armed==="short"?"Toca para confirmar":"Descanso corto"}</button>
     <button class="btn ${armed==="long"?"arm":""}" data-do="long">${armed==="long"?"Toca para confirmar":"Descanso largo"}</button></div></section>`;
  h+=`<section><h2>Historial</h2><div class="log">${S.log.length?S.log.map(l=>`<div>${l}</div>`).join(""):"<div>Aún no hay tiradas.</div>"}</div></section>`;
  h+=user?`<p class="note">Sincronizado con la nube como ${esc(user.email)}. Sin conexión se guarda en este teléfono y se sube al volver.</p>${outBtn}`
    :fb?`<p class="note">Los PV, usos y puntos se guardan solo en este teléfono.</p><button class="btn primary" data-do="login">Entrar con Google</button>`
    :`<p class="note">Los PV, usos y puntos se guardan en este teléfono.</p>`;
  $("main").innerHTML=h;
}
/* Acciones de una forma (form) solo en esa forma y con su opción elegida (opt); en una forma con hideAttacks se ocultan los ataques normales */
const formShows=(c,a)=>{const f=formOf(c);return a.form?S.form===a.form&&(!a.opt||S.formOpts.includes(a.opt)):!(f&&f.hideAttacks&&a.kind==="attack")};
function actBtn(a,i){
  const c=C();let big="",tags="";
  if(a.kind==="attack"||a.kind==="deflect"){const w=c.weapons[a.w],st=wStats(w);big=`${sgn(st.hit)}<small>${w.dice}${st.mod?sgn(st.mod):""} ${w.type}</small>`;if(st.h)tags+=`<span class="tag h">Haki</span>`;if(st.fr)tags+=`<span class="tag h">Frenesí</span>`}
  else if(a.kind==="dash")big=`CD ${a.dc}<small>salv. ${a.save}${a.dmg?" · "+a.dmg:""}</small>`;
  else if(a.kind==="pool")big=`${S.res[a.res]}<small>PV en reserva</small>`;
  else if(a.kind==="steel")big=`${sgn(a.hit)}<small>${a.dmg} × ${a.targets}</small>`;
  else if(a.kind==="heal")big=`${a.heal}<small>PV</small>`;
  else if(a.kind==="haki")big=S.hard>0?`${S.hard}<small>turnos</small>`:`+${c.hardening.bonus}<small>atq. y daño</small>`;
  else if(a.kind==="temproll")big=`+${a.temp}<small>PV temporales</small>`;
  else if(a.kind==="prestspend")big=`${a.prest}+<small>prestigio</small>`;
  else if(a.kind==="frenzy")big=S.frenzy?`<small>Activa</small>`:`+${c.frenzy.dmg}<small>daño</small>`;
  else if(a.kind==="transform"||a.kind==="toggle")big=a.kind==="transform"&&S.trans||a.kind==="toggle"&&S.turn[a.flag]?`<small>Activo</small>`:"";
  else if(a.kind==="group")big=a.temp?`+${a.temp}<small>PV temp. · ${a.t} criaturas</small>`:a.heal?`+${a.heal}<small>PV a aliados</small>`:"";
  else if(a.kind==="firstaid")big=`${a.heal}+nivel<small>PV · ${a.prest} prestigio</small>`;
  const out=a.res&&S.res[a.res]<=0&&!(a.kind==="haki"&&S.hard>0)||a.prest&&S.prestige<a.prest||a.once&&S.used[a.once]||a.perTurn&&S.turn[a.perTurn]||a.kind==="stay1"&&S.hp>0||a.needs&&!S.turn[a.needs]||a.kind==="form"&&(S.sea||S.form&&S.form!==a.form);
  const left=a.res?` · quedan ${S.res[a.res]}`:a.prest?` · tienes ${S.prestige} de prestigio${a.once&&S.used[a.once]?" · ya usado desde el último descanso":""}`:"";
  const on=a.kind==="haki"&&S.hard>0||a.kind==="frenzy"&&S.frenzy||a.kind==="transform"&&S.trans||a.kind==="toggle"&&S.turn[a.flag]||a.kind==="form"&&S.form===a.form;
  const d=a.kind==="haki"&&S.hard>0?"Activo · toca para terminarlo":a.kind==="frenzy"&&S.frenzy?"Activa · toca para terminarla (acción adicional)":a.kind==="transform"&&S.trans?`Activo · toca para terminarlo (acción adicional; ganas ${c.transform.exh} de agotamiento)`:a.note;
  const ico=a.companion?"companion":a.kind==="haki"||a.haki?"haki":a.kind==="attack"?"weapon":"";
  return `<button class="act ${on?"on":""}" data-act="${i}" ${out&&!on?"disabled":""}><span class="n">${ico?sico(ico):""}${a.name}${tags}</span><span class="big">${big}</span><span class="d">${d}${left}</span></button>`;
}

/* ===================== FORMAS ZOAN ===================== */
/* forms: {id:{name, hp (PV propios, opcional), ac, apa (ataques por acción), scores (FUE/DES/CON nuevas), pick + opts (opciones a elegir), bar, endCost}} */
function startForm(c,k,opts){const f=c.forms[k];S.form=k;S.formOpts=opts;if(f.hp){S.humanHp=S.hp;S.hp=f.hp}}
function endForm(c){const f=formOf(c);if(f&&f.hp)S.hp=S.humanHp;S.form="";S.formOpts=[]}
function formPicker(c,i){const a=c.actions[i],f=c.forms[a.form],sel=T.fsel;
  return`<div class="trayact">${f.opts.map(o=>`<button class="btn ${sel.includes(o.id)?"primary":""}" data-do="fpick" data-o="${o.id}" aria-pressed="${sel.includes(o.id)}">${o.n}</button>`).join("")}</div>
    <div class="trayact"><button class="btn gold" data-do="fgo" ${sel.length===f.pick?"":"disabled"}>Transformarse (${sel.length}/${f.pick})</button></div>`}
/* Inventario de munición especial (items): cada uno se dispara con su coste y CD propia, y gasta una unidad */
function itemSec(c){
  return`<section><h2>${c.itemsName} <small>CD ${c.itemsDc} · ${c.itemsNote}</small></h2><div class="list">${c.items.map(x=>{const n=S.items[x.id];
    return`<button class="act" data-item="${x.id}" ${n>0?"":"disabled"}><span class="n">${x.n}<span class="tag">${n}/${x.max}</span></span><span class="big">${x.sv?`CD ${c.itemsDc}<small>salv. ${x.sv}${x.dmg?" · "+x.dmg:""}</small>`:x.dmg?`${x.dmg}<small>${x.ty}</small>`:""}</span><span class="d">${COST[x.c]||x.c} · ${x.sum}</span></button>`}).join("")}
    <button class="btn gold" data-do="harvest">${c.itemsFill}</button></div></section>`}

/* ===================== MASCOTA ===================== */
/* companion: name, kind, hp, ac, dc, atk, heads (cabezas) y headDmg (daño en un turno que puede matar una cabeza), tfName (transformación), attacks.
   Ataque con multi:"heads": un ataque por cabeza viva. Estado en S.comp: hp, temp, heads, tf, turnDmg. La mascota actúa en su propio turno: no gasta acciones del personaje */
function compSec(c){
  const cp=c.companion,k=S.comp,pct=Math.max(0,k.hp/cp.hp*100),down=k.hp<=0;
  return`<section><h2><span class="h2t">${sico("companion")}Mascota</span> <small>${cp.name} · ${cp.kind} · CA ${cp.ac}</small></h2><div class="box2">
    <div class="hp"><div class="hpbar"><div class="hptxt"><span><b>${k.hp}</b>${k.temp?` <span class="t">+${k.temp}</span>`:""} / ${cp.hp} PV${down?" · cae":""}</span><span>${cp.heads?`Cabezas ${k.heads}/${cp.heads}`:""}</span></div>
      <div class="track"><div class="fill ${pct<25?"low":pct<50?"mid":""}" style="width:${Math.max(0,k.hp)/(cp.hp+k.temp)*100}%"></div>${k.temp?`<div class="fill tp" style="width:${k.temp/(cp.hp+k.temp)*100}%"></div>`:""}</div></div>
      <div class="hpctl"><input class="hpin" id="compin" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="Cantidad de PV de ${cp.name}">
      <button class="hpbtn dmg" data-cdo="dmg">Daño</button><button class="hpbtn heal" data-cdo="heal">Curar</button><button class="hpbtn tmp" data-cdo="temp" aria-label="PV temporales de ${cp.name}">Temp.</button></div></div>
    ${cp.heads?`<div class="resrow"><span>Cabezas vivas<br><small style="font-weight:400">${cp.headDmg}+ de daño en un turno puede matar una</small></span><div class="cnt"><b>${k.heads}<small>/${cp.heads}</small></b><button class="btn" data-chead="-1" aria-label="Quitar una cabeza">−1</button><button class="btn" data-chead="1" aria-label="Sumar una cabeza">+1</button></div></div>`:""}
    ${k.turnDmg?`<p class="note">Daño recibido este turno: ${k.turnDmg}</p>`:""}</div>
    <div class="list" style="margin-top:8px">
    ${cp.tfName?`<button class="act ${k.tf?"on":""}" data-do="ctf" aria-pressed="${k.tf}"><span class="n">${cp.tfName}</span><span class="big">${k.tf?"<small>Transformado</small>":""}</span><span class="d">${cp.tfNote}${k.tf?" · toca para volver":""}</span></button>`:""}
    ${cp.attacks.map(a=>{const n=a.multi?k.heads:1,out=down||!n||a.res&&S.res[a.res]<=0;
      const big=a.sv?`CD ${cp.dc}<small>salv. ${a.sv} · ${a.dmg}</small>`:`${sgn(cp.atk)}<small>${a.multi?n+" × ":""}${a.dmg}${a.dmg2?" + "+a.dmg2:""}</small>`;
      return`<button class="act" data-cact="${a.id}" ${out?"disabled":""}><span class="n">${a.n}</span><span class="big">${big}</span><span class="d">${[a.r,a.sum,a.res?`quedan ${S.res[a.res]}`:""].filter(Boolean).join(" · ")}</span></button>`}).join("")}
    </div></section>`}

/* ===================== ROL EN LA TRIPULACIÓN ===================== */
/* role: name, passive (nombre del pasivo), desc, tools (competencias), out (nota fuera de combate). Sus acciones van en actions con role:true */
function roleSec(c){
  const r=c.role,acts=c.actions.map((a,i)=>[a,i]).filter(([a])=>a.role),fa=acts.find(([a])=>a.kind==="firstaid");
  return`<section><h2><span class="h2t">${sico("role")}Rol en la tripulación</span> <small>${r.name}</small></h2><div class="box2"><p class="note"><b>${r.passive}</b> (pasivo). ${r.desc}</p>${r.tools?`<p class="note">Competencias: ${r.tools}.</p>`:""}</div>
    <div class="list" style="margin-top:8px">${acts.map(([a,i])=>actBtn(a,i)).join("")}</div>
    ${fa&&S.aided.length?`<p class="note" style="margin-top:8px">Ya recibieron ${fa[0].name}: ${S.aided.map(esc).join(", ")}. Se libera con un descanso corto o largo.</p>`:""}
    ${r.out?`<p class="note" style="margin-top:8px">${r.out}</p>`:""}</section>`;
}

/* ===================== FRUTA DEL DIABLO ===================== */
function fruitSec(c){
  const f=c.fruit,sea=S.sea,ch=S.res.cargas,w=!sea&&S.mw&&f.weapons[S.mw];
  let h=`<section><h2><span class="h2t">${sico("fruit")}Fruta del diablo</span> <small>${f.name} · CD ${f.dc}${f.noCharges?"":` · ataque ${sgn(f.atk)} · cargas ${ch}/${c.level+c.prof}`}</small></h2><div class="list">
    <button class="act ${sea?"on":""}" data-do="sea" aria-pressed="${sea}"><span class="n">${f.seaLabel}</span><span class="big">${sea?"Activa":""}</span><span class="d">${sea?f.seaNote+" Toca para quitarla.":f.seaHint}</span></button>`;
  if(w)h+=`<button class="act" data-mwatk="1" ${sea?"disabled":""}><span class="n">${w.name}<span class="tag">Mágica</span></span><span class="big">${sgn(w.hit)}<small>${w.dice}${w.mod?sgn(w.mod):""} ${w.type}</small></span><span class="d">Acción de Atacar · alcance 15 pies en tu turno${w.note?" · "+w.note:""}</span></button>`;
  h+=f.free.map((a,i)=>`<button class="act" data-free="${i}" ${sea?"disabled":""}><span class="n">${a.name}</span><span class="big">${a.kind==="mweapon"&&w?`<small>Activa: ${w.name}</small>`:""}</span><span class="d">${COST[a.cost]} · sin cargas · ${a.note}</span></button>`).join("");
  h+=c.actions.map((a,i)=>a.fruitAct?actBtn(a,i):"").join("");
  h+=f.tech.map(t=>`<button class="act" data-tech="${t.id}" ${sea||ch<t.l||t.locked?"disabled":""}><span class="n">${t.n}<span class="tag">${t.locked?"Bloqueado":t.l?`${t.l} ${t.l===1?"carga":"cargas"}`:"Gratis"}</span>${t.conc?`<span class="tag">Conc.</span>`:""}</span><span class="big">${t.hits?`${sgn(f.atk)}<small>${t.dmg} × ${t.hits}</small>`:t.sv?`CD ${f.dc}<small>salv. ${t.sv}${t.dmg?" · "+t.dmg:""}</small>`:""}</span><span class="d">${spellLine(t)}${t.pw?" · se puede potenciar":""}</span></button>`).join("");
  return h+`</div><p class="note" style="margin-top:8px">${sea?f.seaNote:f.passive}</p></section>`;
}

/* ===================== CONJUROS ===================== */
const spellLine=s=>[COST[s.c]||s.c,s.r,s.d&&s.d!=="Instantáneo"?s.d:""].filter(Boolean).join(" · ");
function spellTags(c,id){const s=SPELLS[id];
  return(c.caster.domain.includes(id)?`<span class="tag">Dominio</span>`:"")+(s.conc?`<span class="tag">Conc.</span>`:"")+(s.rit?`<span class="tag">Ritual</span>`:"")}
function spellBig(c,s){const k=c.caster,dm=s.dmg?spellDice(s.dmg,s,s.l,c):"",ty=s.ty&&s.ty.length<12?" "+s.ty:"";
  if(s.atk)return`${sgn(k.atk)}<small>${dm}${ty}</small>`;
  if(s.sv)return`CD ${k.dc}<small>salv. ${s.sv}${dm?" · "+dm:""}</small>`;
  if(s.heal)return`${spellDice(s.heal,s,s.l,c)}${s.hm?sgn(k.mod):""}<small>PV</small>`;
  if(s.fix)return`+${s.fix}<small>${s.fixL}</small>`;
  if(dm)return`${dm}<small>${ty}</small>`;
  return"";
}
function spellSec(c){
  const k=c.caster,known=[...S.spells.c,...k.domain,...S.spells.p];
  let h=`<section><h2>Conjuros <small>CD ${k.dc} · ataque ${sgn(k.atk)}</small></h2>`;
  if(S.spells.c.length<k.cantrips||!S.spells.p.length)h+=`<p class="note">Elige tus trucos y conjuros en "Preparar conjuros".</p>`;
  for(let l=0;l<=k.slots.length;l++){
    const ids=known.filter(id=>SPELLS[id].l===l).sort((a,b)=>SPELLS[a].n.localeCompare(SPELLS[b].n));
    if(!l&&!ids.length)continue;
    h+=`<div class="lvlhead"><b>${l?"Nivel "+l:"Trucos"}</b>${l?`<span class="pips">${Array.from({length:k.slots[l-1]},(_,j)=>`<button class="pip ${j<S.slots[l-1]?"":"used"}" data-slot="${l-1}" data-j="${j}" aria-label="Espacio de nivel ${l}"></button>`).join("")}</span>`:""}</div>
      <div class="list">${ids.map(id=>{const s=SPELLS[id],can=!s.l||s.rit||S.slots.some((v,i)=>i+1>=s.l&&v>0);
        return`<button class="act" data-spell="${id}" ${can?"":"disabled"}><span class="n">${s.n} <small class="en">${s.en}</small>${spellTags(c,id)}</span><span class="big">${spellBig(c,s)}</span><span class="d">${spellLine(s)}</span></button>`}).join("")}</div>`;
  }
  return h+`</section>`;
}
function prepView(c){
  const k=c.caster,nc=S.spells.c.length,np=S.spells.p.length;
  let h=`<section><h2>Preparar conjuros <small>Trucos ${nc}/${k.cantrips} · Preparados ${np}/${k.prepared}</small></h2>
    <p class="note">Elige exactamente ${k.cantrips} trucos y hasta ${k.prepared} conjuros. Los ${k.domain.length} de dominio siempre están preparados y no cuentan. Por reglas, los conjuros preparados se cambian al terminar un descanso largo.</p>
    ${nc<k.cantrips?`<p class="warn">Te faltan ${k.cantrips-nc} trucos.</p>`:""}`;

/* ===================== ECONOMÍA DEL TURNO ===================== */
function spend(cost){

const esc=s=>String(s??"").replace(/[&<>"']/g,ch=>"&#"+ch.charCodeAt(0)+";");
let fb=null,user=null,admin=false,view="char",mesa={state:{},players:[]},unsub=[],stateUnsub=null,pushT=null;

async function cloudInit(){
  if(!FIREBASE)return;
  try{
    const [A,U,F]=await Promise.all(["app","auth","firestore"].map(m=>import(FB+m+".js")));
    const app=A.initializeApp(FIREBASE);let db;
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    fb={U,F,db,auth:U.getAuth(app)};
  }catch(e){return} // sin internet y sin la librería en caché: sigue en modo local
  render();
  fb.U.onAuthStateChanged(fb.auth,signedIn);
}
async function signedIn(u){
  unsub.forEach(f=>f());unsub=[];if(stateUnsub){stateUnsub();stateUnsub=null}
  user=u;admin=false;
  if(!u){view="login";render();return}
  view="load";render();
  const {F,db}=fb;
  try{admin=(await F.getDoc(F.doc(db,"admins",u.uid))).exists()}catch(e){}
  if(admin){
    unsub.push(F.onSnapshot(F.collection(db,"state"),q=>{q.forEach(d=>mesa.state[d.id]=d.data());if(view==="mesa")render()}));
    unsub.push(F.onSnapshot(F.collection(db,"players"),q=>{mesa.players=q.docs.map(d=>({id:d.id,...d.data()}));
      const me=mesa.players.find(p=>p.id===u.uid);if(me)setLook(me.look,true);if(view==="mesa")render()}));
    view="mesa";render();return;
  }
  const ref=F.doc(db,"players",u.uid);
  unsub.push(F.onSnapshot(ref,d=>{
    if(!d.exists()){if(!d.metadata.fromCache)F.setDoc(ref,{name:u.displayName||"",email:u.email||"",char:null});return}
    const k=d.data().char;setLook(d.data().look,true);
    if(CHARS[k])openChar(k);else{if(stateUnsub){stateUnsub();stateUnsub=null}view="wait";render()}
  }));
}
/* shortcut: gana la última escritura; si dos teléfonos editan el mismo personaje a la vez, uno pisa al otro */
function openChar(k){
  if(stateUnsub&&cur===k&&view==="char")return;
  if(pushT)push(); // sube lo pendiente antes de cambiar de personaje
  if(stateUnsub)stateUnsub();
  cur=k;load();view="char";store.set("mc:cur",cur);render();
  stateUnsub=fb.F.onSnapshot(fb.F.doc(fb.db,"state",k),d=>{
    if(cur!==k||pushT||d.metadata.hasPendingWrites)return;
    if(!d.exists()){if(!d.metadata.fromCache)push();return}
    const s=merge(C(),d.data());
    if(JSON.stringify(s)!==JSON.stringify(S)){S=s;store.set("mc2:"+cur,S);render()}
  });
}
/* La apariencia viaja en el documento del jugador (o del DM) para seguirlo a otros dispositivos */
function lookToCloud(v){if(fb&&user)fb.F.setDoc(fb.F.doc(fb.db,"players",user.uid),{look:v},{merge:true}).catch(e=>console.warn("No se pudo guardar la apariencia",e))}
function push(){clearTimeout(pushT);pushT=null;if(!fb||!user)return;
  fb.F.setDoc(fb.F.doc(fb.db,"state",cur),{...S,by:user.uid,at:fb.F.serverTimestamp()}).catch(e=>console.warn("No se pudo guardar en la nube",e))}

/* ===================== SALVACIONES DE MUERTE ===================== */
/* r: d20 natural (tirado por la app o anotado por el jugador) */
function deathSave(r){
  if(r===20){S.hp=1;S.ds={ok:0,ko:0};show({title:"¡Recuperas la consciencia!",boxes:[{l:"d20",v:20,s:"Vuelves con 1 PV",cls:"crit"}]})}
  else{const ok=r>=10;if(ok)S.ds.ok++;else S.ds.ko+=(r===1?2:1);
    show({title:"Salvación de muerte",warn:S.ds.ok>=3?"Estable":"",boxes:[{l:"d20",v:r,s:ok?"Éxito":r===1?"Dos fallos":"Fallo",cls:ok?"":"fail"}],
      html:!ok&&S.dream>0?`<div class="trayact"><button class="btn gold" data-do="dreamsave" data-n="${r===1?2:1}">Gastar punto de sueño: convertir en éxito</button></div>`:""})}
  log(`Salvación de muerte: ${r}`)}
function dreamsRoll(r){
  if(r>=12){S.hp=1;S.ds={ok:0,ko:0};show({title:"¡No abandono mis sueños!",boxes:[{l:"d20",v:r,s:"Te levantas con 1 PV",cls:"crit"}]})}
  else{S.dead=true;show({title:"No abandonaré mis sueños",boxes:[{l:"d20",v:r,s:"Necesitabas 12 o más",cls:"fail"}]})}log(`No abandonaré mis sueños: ${r}`)}

/* ===================== DAÑO RECIBIDO ===================== */
/* PV temporales primero; una forma con PV propios absorbe el daño y, si llega a 0, vuelve a forma humana con el daño sobrante.
   Luego: fin del frenesí y de la concentración a 0 PV, CD de concentración y ofertas de rasgos con trigger ("half" o "zero") */
function takeDamage(c,n){
  const before=S.hp;dropPrev={frenzy:S.frenzy,muscle:S.muscle,conc:{...S.conc}};const ab=Math.min(S.temp,n);S.temp-=ab;let rest=n-ab;
  const f=formOf(c);
  if(f&&f.hp&&rest>=S.hp){const ex=rest-S.hp;S.hp=S.humanHp;S.form="";S.formOpts=[];rest=ex;log(`Vuelve a forma humana${ex?`: ${ex} de daño sobrante`:""}`)}
  S.hp=Math.max(0,S.hp-rest);log(`Recibe <b>${n}</b> de daño${ab?` (${ab} a PV temporales)`:""}`);
  if(S.hp<=0&&S.form){log(`Vuelve a forma humana (${formOf(c).name})`);endForm(c)}
  const offers=c.actions.map((x,i)=>x.trigger&&!S.used[x.once]&&(x.trigger==="half"?S.hp>0&&S.hp<=mhp(c)/2:S.hp<=0&&before>0)?`<button class="btn gold" data-act="${i}">${x.name}</button>`:"").join("");
  if(S.hp>0)dropPrev=null;
  if(S.hp<=0&&S.frenzy){S.frenzy=false;S.muscle="";log(`Termina ${c.frenzy.name}: queda inconsciente`)}
  if(S.conc.id&&S.hp<=0){log(`Pierde la concentración en ${concOf(c,S.conc.id).n}`);S.conc={id:"",lvl:0}}
  else if(S.conc.id){const dc=Math.max(10,Math.floor(n/2));
    show({title:"Concentración",boxes:[{l:"CD salvación CON",v:dc,s:"10 o la mitad del daño, lo que sea mayor"}],tip:`Si fallas, pierdes la concentración en ${concOf(c,S.conc.id).n}.`,
      html:`<div class="trayact"><button class="btn primary" data-do="concsave" data-dc="${dc}">Tirar salvación de CON (${sgn(sv(c,"CON"))})</button>${offers}</div>`})}
  if(offers&&!(S.conc.id&&S.hp>0))show({title:"Daño recibido",boxes:[{l:"PV",v:S.hp,s:"de "+mhp(c)}],html:`<div class="trayact">${offers}</div>`,tip:S.hp<=0?"Puedes evitar caer inconsciente.":"Quedaste con la mitad de tus PV o menos."})
}

    if(warn)t.warn=warn;t.nat=null;b.v=`1d20 ${sgnS(t.p.mod)}`;b.s=`${x.name}: vuelve a tirar el d20 y anota el nuevo resultado`;b.cls="";

  if(act==="reroll"){const x=c.rerolls[+(ds.i||0)],b=T.boxes[T.d20],warn=x.react?spend("reaccion"):"",r=d20(),old=T.raw;S.res[x.res]--;T.rerolled=true;

  if(act==="forerep"){const f=S.fore[+ds.i],b=T.boxes[T.d20],old=T.raw;f.u=true;S.turn.fore=true;T.foreUsed=true;
    b.v=(+b.v)-old+f.v;b.s+=` · presagio: ${old} → ${f.v}`;b.cls=f.v===20?"crit":f.v===1?"fail":"";T.raw=f.v;log(`Presagio ${f.v} reemplaza un ${old}`);drawTray();save();render();return}
  if(act==="init"&&phys()){show({title:"Iniciativa",d20:0,boxes:[d20Box("Iniciativa",ini(c),mode)],p:{mod:ini(c),dmg:[],fmt:tot=>`<b>Iniciativa</b>: ${tot}`}});log("<b>Iniciativa</b>");T.logLine=S.log[0];save();return}
  if(act==="init"){const r=d20();show({title:"Iniciativa",d20:0,boxes:[{l:"Iniciativa",v:r.v+ini(c),s:`d20 ${r.txt} ${sgn(ini(c))}`}]});log(`<b>Iniciativa</b>: ${r.v+ini(c)}`)}
  if(act==="turn"){S.turn=newTurn(c);S.muscle="";S.stageAC=false;if(c.companion)S.comp.turnDmg=0;if(S.hard>0){S.hard--;if(S.hard===0)log("Endurecimiento terminado")}$("tray").classList.add("hide");log("— Nuevo turno —");
    /* En frenesí, Postura de hierro se ofrece al inicio de cada turno */
