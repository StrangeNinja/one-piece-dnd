<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mesa de Combate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Spectral+SC:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: una columna estrecha tipo "tablero de turno": encabezado fijo con PV y economía del turno, acciones agrupadas por coste, bandeja de resultado anclada abajo */
/* ===== Paletas (mismo bloque en index.html y dm.html) =====
   data-pal en <html>: grand (predeterminada) · bandera · paja. data-theme: light (día) · dark (noche).
   Colores de estado: iguales en todas, salvo el daño en las paletas de acento rojo y los PV temporales en Grand Line (acento azul). */
:root,[data-pal]{--good:#1f7a45;--bad:#b3261e;--warn:#8f5b00;--haki:#3f3486;--temp:#2b5ea8;--foe:#6d2b80;--shadow:rgba(0,0,0,.14);color-scheme:light}
[data-pal][data-theme="dark"]{--good:#5cc98c;--bad:#ff8a80;--warn:#eab14d;--haki:#b7a9f2;--temp:#86b2f0;--foe:#cf9be6;--shadow:rgba(0,0,0,.55);color-scheme:dark}
:root,[data-pal="grand"]{--bg:#eef3f7;--surface:#ffffff;--ink:#10243a;--muted:#4f6378;--line:#cfdae4;--chip:#e1e9f0;--accent:#1d5c8f;--accent-ink:#ffffff;--gold:#8e6607;--temp:#00737a}
[data-pal="bandera"]{--bg:#f2f0ee;--surface:#ffffff;--ink:#1a1a1a;--muted:#5e5a56;--line:#dcd7d2;--chip:#e7e3df;--accent:#b0202a;--accent-ink:#ffffff;--gold:#7d5f17;--bad:#9d1a5f}
[data-pal="paja"]{--bg:#fbf5e6;--surface:#fffdf6;--ink:#2b2416;--muted:#6b5f47;--line:#ebdfc2;--chip:#f2e8cf;--accent:#b8342a;--accent-ink:#ffffff;--gold:#8c6807;--bad:#9d1a5f}
[data-pal="grand"][data-theme="dark"]{--bg:#0b1622;--surface:#13233a;--ink:#e6eef6;--muted:#93a6ba;--line:#22364f;--chip:#1b2d47;--accent:#5fa8e6;--accent-ink:#0b1622;--gold:#e8c15a;--temp:#4fd3dc}
[data-pal="bandera"][data-theme="dark"]{--bg:#0e0e10;--surface:#1a1a1d;--ink:#ededed;--muted:#a3a3a8;--line:#2c2c31;--chip:#242428;--accent:#ff5a5f;--accent-ink:#0e0e10;--gold:#d9b45a;--bad:#ff8fc4}
[data-pal="paja"][data-theme="dark"]{--bg:#1b160c;--surface:#262012;--ink:#f3ead6;--muted:#b5a88a;--line:#3a3120;--chip:#322a19;--accent:#ee7466;--accent-ink:#1b160c;--gold:#f0c24b;--bad:#ff8fc4}
.lk{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(420px,calc(100vw - 32px));box-shadow:0 12px 32px var(--shadow)}
.lk::backdrop{background:var(--shadow)}
.lk-in{padding:14px;display:flex;flex-direction:column}
.lk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lk-top b{font-family:var(--f-display);font-size:20px}
.lk h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.lk-pal{display:flex;flex-direction:column;gap:6px}
.lk-pal button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;text-align:left}
.lk-pal button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.sw{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex-shrink:0}
.sw i{width:14px;height:22px}
.sw i:nth-child(1){background:var(--bg)} .sw i:nth-child(2){background:var(--surface)} .sw i:nth-child(3){background:var(--accent)} .sw i:nth-child(4){background:var(--gold)}
.lk-mode{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px}
.lk-mode button{padding:8px 4px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.lk-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.ico{width:20px;height:20px;display:block}
/* ===== fin de paletas ===== */
:root{
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 240px;
  -webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{display:flex;gap:8px;padding-top:14px;overflow-x:auto}
.pick:empty{display:none}
.pick button{padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header.hero{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.who{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--f-display);font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.stats{display:flex;gap:6px;flex-shrink:0}
.stat{display:flex;flex-direction:column;align-items:center;min-width:50px;padding:4px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.stat b{font-size:20px;line-height:1.1}
.stat small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button.stat:active{transform:scale(.96)}
.hp{display:flex;align-items:center;gap:8px}
.hpbar{flex:1;min-width:0}
.hptxt{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.hptxt span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hptxt b{font-size:22px;color:var(--ink)}
.track{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:3px}
.fill{height:100%;background:var(--good);transition:width .25s}
.fill.mid{background:var(--gold)} .fill.low{background:repeating-linear-gradient(135deg,var(--bad) 0 6px,transparent 6px 9px)}
.hpin{width:60px;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;text-align:center}
.hpbtn{padding:9px 10px;border-radius:8px;font-weight:700;font-size:14px}
.hpbtn.dmg{background:var(--bad);color:var(--bg)} .hpbtn.heal{background:var(--good);color:var(--bg)}
/* Símbolo además del color: en las paletas rojas el daño no depende solo del tono */
.hpbtn.dmg::before{content:"− "} .hpbtn.heal::before{content:"+ "}

.turn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.econ{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:12.5px;font-weight:700}
.econ i{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block}
.econ.spent{opacity:.45} .econ.spent i{background:var(--muted)}
.econ.haki{border-color:var(--haki);background:var(--haki);color:var(--bg)} .econ.haki i{background:var(--bg)}
.newturn{margin-left:auto;padding:7px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}

.adv{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px}
.adv button{padding:8px 4px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.adv button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}

section h2{font-family:var(--f-display);font-size:19px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 small{font-family:var(--f-body);font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700;text-align:right}
.list{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;transition:transform .08s}
.act:active{transform:scale(.985);border-color:var(--accent)}
.act .n{font-weight:700;font-size:17px;min-width:0}
.act .d{grid-column:1;color:var(--muted);font-size:13px;min-width:0}
.act .big{grid-row:1 / span 2;grid-column:2;text-align:right;font-weight:700;font-size:18px;color:var(--accent);line-height:1.15}
.act .big small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.act.on{border-color:var(--haki);box-shadow:inset 0 0 0 1.5px var(--haki)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.h{background:var(--haki);color:var(--bg)}
.act[disabled]{opacity:.45}

.saves{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.saves button{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.saves button span{color:var(--muted);font-size:13px}
.saves button.pro{border-color:var(--accent)}

.box2{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
.resrow{display:flex;align-items:center;gap:10px;font-size:14px}
.resrow > span:first-child{flex:0 0 120px;color:var(--muted);font-weight:700;line-height:1.2}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:var(--accent)}
.pip.used{background:transparent;opacity:.5}
.pip.gold{border-color:var(--gold);background:var(--gold)} .pip.gold.used{background:transparent}

.prest{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prest .num{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--gold);min-width:44px}
.prest .lbl{font-size:13px;color:var(--muted);flex:1;min-width:120px}
.costs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.costs button{padding:10px;border-radius:10px;background:var(--gold);color:var(--bg);font-weight:700;font-size:14px}
.costs button[disabled]{background:var(--chip);color:var(--muted)}

.conds{display:flex;flex-wrap:wrap;gap:6px}
.conds button{padding:7px 11px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:14px;font-weight:700}
.conds button[aria-pressed="true"]{background:var(--bad);color:var(--bg)}

.death{padding:12px 14px;border-radius:12px;border:2px solid var(--bad);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.death b{color:var(--bad)}
.dsrow{display:flex;gap:16px;font-size:14px;align-items:center;flex-wrap:wrap}
.ds{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:inline-block;margin-left:3px;vertical-align:-3px}
.ds.on{background:currentColor}
.ok{color:var(--good)} .ko{color:var(--bad)}
.btn{padding:10px 14px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);color:var(--bg)}
.btn[disabled]{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn.arm{background:var(--gold);color:var(--bg)}

.log{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}
.log b{color:var(--ink)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--accent);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 24px var(--shadow);transition:transform .22s;max-height:75vh;overflow-y:auto}
.tray.hide{transform:translateY(110%)}
.tray .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.tray .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tray .title{font-family:var(--f-display);font-size:20px;min-width:0}
.tray .x{padding:6px 10px;border-radius:8px;background:var(--chip);font-size:13px;font-weight:700}
.res{display:flex;gap:8px;flex-wrap:wrap}
.res .box{flex:1;min-width:120px;padding:8px 12px;border-radius:10px;background:var(--bg)}
.res .box small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.res .box b{font-size:32px;line-height:1.1;display:block;animation:pop .25s ease-out}
.res .box span{font-size:13px;color:var(--muted);display:block}
.res .crit b{color:var(--gold)} .res .fail b{color:var(--bad)} .res .ex b{color:var(--accent)}
.warn{font-size:13px;color:var(--bad);font-weight:700}
.tip{font-size:13px;color:var(--muted)}
.trayact{display:flex;gap:8px;flex-wrap:wrap}
.trayact .btn{flex:1;min-width:140px}
.multi{display:flex;flex-direction:column;gap:4px;font-size:15px}
.multi div{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;background:var(--bg)}
.multi .crit{color:var(--gold);font-weight:700}
.lvls{display:flex;gap:8px;flex-wrap:wrap}
select{flex:1;min-width:0;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
code{font-size:12px;word-break:break-all;user-select:all}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.resrow > span:first-child{flex-basis:96px}.saves{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
/* Apariencia (paleta y modo): mismo código y misma clave de localStorage en index.html y dm.html */
const PALS={grand:"Grand Line",bandera:"Bandera pirata",paja:"Sombrero de paja"},MODES={auto:"Automático",day:"Día",night:"Noche"},LOOK_KEY="mc:look";
const ICON=`<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><circle cx="7" cy="5" r="2.2" fill="currentColor"/><circle cx="13" cy="10" r="2.2" fill="currentColor"/><circle cx="8" cy="15" r="2.2" fill="currentColor"/></svg>`;
const darkQ=matchMedia("(prefers-color-scheme: dark)");
const okLook=v=>v&&PALS[v.pal]&&MODES[v.mode]?{pal:v.pal,mode:v.mode}:null;
function readLook(){try{return okLook(JSON.parse(localStorage.getItem(LOOK_KEY)))}catch(e){return null}}
let look=readLook()||{pal:"grand",mode:"auto"};
const isDark=()=>look.mode==="night"||(look.mode==="auto"&&darkQ.matches);
function applyLook(){const r=document.documentElement;r.dataset.pal=look.pal;r.dataset.theme=isDark()?"dark":"light";
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(r).getPropertyValue("--bg").trim();
  const d=document.getElementById("lk");if(d&&d.open)drawLook()}
/* fromCloud: el valor viene de Firebase, no hay que volver a subirlo */
function setLook(v,fromCloud){v=okLook(v);if(!v||(v.pal===look.pal&&v.mode===look.mode))return;look=v;
  try{localStorage.setItem(LOOK_KEY,JSON.stringify(look))}catch(e){}
  applyLook();if(!fromCloud&&typeof lookToCloud==="function")lookToCloud(look)}
function drawLook(){const t=isDark()?"dark":"light";
  document.getElementById("lk").innerHTML=`<div class="lk-in"><div class="lk-top"><b>Apariencia</b><button class="btn" data-lk="close">Cerrar</button></div>
  <h3>Paleta</h3><div class="lk-pal">${Object.entries(PALS).map(([k,n])=>`<button data-lkpal="${k}" aria-pressed="${look.pal===k}"><span class="sw" data-pal="${k}" data-theme="${t}"><i></i><i></i><i></i><i></i></span>${n}</button>`).join("")}</div>
  <h3>Modo</h3><div class="lk-mode">${Object.entries(MODES).map(([k,n])=>`<button data-lkmode="${k}" aria-pressed="${look.mode===k}">${n}</button>`).join("")}</div></div>`}
function openLook(){let d=document.getElementById("lk");
  if(!d){d=document.createElement("dialog");d.id="lk";d.className="lk";d.setAttribute("aria-label","Apariencia");document.body.append(d);
    d.addEventListener("click",e=>{const b=e.target.closest("button");if(e.target===d||(b&&b.dataset.lk==="close"))return d.close();if(!b)return;
      const sel=b.dataset.lkpal?`[data-lkpal="${b.dataset.lkpal}"]`:`[data-lkmode="${b.dataset.lkmode}"]`;
      setLook(b.dataset.lkpal?{...look,pal:b.dataset.lkpal}:{...look,mode:b.dataset.lkmode});d.querySelector(sel)?.focus()})}
  drawLook();d.showModal()}
applyLook();darkQ.addEventListener("change",applyLook);
addEventListener("storage",e=>{if(e.key===LOOK_KEY){const v=readLook();if(v){look=v;applyLook()}}});
</script>
</head>
<body>

<div class="wrap">
  <div class="pick" id="pick"></div>
  <header class="hero" id="hero"></header>
  <div id="main" class="wrap"></div>
</div>
<div class="tray hide" id="tray" role="status" aria-live="polite"><div class="in" id="trayin"></div></div>

<script>
/* ===================== PERSONAJES ===================== */
/* Armas: hit y mod SIN Haki; el Endurecimiento suma su bono cuando está activo. */
const CHARS = {
  udon:{
    name:"Udon", sub:"Guerrero · Black Weapon · Nivel 7 · Humano · Samurái",
    level:7, prof:3, ac:15, maxHp:66, init:1, speed:"30 pies",
    critMin:18, attacksPerAction:2,
    saves:{FUE:[8,1],DES:[1,0],CON:[6,1],INT:[-1,0],SAB:[0,0],CAR:[0,0]},
    hardening:{bonus:3,res:"haki",turns:10},
    execute:{dice:"2d6",type:"trueno",res:"ejecutar",note:"CD 16 de FUE o empujado 10 pies y derribado"},
    blackArmory:true,
    weapons:{
      main:{name:"Katana principal",hit:8,dice:"1d8",mod:5,type:"cortante"},
      sc:{name:"Katana del Shogun Carmesí",hit:10,dice:"1d8",mod:7,type:"cortante"}
    },
    resources:[
      {id:"ejecutar",name:"Ejecutar",max:3,rest:"long"},
      {id:"embestida",name:"Golpe embestida",max:3,rest:"long"},
      {id:"haki",name:"Endurecimiento (Haki)",max:3,rest:"long"},
      {id:"viento",name:"Viento de Acero",max:1,rest:"long"},
      {id:"aliento",name:"Tomar aliento",max:1,rest:"short"},
      {id:"oleada",name:"Oleada de acción",max:1,rest:"short"}
    ],
    actions:[
      {cost:"accion",kind:"attack",w:"main",name:"Katana principal",note:"Atacar: 2 golpes por acción (Ataque extra)"},
      {cost:"accion",kind:"dash",name:"Golpe embestida",res:"embestida",dc:16,save:"DES",dmg:"2d8+5",type:"cortante",note:"Embistes en línea recta hasta 20 pies sin provocar ataques. Afecta a todos a 5 pies del recorrido"},
      {cost:"accion",kind:"steel",name:"Golpe de Viento de Acero",res:"viento",hit:8,dmg:"6d10",type:"fuerza",targets:5,note:"Katana del Shogun · hasta 5 objetivos a 30 pies, luego te teletransportas junto a uno"},
      {cost:"adicional",kind:"attack",w:"sc",offhand:true,name:"Katana del Shogun Carmesí",note:"Segunda arma · requiere haber usado la acción de Atacar"},
      {cost:"adicional",kind:"haki",name:"Endurecimiento (Haki)",res:"haki",note:"+3 al ataque y daño de ambas katanas durante 1 minuto (10 turnos)"},
      {cost:"adicional",kind:"heal",name:"Tomar aliento",res:"aliento",heal:"1d10+7",note:"Recupera PV"},
      {cost:"reaccion",kind:"deflect",w:"sc",name:"Desvío",note:"Cuando te aciertan cuerpo a cuerpo: si tu ataque iguala o supera el del enemigo, desvías y le haces daño"},

};

  sr:Object.fromEntries(SPECIALS.map(s=>[s.id,c.prof])),dream:c.level,prestige:0,plog:[],

function merge(c,s){
  const f=fresh(c);if(!s||typeof s!=="object")return f;
  const pick=(def,v)=>typeof v===typeof def?v:def;
  const obj=(def,v)=>Object.fromEntries(Object.entries(def).map(([k,x])=>[k,pick(x,v&&v[k])]));
  const strs=v=>Array.isArray(v)?v.map(x=>String(x).replace(/<(?!\/?b>)[^>]*>?/g,"")):[];
  return{hp:pick(f.hp,s.hp),res:obj(f.res,s.res),sr:obj(f.sr,s.sr),dream:pick(f.dream,s.dream),prestige:pick(f.prestige,s.prestige),
    plog:strs(s.plog),conds:Array.isArray(s.conds)?s.conds.filter(x=>CONDS.includes(x)):[],hard:pick(f.hard,s.hard),
    turn:obj(f.turn,s.turn),ds:obj(f.ds,s.ds),dead:pick(f.dead,s.dead),log:strs(s.log)};
}

/* ===================== DADOS ===================== */
const d=n=>1+Math.floor(Math.random()*n);
function roll(expr,crit=false){
  let tot=0,rolls=[],mod=0;
  for(const p of expr.replace(/\s/g,"").replace(/-/g,"+-").split("+")){
    const m=p.match(/^(\d+)d(\d+)$/);
    if(m){const n=(+m[1])*(crit?2:1);for(let i=0;i<n;i++){const r=d(+m[2]);rolls.push(r);tot+=r}}
    else if(p){mod+=+p;tot+=+p}}
  return{tot,txt:"["+rolls.join(", ")+"]"+(mod?(mod>0?" + ":" − ")+Math.abs(mod):"")};
}
function d20(){const a=d(20),b=d(20);
  if(mode==="ventaja")return{v:Math.max(a,b),txt:a+" / "+b+" (ventaja)"};
  if(mode==="desventaja")return{v:Math.min(a,b),txt:a+" / "+b+" (desventaja)"};
  return{v:a,txt:""+a};}
const sgn=n=>(n>=0?"+":"−")+Math.abs(n);
function wStats(w){const c=C(),h=S.hard>0?c.hardening.bonus:0;return{hit:w.hit+h,mod:w.mod+h,h}}
function log(t){S.log.unshift(t);S.log=S.log.slice(0,12)}

function actBtn(a,i){
  const c=C();let big="",tags="";
  if(a.kind==="attack"||a.kind==="deflect"){const w=c.weapons[a.w],st=wStats(w);big=`${sgn(st.hit)}<small>${w.dice}${sgn(st.mod)} ${w.type}</small>`;if(st.h)tags+=`<span class="tag h">Haki</span>`}
  else if(a.kind==="dash")big=`CD ${a.dc}<small>salv. ${a.save} · ${a.dmg}</small>`;
  else if(a.kind==="steel")big=`${sgn(a.hit)}<small>${a.dmg} × ${a.targets}</small>`;
  else if(a.kind==="heal")big=`${a.heal}<small>PV</small>`;
  else if(a.kind==="haki")big=S.hard>0?`${S.hard}<small>turnos</small>`:`+${c.hardening.bonus}<small>atq. y daño</small>`;
  const out=a.res&&S.res[a.res]<=0&&!(a.kind==="haki"&&S.hard>0);
  const left=a.res?` · quedan ${S.res[a.res]}`:"";
  return `<button class="act ${a.kind==="haki"&&S.hard>0?"on":""}" data-act="${i}" ${out?"disabled":""}><span class="n">${a.name}${tags}</span><span class="big">${big}</span><span class="d">${a.kind==="haki"&&S.hard>0?"Activo · toca para terminarlo":a.note}${left}</span></button>`;
}

/* ===================== ECONOMÍA DEL TURNO ===================== */
function spend(cost){
  const t=S.turn,c=C();
  if(cost==="accion"){if(t.a<=0)return"Ya usaste tu acción este turno.";t.a--;t.atk=t.a>0?c.attacksPerAction:0;return""}
  if(cost==="adicional"){if(t.b<=0)return"Ya usaste tu acción adicional.";t.b--;return""}
  if(cost==="reaccion"){if(t.r<=0)return"Ya usaste tu reacción.";t.r--;return""}
  return"";
}
function spendAttack(){const t=S.turn,c=C();
  if(t.a<=0&&t.atk<=0)return"Ya no te quedan golpes de la acción de Atacar.";
  t.atk--;t.attacked=true;if(t.atk<=0){t.a--;t.atk=t.a>0?c.attacksPerAction:0}return""}

/* ===================== ACCIONES ===================== */
function weaponAttack(w,title,warn,tip){
  const c=C(),st=wStats(w),r=d20(),tot=r.v+st.hit,crit=r.v>=c.critMin,fail=r.v===1;
  const dm=roll(w.dice+"+"+st.mod,crit);let dmg=dm.tot,dtxt=dm.txt,type=w.type;
  if(crit&&c.blackArmory){const ex=roll("2d6");dmg+=ex.tot;dtxt+=" + Armería negra "+ex.txt;type="fuerza"}
  const boxes=[{l:"Ataque",v:tot,s:`d20 ${r.txt} ${sgn(st.hit)}${crit?" · ¡CRÍTICO!":fail?" · pifia":""}`,cls:crit?"crit":fail?"fail":""},
               {l:"Daño "+type,v:dmg,s:dtxt+(crit?" · dados dobles":""),cls:crit?"crit":""}];
  show({title,warn,boxes,d20:0,exec:true,crit,tip:(crit&&c.blackArmory?"Crítico Black Weapon: el objetivo recibe la mitad de curación durante 1 minuto. ":"")+(tip||"")});
  log(`<b>${title}</b>: ${tot}${crit?" (crítico)":""} · ${dmg} ${type}`);
}
function doAct(i){
  const c=C(),a=c.actions[i];let warn="";
  if(a.kind==="haki"&&S.hard>0){S.hard=0;log("Endurecimiento terminado");$("tray").classList.add("hide");save();render();return}
  if(a.kind==="attack"){
    if(a.cost==="accion")warn=spendAttack();
    else{if(a.offhand&&!S.turn.attacked)warn="Recuerda: la segunda arma requiere haber usado la acción de Atacar. ";warn+=spend(a.cost)}
    weaponAttack(c.weapons[a.w],a.name,warn);
  } else if(a.kind==="deflect"){
    warn=spend(a.cost);const w=c.weapons[a.w],st=wStats(w),r=d20(),tot=r.v+st.hit,crit=r.v>=c.critMin;
    const dm=roll(w.dice+"+"+st.mod,crit);let dmg=dm.tot,type=w.type;if(crit&&c.blackArmory){dmg+=roll("2d6").tot;type="fuerza"}
    show({title:a.name,warn,d20:0,exec:true,boxes:[{l:"Tu tirada",v:tot,s:`d20 ${r.txt} ${sgn(st.hit)}`,cls:crit?"crit":""},{l:"Daño si desvías",v:dmg,s:dm.txt+" "+type,cls:crit?"crit":""}],
      tip:"Si tu tirada es igual o mayor que el ataque del enemigo, no recibes el golpe y le haces este daño."});
    log(`<b>Desvío</b>: ${tot} · ${dmg} ${type}`);
  } else if(a.kind==="dash"){
    warn=spend(a.cost);S.res[a.res]--;const dm=roll(a.dmg);
    show({title:a.name,warn,boxes:[{l:"CD salvación",v:a.dc,s:"Salvación de "+a.save},{l:"Daño "+a.type,v:dm.tot,s:dm.txt+" · si fallan"}],tip:a.note});
    log(`<b>${a.name}</b>: CD ${a.dc} · ${dm.tot} ${a.type}`);
  } else if(a.kind==="steel"){
    warn=spend(a.cost);S.res[a.res]--;let rows="",sum=0;
    for(let k=1;k<=a.targets;k++){const r=d20(),tot=r.v+a.hit,crit=r.v===20,dm=roll(a.dmg,crit);
      rows+=`<div class="${crit?"crit":""}"><span>Objetivo ${k}: ataque <b>${tot}</b>${crit?" ¡crítico!":r.v===1?" pifia":""}</span><span><b>${dm.tot}</b> ${a.type}</span></div>`}
    show({title:a.name,warn,html:`<div class="multi">${rows}</div>`,tip:"Usa solo las filas de los objetivos que tengas. Después te teletransportas a 5 pies de uno de ellos."});
    log(`<b>${a.name}</b> lanzado`);
  } else if(a.kind==="haki"){
    warn=spend(a.cost);S.res[a.res]--;S.hard=c.hardening.turns;
    show({title:a.name,warn,boxes:[{l:"Bono",v:"+"+c.hardening.bonus,s:"al ataque y daño de las katanas"},{l:"Duración",v:c.hardening.turns,s:"turnos (1 minuto)"}]});
    log(`<b>Endurecimiento</b> activado`);
  } else if(a.kind==="heal"){
    warn=spend(a.cost);S.res[a.res]--;const hr=roll(a.heal);S.hp=Math.min(c.maxHp,S.hp+hr.tot);if(S.hp>0){S.ds={ok:0,ko:0};S.dead=false}
    show({title:a.name,warn,boxes:[{l:"Curación",v:"+"+hr.tot,s:hr.txt},{l:"PV ahora",v:S.hp,s:"de "+c.maxHp}]});
    log(`<b>${a.name}</b>: +${hr.tot} PV`);
  } else if(a.kind==="surge"){
    S.res[a.res]--;S.turn.a++;if(S.turn.atk<=0)S.turn.atk=c.attacksPerAction;
    show({title:a.name,boxes:[{l:"Acciones disponibles",v:S.turn.a,s:`${c.attacksPerAction} golpes por acción`}]});log(`<b>${a.name}</b>`);
  }
  save();render();
}
function doSpecial(id){
  const c=C(),s=SPECIALS.find(x=>x.id===id);let warn="";
  if(S.turn.sr<=0)warn="Ya usaste tus 2 reacciones especiales esta ronda.";else S.turn.sr--;
  S.sr[id]--;
  if(s.kind==="attack"){weaponAttack(c.weapons[s.w],s.name,warn)}
  else if(s.kind==="reduce"){const r=roll("1d10+"+c.level);show({title:s.name,warn,boxes:[{l:"Daño reducido",v:"−"+r.tot,s:r.txt}],tip:"Réstalo del daño del golpe antes de anotarlo."});log(`<b>${s.name}</b>: −${r.tot}`)}
  else if(s.kind==="flash"){const r=d20(),tot=r.v+c.saves.DES[0];show({title:s.name,warn,d20:0,boxes:[{l:"Salvación DES",v:tot,s:`d20 ${r.txt} ${sgn(c.saves.DES[0])}`}],tip:"Si iguala o supera su ataque: 0 daño. Siempre te mueves 10 pies sin provocar ataques."});log(`<b>${s.name}</b>: ${tot}`)}
  save();render();
}

/* ===================== NUBE (Firebase) ===================== */
/* Configuración de la app web de Firebase (no es secreta: la protegen las reglas de Firestore). Con null, todo queda solo en el teléfono. */
const FIREBASE={
  apiKey:"AIzaSyBjywHbBPsTBVvWtOXbKhjQDf4kmbEc-MU",
  authDomain:"one-piece-dnd.firebaseapp.com",
  projectId:"one-piece-dnd",
  storageBucket:"one-piece-dnd.firebasestorage.app",
  messagingSenderId:"629290049992",
  appId:"1:629290049992:web:6fe9f692bb47c8878460fd"
};
const FB="https://www.gstatic.com/firebasejs/10.12.2/firebase-";
const outBtn=`<button class="btn" data-do="logout">Cerrar sesión</button>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,ch=>"&#"+ch.charCodeAt(0)+";");
let fb=null,user=null,admin=false,view="char",mesa={state:{},players:[]},unsub=[],stateUnsub=null,pushT=null;

async function cloudInit(){
  if(!FIREBASE)return;
  try{
    const [A,U,F]=await Promise.all(["app","auth","firestore"].map(m=>import(FB+m+".js")));
    const app=A.initializeApp(FIREBASE);let db;
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    fb={U,F,db,auth:U.getAuth(app)};
  }catch(e){return} // sin internet y sin la librería en caché: sigue en modo local
  render();
  fb.U.onAuthStateChanged(fb.auth,signedIn);
}
async function signedIn(u){
  unsub.forEach(f=>f());unsub=[];if(stateUnsub){stateUnsub();stateUnsub=null}
  user=u;admin=false;
  if(!u){view="login";render();return}
  view="load";render();
  const {F,db}=fb;
  try{admin=(await F.getDoc(F.doc(db,"admins",u.uid))).exists()}catch(e){}
  if(admin){
    unsub.push(F.onSnapshot(F.collection(db,"state"),q=>{q.forEach(d=>mesa.state[d.id]=d.data());if(view==="mesa")render()}));
    unsub.push(F.onSnapshot(F.collection(db,"players"),q=>{mesa.players=q.docs.map(d=>({id:d.id,...d.data()}));
      const me=mesa.players.find(p=>p.id===u.uid);if(me)setLook(me.look,true);if(view==="mesa")render()}));
    view="mesa";render();return;
  }
  const ref=F.doc(db,"players",u.uid);
  unsub.push(F.onSnapshot(ref,d=>{
    if(!d.exists()){if(!d.metadata.fromCache)F.setDoc(ref,{name:u.displayName||"",email:u.email||"",char:null});return}
    const k=d.data().char;setLook(d.data().look,true);
    if(CHARS[k])openChar(k);else{if(stateUnsub){stateUnsub();stateUnsub=null}view="wait";render()}
  }));
}
/* shortcut: gana la última escritura; si dos teléfonos editan el mismo personaje a la vez, uno pisa al otro */
function openChar(k){
  if(stateUnsub&&cur===k&&view==="char")return;
  if(pushT)push(); // sube lo pendiente antes de cambiar de personaje
  if(stateUnsub)stateUnsub();
  cur=k;load();view="char";store.set("mc:cur",cur);render();
  stateUnsub=fb.F.onSnapshot(fb.F.doc(fb.db,"state",k),d=>{
    if(cur!==k||pushT||d.metadata.hasPendingWrites)return;
    if(!d.exists()){if(!d.metadata.fromCache)push();return}
    const s=merge(C(),d.data());
    if(JSON.stringify(s)!==JSON.stringify(S)){S=s;store.set("mc2:"+cur,S);render()}
  });
}
/* La apariencia viaja en el documento del jugador (o del DM) para seguirlo a otros dispositivos */
function lookToCloud(v){if(fb&&user)fb.F.setDoc(fb.F.doc(fb.db,"players",user.uid),{look:v},{merge:true}).catch(e=>console.warn("No se pudo guardar la apariencia",e))}
function push(){clearTimeout(pushT);pushT=null;if(!fb||!user)return;
  fb.F.setDoc(fb.F.doc(fb.db,"state",cur),{...S,by:user.uid,at:fb.F.serverTimestamp()}).catch(e=>console.warn("No se pudo guardar en la nube",e))}

function gate(){
  if(view==="login")return`<section class="box2" style="margin-top:24px"><h1>Mesa de Combate</h1>
    <p class="note">Entra con tu cuenta de Google para guardar tu personaje en la nube y usarlo en cualquier dispositivo.</p>
    <button class="btn primary" data-do="login">Entrar con Google</button><button class="btn" data-do="local">Usar sin cuenta (solo en este teléfono)</button></section>`;
  if(view==="load")return`<p class="note" style="margin-top:24px">Conectando…</p>`;
  if(view==="wait")return`<section class="box2" style="margin-top:24px"><h1>Hola, ${esc(user.displayName)}</h1>
    <p class="note">Tu cuenta todavía no tiene personaje. Pídele al DM que te asigne uno; esta pantalla se actualiza sola.</p>
    <p class="note">Tu ID de usuario: <code>${esc(user.uid)}</code></p>${outBtn}</section>`;
  const opts=sel=>`<option value="">Sin asignar</option>`+Object.entries(CHARS).map(([k,c])=>`<option value="${k}" ${k===sel?"selected":""}>${c.name}</option>`).join("");
  return`<section><h2>Mesa <small>en vivo</small></h2><div class="list">${Object.entries(CHARS).map(([k,c])=>{
    const s=merge(c,mesa.state[k]),pct=Math.max(0,s.hp/c.maxHp*100);
    return`<div class="box2"><div class="who"><b style="font-size:18px">${c.name}</b><button class="btn" data-pick="${k}">Abrir</button></div>
      ${mesa.state[k]?`<div class="hptxt"><span><b>${s.hp}</b> / ${c.maxHp} PV${s.hp<=0?" · inconsciente":""}</span><span>${s.conds.join(", ")||"Sin estados"}</span></div>
      <div class="track"><div class="fill ${pct<25?"low":pct<50?"mid":""}" style="width:${pct}%"></div></div>
      <p class="note">${c.resources.map(r=>`${r.name} ${s.res[r.id]}/${r.max}`).join(" · ")} · Sueño ${s.dream}/${c.level} · Prestigio ${s.prestige}${s.hard>0?` · Haki activo (${s.hard} t.)`:""}</p>
      ${s.log[0]?`<p class="note">Último: ${s.log[0]}</p>`:""}`:`<p class="note">Sin datos todavía: aparecerán cuando su jugador abra la app.</p>`}</div>`}).join("")}</div></section>
    <section><h2>Jugadores <small>un personaje por cuenta</small></h2><div class="box2">${mesa.players.some(p=>p.id!==user.uid)?mesa.players.filter(p=>p.id!==user.uid).map(p=>`<div class="resrow"><span>${esc(p.name||p.email)}<br><small style="font-weight:400">${esc(p.email)}</small></span>
      <select data-assign="${esc(p.id)}" aria-label="Personaje de ${esc(p.name||p.email)}">${opts(p.char)}</select></div>`).join(""):`<p class="note">Todavía no ha entrado ningún jugador. Pídeles que abran la app y entren con Google.</p>`}</div></section>
    <p class="note">Conectado como DM: ${esc(user.email)}</p>${outBtn}`;
}
document.addEventListener("change",e=>{const id=e.target.dataset.assign;
  if(id!==undefined)fb.F.updateDoc(fb.F.doc(fb.db,"players",id),{char:e.target.value||null}).catch(err=>show({title:"No se pudo asignar",warn:err.code||String(err)}))});

/* ===================== EVENTOS ===================== */
document.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el||el.disabled)return;
  const c=C(),ds=el.dataset;
  if(ds.pick){$("tray").classList.add("hide");if(ds.pick==="mesa"){view="mesa";render();return}
    if(user){openChar(ds.pick);return}cur=ds.pick;load();save();render();return}
  if(ds.mode){mode=ds.mode;render();return}
  if(ds.act!==undefined){armed=null;doAct(+ds.act);return}
  if(ds.sr){armed=null;doSpecial(ds.sr);return}
  if(ds.save){const [v]=c.saves[ds.save],r=d20();show({title:"Salvación de "+ds.save,d20:0,boxes:[{l:"Resultado",v:r.v+v,s:`d20 ${r.txt} ${sgn(v)}`,cls:r.v===20?"crit":r.v===1?"fail":""}]});log(`Salvación ${ds.save}: ${r.v+v}`);save();return}
  if(ds.cond){S.conds=S.conds.includes(ds.cond)?S.conds.filter(x=>x!==ds.cond):[...S.conds,ds.cond];save();render();return}
  if(ds.res){const j=+ds.j;S.res[ds.res]=j<S.res[ds.res]?j:j+1;save();render();return}
  if(ds.dreamp!==undefined){const j=+ds.dreamp;S.dream=j<S.dream?j:j+1;save();render();return}
  if(ds.buy){const v=+ds.buy;if(S.prestige>=v){S.prestige-=v;S.plog.unshift(`Gastó ${v} en avance ${ds.rn.toLowerCase()}`);spendOpen=false;save();render()}return}
  const act=ds.do;if(!act)return;
  if(act!=="short"&&act!=="long")armed=null;
  if(act==="close"){$("tray").classList.add("hide");return}
  if(act==="look"){openLook();return}
  if(act==="login"){fb.U.signInWithPopup(fb.auth,new fb.U.GoogleAuthProvider()).catch(e=>show({title:"No se pudo entrar",warn:e.code||String(e)}));return}
  if(act==="logout"){if(pushT)push();fb.U.signOut(fb.auth);return}
  if(act==="local"){view="char";render();return}
  if(act==="dreamadd"){const k=d(6);S.dream--;const b=T.boxes[T.d20];b.v=(+b.v)+k;b.s+=` + sueño ${k}`;T.dreamUsed=true;log(`Punto de sueño: +${k}`);drawTray();save();render();return}
  if(act==="exec"){const x=c.execute;S.res[x.res]--;S.turn.exec=true;T.execUsed=true;const r=roll(x.dice,T.crit);
    T.boxes.push({l:"Ejecutar · "+x.type,v:"+"+r.tot,s:r.txt+(T.crit?" · dobles":""),cls:"ex"});T.tip=(T.tip||"")+" Ejecutar: "+x.note+".";
    log(`Ejecutar: +${r.tot} ${x.type}`);drawTray();save();render();return}
  if(act==="init"){const r=d20();show({title:"Iniciativa",d20:0,boxes:[{l:"Iniciativa",v:r.v+c.init,s:`d20 ${r.txt} ${sgn(c.init)}`}]});log(`<b>Iniciativa</b>: ${r.v+c.init}`)}
  if(act==="turn"){S.turn=newTurn(c);if(S.hard>0){S.hard--;if(S.hard===0)log("Endurecimiento terminado")}$("tray").classList.add("hide");log("— Nuevo turno —")}
  if(act==="dmg"||act==="heal"){const n=parseInt($("hpin").value,10);if(!(n>0))return;
    if(act==="dmg"){S.hp=Math.max(0,S.hp-n);log(`Recibe <b>${n}</b> de daño`)}
    else{S.hp=Math.min(c.maxHp,S.hp+n);if(S.hp>0){S.ds={ok:0,ko:0};S.dead=false}log(`Recupera <b>${n}</b> PV`)}}
  if(act==="death"){const r=d(20);
    if(r===20){S.hp=1;S.ds={ok:0,ko:0};show({title:"¡Recuperas la consciencia!",boxes:[{l:"d20",v:20,s:"Vuelves con 1 PV",cls:"crit"}]})}
    else{const ok=r>=10;if(ok)S.ds.ok++;else S.ds.ko+=(r===1?2:1);
      show({title:"Salvación de muerte",warn:S.ds.ok>=3?"Estable":"",boxes:[{l:"d20",v:r,s:ok?"Éxito":r===1?"Dos fallos":"Fallo",cls:ok?"":"fail"}],
        html:!ok&&S.dream>0?`<div class="trayact"><button class="btn gold" data-do="dreamsave" data-n="${r===1?2:1}">Gastar punto de sueño: convertir en éxito</button></div>`:""})}
    log(`Salvación de muerte: ${r}`)}
  if(act==="dreamsave"){S.dream--;S.ds.ko=Math.max(0,S.ds.ko-(+ds.n));S.ds.ok++;show({title:"Punto de sueño",boxes:[{l:"Salvación",v:"Éxito",s:"El fallo se convierte en éxito"}],warn:S.ds.ok>=3?"Estable":""});log("Punto de sueño: salvación de muerte salvada")}
  if(act==="dreams"){const r=d(20);if(r>=12){S.hp=1;S.ds={ok:0,ko:0};show({title:"¡No abandono mis sueños!",boxes:[{l:"d20",v:r,s:"Te levantas con 1 PV",cls:"crit"}]})}
    else{S.dead=true;show({title:"No abandonaré mis sueños",boxes:[{l:"d20",v:r,s:"Necesitabas 12 o más",cls:"fail"}]})}log(`No abandonaré mis sueños: ${r}`)}
  if(act==="p+"){S.prestige++;S.plog.unshift("Ganó 1 punto de prestigio")}
  if(act==="pspend"){spendOpen=!spendOpen}
  if(act==="short"||act==="long"){
    if(armed!==act){armed=act;render();return}
    armed=null;
    if(act==="long"){const keep={dream:S.dream,prestige:S.prestige,plog:S.plog,log:S.log,conds:S.conds};S=Object.assign(fresh(c),keep);log("<b>Descanso largo</b>: PV y usos recuperados")}
    else{c.resources.forEach(r=>{if(r.rest==="short")S.res[r.id]=r.max});SPECIALS.forEach(s=>S.sr[s.id]=c.prof);log("<b>Descanso corto</b>: recursos y reacciones especiales recuperados")}
  }
  save();render();
});
