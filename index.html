<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: una columna estrecha tipo "tablero de turno": encabezado fijo con PV y economía del turno, acciones agrupadas por coste, bandeja de resultado anclada abajo */
/* ===== Paletas (mismo bloque en index.html y dm.html) =====
   data-pal en <html>: grand (predeterminada) · bandera · paja. data-theme: light (día) · dark (noche).
   Colores de estado: iguales en todas, salvo el daño en las paletas de acento rojo y los PV temporales en Grand Line (acento azul). */
:root,[data-pal]{--good:#1f7a45;--bad:#b3261e;--warn:#8f5b00;--haki:#3f3486;--temp:#2b5ea8;--foe:#6d2b80;--shadow:rgba(0,0,0,.14);color-scheme:light}
[data-pal][data-theme="dark"]{--good:#5cc98c;--bad:#ff8a80;--warn:#eab14d;--haki:#b7a9f2;--temp:#86b2f0;--foe:#cf9be6;--shadow:rgba(0,0,0,.55);color-scheme:dark}
:root,[data-pal="grand"]{--bg:#eef3f7;--surface:#ffffff;--ink:#10243a;--muted:#4f6378;--line:#cfdae4;--chip:#e1e9f0;--accent:#1d5c8f;--accent-ink:#ffffff;--gold:#8e6607;--temp:#00737a}
[data-pal="bandera"]{--bg:#f2f0ee;--surface:#ffffff;--ink:#1a1a1a;--muted:#5e5a56;--line:#dcd7d2;--chip:#e7e3df;--accent:#b0202a;--accent-ink:#ffffff;--gold:#7d5f17;--bad:#9d1a5f}
[data-pal="paja"]{--bg:#fbf5e6;--surface:#fffdf6;--ink:#2b2416;--muted:#6b5f47;--line:#ebdfc2;--chip:#f2e8cf;--accent:#b8342a;--accent-ink:#ffffff;--gold:#8c6807;--bad:#9d1a5f}
[data-pal="grand"][data-theme="dark"]{--bg:#0b1622;--surface:#13233a;--ink:#e6eef6;--muted:#93a6ba;--line:#22364f;--chip:#1b2d47;--accent:#5fa8e6;--accent-ink:#0b1622;--gold:#e8c15a;--temp:#4fd3dc}
[data-pal="bandera"][data-theme="dark"]{--bg:#0e0e10;--surface:#1a1a1d;--ink:#ededed;--muted:#a3a3a8;--line:#2c2c31;--chip:#242428;--accent:#ff5a5f;--accent-ink:#0e0e10;--gold:#d9b45a;--bad:#ff8fc4}
[data-pal="paja"][data-theme="dark"]{--bg:#1b160c;--surface:#262012;--ink:#f3ead6;--muted:#b5a88a;--line:#3a3120;--chip:#322a19;--accent:#ee7466;--accent-ink:#1b160c;--gold:#f0c24b;--bad:#ff8fc4}
.lk{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(420px,calc(100vw - 32px));box-shadow:0 12px 32px var(--shadow)}
.lk::backdrop{background:var(--shadow)}
.lk-in{padding:14px;display:flex;flex-direction:column}
.lk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lk-top b{font-family:var(--f-display);font-size:20px}
.lk h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.lk-pal{display:flex;flex-direction:column;gap:6px}
.lk-pal button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;text-align:left}
.lk-pal button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.sw{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex-shrink:0}
.sw i{width:14px;height:22px}
.sw i:nth-child(1){background:var(--bg)} .sw i:nth-child(2){background:var(--surface)} .sw i:nth-child(3){background:var(--accent)} .sw i:nth-child(4){background:var(--gold)}
.lk-mode{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px}
.lk-mode button{padding:8px 4px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.lk-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.lk-mode.lk-two{grid-template-columns:1fr 1fr}
.lk-ver{margin:12px 0 0;font-size:11px;color:var(--muted);text-align:center}
.ico{width:20px;height:20px;display:block}
/* ===== fin de paletas ===== */
:root{
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 240px;
  -webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{display:flex;gap:8px;padding-top:14px;overflow-x:auto}
.pick:empty{display:none}
.pick button{padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header.hero{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.who{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--f-display);font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.stats{display:flex;gap:6px;flex-shrink:0}
.stat{display:flex;flex-direction:column;align-items:center;min-width:50px;padding:4px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.stat b{font-size:20px;line-height:1.1}
.stat small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button.stat:active{transform:scale(.96)}
.hp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hpbar{flex:1 1 140px;min-width:0}
.hpctl{display:flex;gap:8px;margin-left:auto}
.hptxt{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.hptxt span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hptxt b{font-size:22px;color:var(--ink)}
.track{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:3px;display:flex}
.fill.tp{background:var(--temp)} .hptxt .t{color:var(--temp);font-weight:700;font-size:15px}
.fill{height:100%;background:var(--good);transition:width .25s}
.fill.mid{background:var(--gold)} .fill.low{background:repeating-linear-gradient(135deg,var(--bad) 0 6px,transparent 6px 9px)}
.hpin{width:60px;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;text-align:center}
.hpbtn{padding:9px 10px;border-radius:8px;font-weight:700;font-size:14px}
.hpbtn.dmg{background:var(--bad);color:var(--bg)} .hpbtn.heal{background:var(--good);color:var(--bg)} .hpbtn.tmp{background:var(--temp);color:var(--bg)}
/* Símbolo además del color: en las paletas rojas el daño no depende solo del tono */
.hpbtn.dmg::before{content:"− "} .hpbtn.heal::before{content:"+ "}

.turn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.econ{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:12.5px;font-weight:700}
.econ i{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block}
.econ.spent{opacity:.45} .econ.spent i{background:var(--muted)}
.econ.haki{border-color:var(--haki);background:var(--haki);color:var(--bg)} .econ.haki i{background:var(--bg)}
/* Fichas que llevan a su sección: --hdr es el alto del encabezado fijo (lo pone render), así el título queda visible */
button.econ[data-jump]:active{transform:scale(.96)}
/* Teléfonos angostos: fila 1 Acción · Acción adicional · Reacción; fila 2 el resto (mismo orden). .brk fuerza el salto de línea */
.turn .brk{display:none}
@media (max-width:480px){.turn{gap:6px 4px}.econ{padding:5px 7px;gap:4px;font-size:11.5px;letter-spacing:-.02em}.econ i{width:7px;height:7px}.turn .brk{display:block;flex-basis:100%;height:0;margin-top:-6px}}
#main section{scroll-margin-top:calc(var(--hdr,180px) + env(safe-area-inset-top,0px) + 8px)}
section h2{border-radius:8px;transition:background-color .5s,box-shadow .5s}
section h2.flash{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 16%,transparent)}
.newturn{margin-left:auto;padding:7px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}

.adv{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px}
.adv button{padding:8px 4px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.adv button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}

section h2{font-family:var(--f-display);font-size:19px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 small{font-family:var(--f-body);font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700;text-align:right}
.list{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;transition:transform .08s}
.act:active{transform:scale(.985);border-color:var(--accent)}
.act .n{font-weight:700;font-size:17px;min-width:0}
.act .d{grid-column:1;color:var(--muted);font-size:13px;min-width:0}
.act .big{grid-row:1 / span 2;grid-column:2;text-align:right;font-weight:700;font-size:18px;color:var(--accent);line-height:1.15}
.act .big small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.act.on{border-color:var(--haki);box-shadow:inset 0 0 0 1.5px var(--haki)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.h{background:var(--haki);color:var(--bg)}
.act[disabled],.act[aria-disabled="true"]{opacity:.45}

.saves{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.saves button{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.saves button span{color:var(--muted);font-size:13px}
.saves button.pro{border-color:var(--accent)}

.box2{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
.resrow{display:flex;align-items:center;gap:10px;font-size:14px}
.resrow > span:first-child{flex:0 0 120px;color:var(--muted);font-weight:700;line-height:1.2}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:var(--accent)}
.pip.used{background:transparent;opacity:.5}
.pip.gold{border-color:var(--gold);background:var(--gold)} .pip.gold.used{background:transparent}

.prest{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prest .num{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--gold);min-width:44px}
.prest .lbl{font-size:13px;color:var(--muted);flex:1;min-width:120px}
.costs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.costs button{padding:10px;border-radius:10px;background:var(--gold);color:var(--bg);font-weight:700;font-size:14px}
.costs button[disabled]{background:var(--chip);color:var(--muted)}

.conds{display:flex;flex-wrap:wrap;gap:6px}
.conds button{padding:7px 11px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:14px;font-weight:700}
.conds button[aria-pressed="true"]{background:var(--bad);color:var(--bg)}

.death{padding:12px 14px;border-radius:12px;border:2px solid var(--bad);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.death b{color:var(--bad)}
.dsrow{display:flex;gap:16px;font-size:14px;align-items:center;flex-wrap:wrap}
.ds{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:inline-block;margin-left:3px;vertical-align:-3px}
.ds.on{background:currentColor}
.ok{color:var(--good)} .ko{color:var(--bad)}
.btn{padding:10px 14px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);color:var(--bg)}
.btn[disabled]{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn.arm{background:var(--gold);color:var(--bg)}

.log{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}
.log b{color:var(--ink)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--accent);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 24px var(--shadow);transition:transform .22s;max-height:75vh;overflow-y:auto}
.tray.hide{transform:translateY(110%)}
.tray .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.tray .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tray .title{font-family:var(--f-display);font-size:20px;min-width:0}
.tray .x{padding:6px 10px;border-radius:8px;background:var(--chip);font-size:13px;font-weight:700}
.res{display:flex;gap:8px;flex-wrap:wrap}
.res .box{flex:1;min-width:120px;padding:8px 12px;border-radius:10px;background:var(--bg)}
.res .box small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.res .box b{font-size:32px;line-height:1.1;display:block;animation:pop .25s ease-out}
.res .box span{font-size:13px;color:var(--muted);display:block}
.res .crit b{color:var(--gold)} .res .fail b{color:var(--bad)} .res .ex b{color:var(--accent)}
.warn{font-size:13px;color:var(--bad);font-weight:700}
.tip{font-size:13px;color:var(--muted)}
.trayact{display:flex;gap:8px;flex-wrap:wrap}
.trayact .btn{flex:1;min-width:140px}
.multi{display:flex;flex-direction:column;gap:4px;font-size:15px}
.multi div{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;background:var(--bg)}
.multi .crit{color:var(--gold);font-weight:700}
.lvls{display:flex;gap:8px;flex-wrap:wrap}
select{flex:1;min-width:0;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
code{font-size:12px;word-break:break-all;user-select:all}
.adv.two{grid-template-columns:1fr 1fr}
.d20in label{flex:1;font-size:13px;color:var(--muted)}
.res .box b.rc{font-size:22px} /* recetas largas del modo físico */
/* Subida de nivel: celebración a pantalla completa (colores de la paleta) y asistente paso a paso */
.lvc{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--gold) 14%,var(--bg))}
.lvc-rays{position:absolute;inset:-50%;background:repeating-conic-gradient(color-mix(in srgb,var(--gold) 24%,transparent) 0 9deg,transparent 9deg 18deg);animation:lvspin 24s linear infinite}
.lvc-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;text-align:center}
.lvc-thumb{width:min(48vw,210px);height:auto;color:var(--ink);filter:drop-shadow(0 6px 14px var(--shadow));animation:lvpop .7s cubic-bezier(.2,1.6,.4,1) both,lvbob 2.4s 1s ease-in-out infinite}
.lvc h2{font-family:var(--f-display);font-size:clamp(30px,9vw,52px);line-height:1.05;margin:0;color:var(--ink);animation:lvpop .6s .25s both}
.lvc p{font-size:24px;font-weight:700;margin:0;color:var(--accent);animation:lvpop .6s .4s both}
.lvc .btn{min-width:180px;padding:12px 18px;font-size:16px;animation:lvpop .5s .6s both}
@keyframes lvspin{to{transform:rotate(360deg)}} @keyframes lvpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}} @keyframes lvbob{50%{transform:translateY(-6px) rotate(-4deg)}}
.wz{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.wz-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.wz-top{display:flex;justify-content:space-between;align-items:center;gap:8px} .wz-top b{font-family:var(--f-display);font-size:19px;min-width:0}
.wz .lvt{font-family:var(--f-display);font-size:22px;margin:0} .wz .lvh{font-size:15px;margin:8px 0 0}
.wz-nav{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);margin-top:6px}
.wz-nav .btn{min-width:120px}
.lvsum{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.4}
.lvrev{border:1.5px solid var(--warn);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:4px} .lvrev > b{color:var(--warn)}
.lvrv{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--gold);background:var(--bg)}
.lvck{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4} .lvck input{margin-top:3px;width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)}
.lvhist summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.conc.lvb{background:var(--gold)}
/* Turnos del combate: barra arriba, aviso grande, aviso suave e insignia */
.cbar{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:6px 12px;border-radius:10px;background:var(--chip);font-size:13px;color:var(--muted)}
.cbar b{color:var(--ink)} .cbar span:not(.nx){color:var(--ink);font-weight:700} .cbar .nx{margin-left:auto}
.cbar.me{background:var(--accent);color:var(--accent-ink)} .cbar.me b,.cbar.me span{color:var(--accent-ink)!important}
.yt{position:fixed;left:0;right:0;top:0;z-index:58;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;
  padding:calc(22px + env(safe-area-inset-top,0px)) 20px 20px;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 30px var(--shadow);animation:ytin .35s ease-out}

<script>
/* Apariencia (paleta y modo): mismo código y misma clave de localStorage en index.html y dm.html */
/* Versión publicada: la escribe sola el hook pre-commit de git (.git/hooks/pre-commit) con la fecha y hora del commit */
const APP_VERSION="2026-10-28 15:28";
/* lang: "es" (predeterminado) o "en". tx(es,en) da el texto de la interfaz en el idioma activo */
const PALS={grand:{es:"Grand Line",en:"Grand Line"},bandera:{es:"Bandera pirata",en:"Pirate Flag"},paja:{es:"Sombrero de paja",en:"Straw Hat"}},MODES={auto:{es:"Automático",en:"Auto"},day:{es:"Día",en:"Day"},night:{es:"Noche",en:"Night"}},
  DICE={fis:{es:"Físicos",en:"Physical"},dig:{es:"Digitales",en:"Digital"}},LANGS={es:{es:"Español",en:"Español"},en:{es:"English",en:"English"}},LOOK_KEY="mc:look";
const ICON=`<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><circle cx="7" cy="5" r="2.2" fill="currentColor"/><circle cx="13" cy="10" r="2.2" fill="currentColor"/><circle cx="8" cy="15" r="2.2" fill="currentColor"/></svg>`;
const darkQ=matchMedia("(prefers-color-scheme: dark)");
/* dice: "fis" (cada jugador tira sus dados y la app da la receta, predeterminado) o "dig" (la app tira) */
/* quick: uso rápido de ataques sin límite (sin ficha de detalle); el ajuste solo aparece en la app de los jugadores (body con data-quick) */
const okLook=v=>v&&PALS[v.pal]&&MODES[v.mode]?{pal:v.pal,mode:v.mode,dice:DICE[v.dice]?v.dice:"fis",lang:v.lang==="en"?"en":"es",quick:v.quick===true||v.quick==="1"}:null;
function readLook(){try{return okLook(JSON.parse(localStorage.getItem(LOOK_KEY)))}catch(e){return null}}
let look=readLook()||{pal:"grand",mode:"auto",dice:"fis",lang:"es",quick:false};
const tx=(es,en)=>look.lang==="en"?en:es;
const isDark=()=>look.mode==="night"||(look.mode==="auto"&&darkQ.matches);
function applyLook(){const r=document.documentElement;r.dataset.pal=look.pal;r.dataset.theme=isDark()?"dark":"light";r.lang=look.lang;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(r).getPropertyValue("--bg").trim();
  const d=document.getElementById("lk");if(d&&d.open)drawLook()}
/* fromCloud: el valor viene de Firebase, no hay que volver a subirlo */
function setLook(v,fromCloud){v=okLook(v);if(!v||JSON.stringify(v)===JSON.stringify(look))return;look=v;
  try{localStorage.setItem(LOOK_KEY,JSON.stringify(look))}catch(e){}
  applyLook();if(typeof onLook==="function")onLook();if(!fromCloud&&typeof lookToCloud==="function")lookToCloud(look)}
function drawLook(){const t=isDark()?"dark":"light",d=document.getElementById("lk"),n=o=>o[look.lang];d.setAttribute("aria-label",tx("Ajustes","Settings"));
  d.innerHTML=`<div class="lk-in"><div class="lk-top"><b>${tx("Ajustes","Settings")}</b><button class="btn" data-lk="close">${tx("Cerrar","Close")}</button></div>
  <h3>${tx("Paleta","Palette")}</h3><div class="lk-pal">${Object.entries(PALS).map(([k,o])=>`<button data-lkpal="${k}" aria-pressed="${look.pal===k}"><span class="sw" data-pal="${k}" data-theme="${t}"><i></i><i></i><i></i><i></i></span>${n(o)}</button>`).join("")}</div>
  <h3>${tx("Modo","Mode")}</h3><div class="lk-mode">${Object.entries(MODES).map(([k,o])=>`<button data-lkmode="${k}" aria-pressed="${look.mode===k}">${n(o)}</button>`).join("")}</div>
  <h3>${tx("Dados","Dice")}</h3><div class="lk-mode lk-two">${Object.entries(DICE).map(([k,o])=>`<button data-lkdice="${k}" aria-pressed="${look.dice===k}">${n(o)}</button>`).join("")}</div>
  <p class="note" style="margin-top:6px">${look.dice==="fis"?tx("Tiras tus dados y la app te dice qué tirar. Puedes anotar el resultado.","You roll your own dice and the app tells you what to roll. You can enter the result."):tx("La app tira los dados por ti.","The app rolls the dice for you.")}</p>
  ${document.body.hasAttribute("data-quick")?`<h3>${tx("Uso rápido para ataques sin límite","Quick use for unlimited attacks")}</h3><div class="lk-mode lk-two">${[["1",tx("Activado","On")],["0",tx("Desactivado","Off")]].map(([k,n])=>`<button data-lkquick="${k}" aria-pressed="${look.quick===(k==="1")}">${n}</button>`).join("")}</div>
  <p class="note" style="margin-top:6px">${tx("Activado: armas, golpes sin arma y trucos se usan con un toque. Lo que tiene usos limitados siempre muestra antes su ficha.","On: weapons, unarmed strikes and cantrips are used with one tap. Anything with limited uses always shows its sheet first.")}</p>`:""}
  <h3>Idioma / Language</h3><div class="lk-mode lk-two">${Object.entries(LANGS).map(([k,o])=>`<button data-lklang="${k}" lang="${k}" aria-pressed="${look.lang===k}">${n(o)}</button>`).join("")}</div>
  <p class="lk-ver">${tx("Versión","Version")} ${APP_VERSION}</p></div>`}
function openLook(){let d=document.getElementById("lk");
  if(!d){d=document.createElement("dialog");d.id="lk";d.className="lk";document.body.append(d);
    d.addEventListener("click",e=>{const b=e.target.closest("button");if(e.target===d||(b&&b.dataset.lk==="close"))return d.close();if(!b)return;
      const k=b.dataset.lkpal?"pal":b.dataset.lkmode?"mode":b.dataset.lklang?"lang":b.dataset.lkquick?"quick":"dice",val=b.dataset["lk"+k];
      setLook({...look,[k]:val});d.querySelector(`[data-lk${k}="${val}"]`)?.focus()})}
  drawLook();d.showModal()}
applyLook();darkQ.addEventListener("change",applyLook);
addEventListener("storage",e=>{if(e.key===LOOK_KEY){const v=readLook();if(v){look=v;applyLook();if(typeof onLook==="function")onLook()}}});
</script>

/* Acciones de una forma (form) solo en esa forma y con su opción elegida (opt); en una forma con hideAttacks se ocultan los ataques normales */
const formShows=(c,a)=>{const f=formOf(c);return a.form?S.form===a.form&&(!a.opt||S.formOpts.includes(a.opt)):!(f&&f.hideAttacks&&a.kind==="attack")};
/* on: el efecto está activo (tocar lo termina) · out: no se puede usar ahora (sin usos, ya usado, requisito) */
function actState(a){return{
  eco:a.kind!=="info"&&!(a.kind==="frenzy"&&S.frenzy)&&econWarn(a.cost),
  out:a.res&&S.res[a.res]<=0&&a.kind!=="info"&&!(a.kind==="haki"&&S.hard>0)||a.inv&&invQ(a.inv)<=0||a.once&&S.used[a.once]||a.perTurn&&S.turn[a.perTurn]||a.kind==="stay1"&&S.hp>0||a.needs&&!S.turn[a.needs]||a.kind==="form"&&(S.sea||S.form&&S.form!==a.form),
  on:a.kind==="haki"&&S.hard>0||a.kind==="frenzy"&&S.frenzy||a.kind==="transform"&&S.trans||a.kind==="toggle"&&S.turn[a.flag]||a.kind==="form"&&S.form===a.form}}
function actBtn(a,i){
  const c=C();let big="",tags="";
  if(a.kind==="attack"||a.kind==="deflect"){const w=c.weapons[a.w],st=wStats(w);big=`${sgn(st.hit)}<small>${w.dice}${st.mod?sgn(st.mod):""} ${w.type}</small>`;if(st.h)tags+=`<span class="tag h">Haki</span>`;if(st.fr)tags+=`<span class="tag h">${tx("Frenesí","Frenzy")}</span>`}
  else if(a.kind==="dash")big=`${tx("CD","DC")} ${a.dc}<small>${tx(`salv. ${a.save}`,`${a.save} save`)}${a.dmg?" · "+a.dmg:""}</small>`;
  else if(a.kind==="pool")big=`${S.res[a.res]}<small>${tx("PV en reserva","HP in pool")}</small>`;
  else if(a.kind==="steel")big=`${sgn(a.hit)}<small>${a.dmg} × ${a.targets}</small>`;
  else if(a.kind==="heal")big=`${a.heal}<small>${tx("PV","HP")}</small>`;
  else if(a.kind==="haki")big=S.hard>0?`${S.hard}<small>${tx("turnos","turns")}</small>`:`+${c.hardening.bonus}<small>${tx("atq. y daño","atk. and dmg.")}</small>`;
  else if(a.kind==="temproll")big=`+${a.temp}<small>${tx("PV temporales","temp. HP")}</small>`;
  else if(a.kind==="frenzy")big=S.frenzy?`<small>${tx("Activa","Active")}</small>`:`+${c.frenzy.dmg}<small>${tx("daño","damage")}</small>`;
  else if(a.kind==="transform"||a.kind==="toggle")big=a.kind==="transform"&&S.trans||a.kind==="toggle"&&S.turn[a.flag]?`<small>${tx("Activo","Active")}</small>`:"";
  else if(a.kind==="group")big=a.temp?`+${a.temp}<small>${tx(`PV temp. · ${a.t} criaturas`,`temp. HP · ${a.t} creatures`)}</small>`:a.heal?`+${a.heal}<small>${tx("PV a aliados","HP to allies")}</small>`:"";
  else if(a.kind==="firstaid")big=`${a.heal}+${tx("nivel","level")}<small>${tx("PV","HP")}</small>`;
  const {out,on,eco}=actState(a);
  const left=a.inv?" · "+invLeft(a.inv):"",ctr=actCtr(c,a);
  const d=a.kind==="haki"&&S.hard>0?tx("Activo · toca para terminarlo","Active · tap to end it"):a.kind==="frenzy"&&S.frenzy?tx("Activa · toca para terminarla (acción adicional)","Active · tap to end it (bonus action)"):a.kind==="transform"&&S.trans?tx(`Activo · toca para terminarlo (acción adicional; ganas ${c.transform.exh} de agotamiento)`,`Active · tap to end it (bonus action; you gain ${c.transform.exh} level of exhaustion)`):a.note;
  const ico=a.companion?"companion":a.kind==="haki"||a.haki?"haki":a.kind==="attack"?"weapon":"";
  return `<button class="act ${on?"on":""}" data-act="${i}" ${out&&!on||eco?'aria-disabled="true"':""}><span class="n">${ico?sico(ico):""}${a.name}${tags}</span><span class="big">${big}</span><span class="d">${ctr}${eco?`<b class="spent">${eco}</b> `:""}${d}${left}</span></button>`;
}

/* forms: {id:{name, hp (PV propios, opcional), ac, apa (ataques por acción), scores (FUE/DES/CON nuevas), pick + opts (opciones a elegir), bar, endCost}} */

function endForm(c){const f=formOf(c);if(f&&f.hp)S.hp=S.humanHp;S.form="";S.formOpts=[]}
function formPicker(c,i){const a=c.actions[i],f=c.forms[a.form],sel=T.fsel;

/* Inventario de munición especial (items): cada uno se dispara con su coste y CD propia, y gasta una unidad */
function itemSec(c){

    <button class="btn gold" data-do="harvest">${c.itemsFill}</button></div></section>`}

/* companion: name, kind, hp, ac, dc, atk, heads (cabezas) y headDmg (daño en un turno que puede matar una cabeza), tfName (transformación), attacks.
   Ataque con multi:"heads": un ataque por cabeza viva. Estado en S.comp: hp, temp, heads, tf, turnDmg. La mascota actúa en su propio turno: no gasta acciones del personaje */
/* ===================== INVENTARIO ===================== */
/* Vive en el estado del personaje (S.inv: dinero y objetos; S.ilog: historial), así lo cambian solo su jugador y el DM (reglas de state).
   El DM da o quita con entregas (progress.grants) que el teléfono del jugador aplica una sola vez (S.gotG), como el prestigio.
   Objetos: w = arma enlazada a su ataque; k = consumible que se gasta solo en combate (balas, virotes, flechas, kits, "pg:" Pop Greens); eq = equipado */
function keyOf(c){return Object.keys(CHARS).find(k=>CHARS[k]===c)||cur} // declarada (no const): merge la usa al cargar
const fmtB=n=>String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".");

  return{money:Number.isSafeInteger(v.money)&&v.money>=0?v.money:0,items:v.items.filter(x=>x&&typeof x==="object").slice(0,100).map((x,i)=>({id:typeof x.id==="string"?x.id.slice(0,24):"x"+i,
    ...(typeof x.k==="string"?{k:x.k.slice(0,24)}:{}),...(c.weapons&&typeof x.w==="string"&&Object.hasOwn(c.weapons,x.w)?{w:x.w}:{}),
    n:txt(x.n,60)||"?",q:Number.isInteger(x.q)?Math.min(9999,Math.max(0,x.q)):0,note:txt(x.note,80),eq:x.eq===true}))}}

function invGo(c){const o=T.inv,w=$("invw"),bad=m=>{w.textContent=m;w.hidden=false};
  if(o.op==="money"){const n=parseInt($("invm").value,10),note=$("invn").value.trim().slice(0,80);
    if(!(n>0&&n<=1e12))return bad(tx("Escribe una cantidad.","Enter an amount."));
    if(o.s<0&&n>S.inv.money)return bad(tx(`No te alcanza: tienes ฿${fmtB(S.inv.money)}.`,`Not enough: you have ฿${fmtB(S.inv.money)}.`));
    S.inv.money+=o.s*n;const t=o.s>0?tx(`Ganaste ฿${fmtB(n)}`,`You earned ฿${fmtB(n)}`):tx(`Gastaste ฿${fmtB(n)}`,`You spent ฿${fmtB(n)}`);ilogAdd(t,note);log(esc(t+(note?" · "+note:"")))}
  else{const name=$("invname").value.trim().slice(0,60),q=parseInt($("invqty").value,10),note=$("invnote").value.trim().slice(0,80),eq=$("inveq").checked;
    if(!name)return bad(tx("Escribe el nombre.","Enter the name."));if(!(q>=0&&q<=9999))return bad(tx("La cantidad va de 0 a 9999.","The quantity goes from 0 to 9999."));
    if(o.op==="add"){S.inv.items.push({id:"u"+Date.now().toString(36),n:name,q,note,eq});ilogAdd(tx(`Agregaste ${name} ×${q}`,`You added ${name} ×${q}`),note)}
    else{const x=S.inv.items.find(y=>y.id===o.id);if(!x)return;const old=`${nmOf(x)} ×${x.q}`;if(name!==nmOf(x))x.n=name;if(note!==tl(x.note))x.note=note;x.q=q;x.eq=eq;
      ilogAdd(tx(`Editaste ${old} → ${name} ×${q}`,`You edited ${old} → ${name} ×${q}`),note)}}
  $("tray").classList.add("hide");save();render()}
/* Entregas del DM: se aplican una sola vez en el teléfono del jugador, con aviso en segunda persona */
const grantTxt=g=>[g.m?`${g.m>0?"+":"−"}฿${fmtB(g.m)}`:"",g.n?`${g.q>0?"+":"−"}${esc(g.n)} x${Math.abs(g.q)}`:""].filter(Boolean).join(" · ");
function invGrants(P){const gs=(P.grants||[]).filter(g=>!S.gotG.includes(g.id)).reverse();if(!gs.length)return;const L=[];
  for(const g of gs){const p=[];
    if(g.m){S.inv.money=Math.max(0,S.inv.money+g.m);p.push(g.m>0?tx(`El DM te dio ฿${fmtB(g.m)}`,`The DM gave you ฿${fmtB(g.m)}`):tx(`El DM te quitó ฿${fmtB(g.m)}`,`The DM took ฿${fmtB(g.m)} from you`))}
    if(g.n&&g.q){const low=g.n.trim().toLowerCase(),x=S.inv.items.find(y=>(isTxt(y.n)?[y.n.es,y.n.en]:[y.n]).some(z=>z.toLowerCase()===low));
      if(x){x.q=Math.max(0,x.q+g.q);if(!x.q&&!x.k&&g.q<0)S.inv.items=S.inv.items.filter(y=>y!==x)}else if(g.q>0)S.inv.items.push({id:"g"+g.id,n:g.n,q:g.q,note:"",eq:false});
      p.push(g.q>0?tx(`Recibiste: ${g.n} x${g.q}`,`You received: ${g.n} x${g.q}`):tx(`El DM se llevó: ${g.n} x${-g.q}`,`The DM took: ${g.n} x${-g.q}`))}
    S.gotG=[g.id,...S.gotG].slice(0,40);
    if(p.length){S.ilog=[{at:g.at||Date.now(),by:"DM",t:p.join(" · "),note:g.note},...S.ilog].slice(0,60);L.push(p.join(" · ")+(g.note?" · "+g.note:""))}}
  if(L.length){log(esc(L.join(" · ")));cbToast(`<b>${esc(L.join(" · "))}</b>`);buzz(120)}save()}

  else if(a.kind==="group")R.push(a.temp?[tx("PV temporales","Temporary HP"),`${a.temp}${a.t?tx(` · hasta ${a.t} criaturas`,` · up to ${a.t} creatures`):""}`]:["heal",`${a.heal} ${tx("PV","HP")}`]);

/* ===================== EFECTOS CON DURACIÓN ===================== */
/* S.fx: efectos activos del personaje. t: "r" (left rondas; bajan al inicio de tu turno; 1 minuto = 10), "start" (hasta el inicio de tu
   siguiente turno), "end" (ends finales de turno; 2 si empieza en tu turno), "conc" (mientras te concentres), "long" (min minutos: se ven
   como texto y terminan a mano, con un descanso o con "Avanzar tiempo" del DM) o "until" (mientras dure otro estado).
   Los rasgos que ya guardan su estado (Endurecimiento, frenesí, Sulong, Paso de nube, formas, posturas, concentración) crean su efecto
   solos (fxSweep); las acciones con dur lo crean al usarlas (fxAdd). Al vencer, FXOFF apaga el estado y el jugador ve un aviso */
const fxId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const FXON={hard:()=>S.hard>0,frenzy:()=>S.frenzy,trans:()=>S.trans,float:()=>S.float>0,stage:()=>S.stageAC,muscle:()=>!!S.muscle,rampage:()=>S.turn.rampage,form:()=>!!S.form,
  conc:x=>S.conc.id===x.cid,"until:frenzy":()=>S.frenzy};
const FXOFF={hard:()=>{S.hard=0},frenzy:()=>{S.frenzy=false;S.muscle=""},trans:c=>{S.trans=false;S.exh=Math.min(6,S.exh+c.transform.exh)},float:()=>{S.float=0},
  stage:()=>{S.stageAC=false},muscle:()=>{S.muscle=""},rampage:()=>{S.turn.rampage=false},form:c=>{endForm(c)},conc:()=>{S.conc={id:"",lvl:0}}};
/* "1 minuto" = 10 rondas, "10 minutos" = 100, "1 hora" = 60 minutos (largo), "1 ronda" = 1 */
function parseDur(d){const m=String(d||"").match(/(\d+)\s*(ronda|round|minut|hora|hour)/i);if(!m)return null;const n=+m[1],u=m[2].toLowerCase();
  return/^(ronda|round)/.test(u)?{t:"r",left:n}:/^minut/.test(u)?(n>=60?{t:"long",min:n}:{t:"r",left:n*10}):{t:"long",min:n*60}}
console.assert(parseDur("10 minutos").left===100&&parseDur("1 hour").min===60&&parseDur("1 ronda").left===1&&!parseDur("Instantáneo"),"duraciones");
function durRule(d,cost){if(typeof d==="number")return{t:"r",left:d};if(d==="start")return{t:"start"};if(d==="end")return{t:"end",ends:cost==="reaccion"?1:2};
  if(String(d).startsWith("long:"))return{t:"long",min:+d.slice(5)};if(String(d).startsWith("until:"))return{t:"until",k:d};return{t:"r",left:10}}
function fxAdd(c,a){S.fx=S.fx.filter(x=>x.src!=="a:"+a.xid);S.fx.push({id:fxId(),src:"a:"+a.xid,...durRule(a.dur,a.cost)})}

  return({hard:act("haki"),frenzy:c.frenzy&&c.frenzy.name,trans:c.transform&&c.transform.name,float:act("float"),stage:c.stage&&c.stage.name+tx(" (+CA)"," (+AC)"),
    muscle:act("muscle"),rampage:(c.actions.find(a=>a.flag==="rampage")||{}).name,form:S.form&&formOf(c)&&formOf(c).name,conc:x.cid&&concOf(c,x.cid)&&concOf(c,x.cid).n})[x.k]||x.n||"?"}
const fxLeft=x=>x.t==="r"?(x.left>=10&&x.left%10===0?tx(`${x.left/10} min`,`${x.left/10} min`):tx(`${x.left} ${x.left===1?"ronda":"rondas"}`,`${x.left} ${x.left===1?"round":"rounds"}`))
  :x.t==="long"?(x.min>=60?`${Math.round(x.min/6)/10} h`:`${x.min} min`):x.t==="start"?tx("hasta tu próximo turno","until your next turn")

function fxSweep(c){const has=k=>S.fx.some(x=>x.k===k);

/* Inicio de tu turno: bajan las rondas y vencen los "hasta tu próximo turno" */
function fxTick(c){fxSweep(c);for(const x of [...S.fx]){if(x.t==="r"){x.left--;if(x.k==="hard")S.hard=Math.max(0,x.left);if(x.left<=0)fxEnd(c,x,true)}else if(x.t==="start")fxEnd(c,x,true)}}

  if(x.t==="r"){x.left-=10*min;if(x.k==="hard")S.hard=Math.max(0,x.left);if(x.left<=0)fxEnd(c,x,true)}
  else if(x.t==="long"){x.min-=min;if(x.min<=0)fxEnd(c,x,true)}else if(x.t==="start"||x.t==="end")fxEnd(c,x,true)}}
/* Emoción del combate: al final de tu turno pregunta si atacaste o recibiste daño */
function thrillAsk(c,hint){if(!S.frenzy||S.hp<=0)return;
  show({title:c.frenzy.name,html:`<div class="trayact"><button class="btn primary" data-do="thrill" data-y="1">${tx("Sí: sigue","Yes: it continues")}</button><button class="btn" data-do="thrill" data-y="0">${tx("No: termina","No: it ends")}</button></div>`,
    tip:tx("¿Atacaste o recibiste daño desde tu último turno? ","Did you attack or take damage since your last turn? ")+(hint?tx("La app registró que sí.","The app recorded that you did."):tx("La app no registró ataques ni daño.","The app didn't record attacks or damage."))})}
function endTurn(c){if(S.turnEnded)return;const hint=S.turn.attacked||S.turn.hurt||S.hurt;fxEndTurn(c);S.turnEnded=true;thrillAsk(c,hint);fxNotice()}
function fxOpen(id){const c=C(),x=S.fx.find(y=>y.id===id);if(!x)return;const n=fxName(c,x);

    start:tx("Termina al empezar tu próximo turno.","It ends when your next turn starts."),end:tx("Termina al final de tu próximo turno (cuando el DM pasa el turno, o al tocar Nuevo turno).","It ends at the end of your next turn (when the DM passes the turn, or when you tap New Turn)."),
    conc:tx("Dura mientras mantengas la concentración.","It lasts while you keep concentrating."),long:tx("Duración larga: termínalo a mano, con un descanso o cuando el DM avance el tiempo.","Long duration: end it by hand, with a rest or when the DM advances time."),

  ...(Number.isInteger(x.left)?{left:x.left}:{}),...(Number.isInteger(x.ends)?{ends:x.ends}:{}),...(Number.isInteger(x.min)?{min:x.min}:{})})):[]}

/* ===================== TIENDA DE PRESTIGIO (HAKI) ===================== */
/* El jugador elige un avance y deja una solicitud (progress.buy, lo único de progress que puede escribir además de su propuesta de nivel);
   el DM la aprueba o la rechaza en Mesa. Solo al aprobar se descuentan los puntos y se agrega el avance (progress.haki y hakiN). */
const HKR=[5,1,2,3,4]; // rareza del catálogo (0 Común … 4 Legendario) → código de RARITY
const rarOf=r=>RARITY.find(x=>x[2]===HKR[r]);
const hakiE=id=>HAKI.find(x=>x.id===id);
const hakiName=id=>{const e=hakiE(id);return e?tl(e.n):id};
function hakiSug(e,L){return{q:Math.ceil(L/4),h:Math.ceil(L/2),w:L}[e.wf]} // declarada: levelSrc la usa al cargar
const hakiSum=(e,n)=>tl(e.sum).split("{HW}").join(n==null?tx("? (revisar)","? (review)"):String(n));
const hakiOwned=k=>[...((CHARS_SRC[k]||{}).haki||[]),...((PROG[k]||{}).haki||[])];
function hakiCount(k,col){return hakiOwned(k).filter(id=>{const e=hakiE(id);return e&&e.c===col&&e.r>0}).length+(((CHARS_SRC[k]||{}).hakiCls||{})[col]||0)}
/* Motivo por el que no se puede pedir (vacío = se puede) */
function hakiWhy(k,e){const P=PROG[k]||{},o=hakiOwned(k),cost=rarOf(e.r)[1],p=prestOf(k);
  if(o.includes(e.id)||HAKI.some(x=>x.repl===e.id&&o.includes(x.id)))return tx("Ya lo tienes","You already have it");
  if(P.buy&&P.buy.st==="pend")return tx("Ya tienes una solicitud pendiente","You already have a pending request");
  if(e.r===0&&CHARS[k].level>4)return tx("Solo para niveles 1 a 4 (aficionado)","Levels 1 to 4 only (amateur)");
  if(e.c==="king"&&!((CHARS_SRC[k]||{}).king||P.king))return tx("Necesitas Cualidades de un rey (lo decide el DM)","You need Qualities of a King (the DM decides)");
  const need=e.t===2?4:e.t===3?6:0,have=hakiCount(k,e.c);
  if(have<need)return tx(`Nivel ${e.t}: necesitas ${need} rasgos de este color (tienes ${have})`,`Tier ${e.t}: you need ${need} features of this color (you have ${have})`);
  if(e.req){const miss=e.req.filter(r=>!o.includes(r));if(e.reqAny?miss.length===e.req.length:miss.length)return tx("Necesitas ","You need ")+miss.map(hakiName).join(e.reqAny?tx(" o "," or "):", ")}
  if(cost>p)return tx(`Te falta${cost-p>1?"n":""} ${cost-p} punto${cost-p>1?"s":""}`,`You need ${cost-p} more point${cost-p>1?"s":""}`);
  return""}
function hakiRows(k,e){const [rn,cost]=rarOf(e.r),L=CHARS[k].level,n=((PROG[k]||{}).hakiN||{})[e.id];
  return[[tx("Rareza","Rarity"),`${rn} · ${cost} ${tx(cost===1?"punto":"puntos",cost===1?"point":"points")}`],[tx("Nivel de Haki","Haki tier"),e.t?String(e.t):tx("Aficionado (sin nivel)","Amateur (no tier)")],
    [tx("Requisitos","Prerequisites"),[e.c==="king"?tx("Cualidades de un rey","Qualities of a King"):"",e.r===0?tx("nivel 1 a 4","level 1 to 4"):"",e.t>1?tx(`${e.t===2?4:6} rasgos de este color`,`${e.t===2?4:6} features of this color`):"",...(e.req||[]).map(hakiName)].filter(Boolean).join(e.reqAny?tx(" o "," or "):" · ")||tx("Ninguno","None")],
    e.a?[tx("Uso","Use"),(COST[e.a]||e.a)+(e.u?` · ${String(e.u[0]).startsWith("=")?tx("tantos usos como tu competencia","as many uses as your proficiency"):e.u[0]+" "+tx(e.u[0]===1?"uso":"usos",e.u[0]===1?"use":"uses")} · ${RESTN(e.u[1])}`:"")]:[tx("Uso","Use"),tx("Pasivo","Passive")],
    e.wf?[tx("Voluntad","Willpower"),tx(`Revisar: el Haki no usa Voluntad; número fijo sugerido ${hakiSug(e,L)} (lo fija el DM al aprobar)`,`Review: Haki doesn't use Willpower; suggested fixed number ${hakiSug(e,L)} (the DM sets it when approving)`)+(n!=null?tx(` · fijado en ${n}`,` · set to ${n}`):"")]:null,
    e.repl?[tx("Reemplaza a","Replaces"),hakiName(e.repl)]:null,e.up?[tx("Al nivel 5","At level 5"),tx("se convierte en ","becomes ")+hakiName(e.up)]:null].filter(Boolean)}
let SHOPTAB="arm";
function shopOpen(col){if(col)SHOPTAB=col;const k=cur,P=PROG[k]||{},p=prestOf(k),b=P.buy&&P.buy.st==="pend"?P.buy:null;
  const item=e=>{const why=hakiWhy(k,e),[rn,cost]=rarOf(e.r),n=(P.hakiN||{})[e.id];
    return`<button class="act" data-hbuy="${e.id}" ${why?'aria-disabled="true"':""}><span class="n">${tl(e.n)}${hint(e.n.en)}<span class="tag">${rn} · ${cost}</span>${e.wf?`<span class="tag">${tx("Revisar","Review")}</span>`:""}</span>
      <span class="d">${hakiSum(e,n??hakiSug(e,CHARS[k].level))}${e.req?` · ${tx("Requiere","Requires")} ${e.req.map(hakiName).join(e.reqAny?tx(" o "," or "):", ")}`:""}${why?`<br><b class="spent">${why}</b>`:""}</span></button>`};
  show({title:tx("Gastar prestigio","Spend prestige"),sheet:true,shop:1,html:`<p class="note"><b>${tx(`Tienes ${p} ${p===1?"punto":"puntos"} de prestigio`,`You have ${p} Prestige ${p===1?"Point":"Points"}`)}</b> · ${["arm","obs","king"].map(c=>`${tl(HAKI_COLORS[c])}: ${hakiCount(k,c)}`).join(" · ")}</p>
    <p class="note">${tx("Costos","Costs")}: ${RARITY.map(([n,v])=>`${n} ${v}`).join(" · ")}. ${tx("Nivel 2 pide 4 rasgos de ese color y nivel 3, 6.","Tier 2 needs 4 features of that color and tier 3, 6.")}</p>
    ${b?`<div class="warn">${tx("Solicitud enviada al DM","Request sent to the DM")}: <b>${hakiName(b.id)}</b> · <button class="linkbtn" data-do="buycancel">${tx("Cancelar solicitud","Cancel request")}</button></div>`:""}
    ${!(CHARS_SRC[k]||{}).fruit?`<p class="note">${tx("Purista del Haki: como no tienes fruta, en los niveles 4, 10 y 16 eliges una mejora (Calidad, Cantidad o Resistencia de tu Haki). La aplica el DM; la pierdes si comes una fruta.","Haki Purist: since you have no fruit, at levels 4, 10 and 16 you choose an improvement (Quality, Quantity or Stamina of your Haki). The DM applies it; you lose it if you eat a fruit.")}</p>`:""}
    <div class="adv" role="group" aria-label="${tx("Color de Haki","Haki color")}">${["arm","obs","king"].map(c=>`<button data-do="shoptab" data-c="${c}" aria-pressed="${SHOPTAB===c}">${tl(HAKI_COLORS[c]).replace(/^Color (de |del |of the |of )/,"")}</button>`).join("")}</div>
    ${[0,1,2,3].map(t=>{const L=HAKI.filter(e=>e.c===SHOPTAB&&e.t===t);return L.length?`<h3 class="lvh">${t?tx(`Nivel ${t}`,`Tier ${t}`):tx("Aficionado (sin nivel)","Amateur (no tier)")}</h3><div class="list">${L.map(item).join("")}</div>`:""}).join("")}`})}
function hakiOpen(id,ex){const k=cur,e=hakiE(id),why=hakiWhy(k,e),cost=rarOf(e.r)[1],R=hakiRows(k,e),n=((PROG[k]||{}).hakiN||{})[id]??hakiSug(e,CHARS[k].level);
  if(ex)return explainView(tl(e.n),"haki:"+id,e.a||"",[["what",hakiSum(e,n)],...R],()=>hakiOpen(id));
  show({title:tl(e.n),sheet:true,warn:why,html:`${dl([["what",hakiSum(e,n)],...R])}<button class="btn primary use" data-do="hreq" data-id="${id}" ${why?"disabled":""}>${tx(`Pedir al DM · ${cost} ${cost===1?"punto":"puntos"}`,`Ask the DM · ${cost} ${cost===1?"point":"points"}`)}</button>
    <div class="trayact"><button class="btn" data-do="shop">${tx("Volver a la tienda","Back to the shop")}</button></div>`})}
/* Avisos al jugador cuando el DM responde (una vez por respuesta, mc:buyseen) */
function buyNotice(P){const b=P.buy;if(!b||b.st==="pend"||!b.at)return;const key=b.at+b.st;if(store.get("mc:buyseen")===key)return;store.set("mc:buyseen",key);
  cbToast(b.st==="ok"?`<b>${tx(`El DM aprobó tu compra: ${esc(hakiName(b.id))}`,`The DM approved your purchase: ${esc(hakiName(b.id))}`)}</b> · ${tx(`Te quedan ${P.prestige} de prestigio`,`You have ${P.prestige} prestige left`)}${b.note?" · "+esc(b.note):""}`
    :`<b>${tx(`El DM rechazó tu solicitud: ${esc(hakiName(b.id))}`,`The DM rejected your request: ${esc(hakiName(b.id))}`)}</b>${b.note?" · "+esc(b.note):""}`);buzz(120)}
/* Mesa: el DM revisa la solicitud (y fija el número de los avances que usaban Voluntad) */
function buyDm(k){const P=PROG[k]||{},b=P.buy;let h=`<label class="lvck"><input type="checkbox" data-king="${k}" ${P.king||(CHARS_SRC[k]||{}).king?"checked":""}><span>${tx("Cualidades de un rey (puede comprar Haki del Rey Supremo)","Qualities of a King (can buy Supreme King Haki)")}</span></label>`;
  if(!b||b.st!=="pend")return h;const e=hakiE(b.id);if(!e)return h;const [rn,cost]=rarOf(e.r),p=prestOf(k),sug=hakiSug(e,CHARS[k].level),why=hakiWhy(k,e).replace(tx("Ya tienes una solicitud pendiente","You already have a pending request"),"");
  return h+`<div class="lvrv"><b>${tx("Solicitud de Haki","Haki request")}: ${tl(e.n)}${hint(e.n.en)}</b><p class="note">${tl(HAKI_COLORS[e.c])} · ${rn} · ${cost} ${tx("puntos","points")} · ${tx(`tiene ${p}`,`has ${p}`)}</p>
    <p class="note">${hakiSum(e,sug)}</p>${why?`<div class="warn">${why}</div>`:""}
    ${e.wf?`<div class="hp"><label class="tip" for="hw-${k}" style="flex:1">${tx(`Revisar: el Haki no usa Voluntad. Número fijo para {HW} (sugerido ${sug})`,`Review: Haki doesn't use Willpower. Fixed number for {HW} (suggested ${sug})`)}</label><input class="hpin" id="hw-${k}" type="number" inputmode="numeric" min="0" max="40" value="${sug}"></div>`:""}
    <input class="hpin" id="hn-${k}" type="text" maxlength="120" placeholder="${tx("Nota para el jugador (opcional)","Note for the player (optional)")}" style="width:100%;text-align:left;font-size:15px">
    <div class="trayact"><button class="btn primary" data-hok="${k}" ${p<cost?"disabled":""}>${tx("Aprobar","Approve")}</button><button class="btn" data-hno="${k}">${tx("Rechazar","Reject")}</button></div></div>`}
function buyDecide(k,ok){const P=PROG[k]||{},b=P.buy,e=b&&hakiE(b.id);if(!e)return;const note=(($("hn-"+k)||{}).value||"").trim().slice(0,120);
  if(!ok)return progWrite(k,{buy:{...b,st:"no",note,at:Date.now()}});
  const [,cost,code]=rarOf(e.r),p=prestOf(k);if(p<cost)return;const n=e.wf?Math.max(0,Math.min(40,parseInt(($("hw-"+k)||{}).value,10)||hakiSug(e,CHARS[k].level))):null;
  progWrite(k,{prestige:p-cost,plog:[{at:Date.now(),n:-cost,r:code,note:tl(e.n)},...(P.plog||[])].slice(0,30),haki:[...(P.haki||[]),e.id],hakiN:{...(P.hakiN||{}),...(n!=null?{[e.id]:n}:{})},buy:{...b,st:"ok",note,at:Date.now()}})}

async function cloudInit(){

async function signedIn(u){
  unsub.forEach(f=>f());unsub=[];if(stateUnsub){stateUnsub();stateUnsub=null}if(progUnsub){progUnsub();progUnsub=null}
  user=u;admin=false;
  if(!u){view="login";render();return}
  view="load";render();
  const {F,db}=fb;
  try{admin=(await F.getDoc(F.doc(db,"admins",u.uid))).exists()}catch(e){}
  unsub.push(F.onSnapshot(F.doc(db,"combat","live"),d=>onCombat(d.exists()?d.data():null),()=>onCombat(null)));
  if(admin){
    unsub.push(F.onSnapshot(F.collection(db,"state"),q=>{q.forEach(d=>mesa.state[d.id]=d.data());if(view==="mesa")render()}));
    unsub.push(F.onSnapshot(F.collection(db,"progress"),q=>q.forEach(d=>onProg(d.id,d.data()))));
    unsub.push(F.onSnapshot(F.collection(db,"players"),q=>{mesa.players=q.docs.map(d=>({id:d.id,...d.data()}));
      const me=mesa.players.find(p=>p.id===u.uid);if(me)setLook(me.look,true);if(view==="mesa")render()}));
    view="mesa";render();return;
  }
  const ref=F.doc(db,"players",u.uid);
  unsub.push(F.onSnapshot(ref,d=>{
    if(!d.exists()){if(!d.metadata.fromCache)F.setDoc(ref,{name:u.displayName||"",email:u.email||"",char:null});return}
    const k=d.data().char;setLook(d.data().look,true);

function hpCalc(){const h=T&&T.hp,el=$("hpcalc");if(!h||!el)return;

/* PV temporales primero; una forma con PV propios absorbe el daño y, si llega a 0, vuelve a forma humana con el daño sobrante.
   Luego: fin del frenesí y de la concentración a 0 PV. La bandeja ofrece la CD de concentración, los rasgos con trigger ("half" o "zero")
   y las reacciones al recibir un golpe (onHit). lastHit guarda los PV de antes para que esas reacciones rehagan el daño (rehit) */
let lastHit=null,quiet=false;
const HPF=["hp","temp","form","formOpts","humanHp","conc","frenzy","muscle","dead","ds"];
const hitOk=()=>!!lastHit&&lastHit.cur===cur&&S.hp===lastHit.hp&&S.temp===lastHit.temp;
function takeDamage(c,raw,ty="",mag=false,why=""){
  const snap=JSON.parse(JSON.stringify(Object.fromEntries(HPF.map(k=>[k,S[k]])))),th=S.turn.hurt,{v:n,txt}=dmgSteps(c,"me",raw,ty,mag),calc=txt.includes("→")?txt:"";
  const before=S.hp;dropPrev={frenzy:S.frenzy,muscle:S.muscle,conc:{...S.conc}};const ab=Math.min(S.temp,n);S.temp-=ab;let rest=n-ab;
  const f=formOf(c);

  S.hp=Math.max(0,S.hp-rest);if(n>0){S.hurt=true;S.turn.hurt=true}
  const w=why?` (${why})`:"",line=tx(`Recibiste <b>${n}</b> de ${dmgName(ty)}${w}${calc?` · ${calc}`:""}${ab?` · tus PV temporales absorbieron ${ab}`:""}`,`You took <b>${n}</b> ${dmgName(ty)}${w}${calc?` · ${calc}`:""}${ab?` · your temporary HP absorbed ${ab}`:""}`);log(line);
  if(S.hp<=0&&S.form){log(HUMAN_(formOf(c).name));endForm(c)}
  const offA=c.actions.map((x,i)=>[x,i]).filter(([x])=>x.trigger&&!S.used[x.once]&&(x.trigger==="half"?S.hp>0&&S.hp<=mhp(c)/2:S.hp<=0&&before>0));
  if(S.hp>0)dropPrev=null;
  if(S.hp<=0&&S.frenzy){S.frenzy=false;S.muscle="";log(tx(`Termina ${c.frenzy.name}: quedas inconsciente`,`${c.frenzy.name} ends: you're unconscious`))}
  const boxes=[],tips=[];let acts="";
  if(S.conc.id&&S.hp<=0){log(LOSTC_(concOf(c,S.conc.id).n));S.conc={id:"",lvl:0}}
  else if(S.conc.id&&n>0){const dc=Math.max(10,Math.floor(n/2));
    boxes.push({l:tx("CD salvación CON","CON save DC"),v:dc,s:tx("10 o la mitad del daño, lo que sea mayor","10 or half the damage, whichever is higher")});
    acts+=`<button class="btn primary" data-do="concsave" data-dc="${dc}">${tx("Tirar salvación de CON","Roll CON saving throw")} (${sgn(sv(c,"CON"))})</button>`;
    tips.push(tx(`Si fallas, pierdes la concentración en ${concOf(c,S.conc.id).n}.`,`If you fail, you lose concentration on ${concOf(c,S.conc.id).n}.`))}
  if(offA.length)tips.push(S.hp<=0?tx("Puedes evitar caer inconsciente.","You can avoid falling unconscious."):tx("Quedaste con la mitad de tus PV o menos.","You're at half your HP or less."));
  /* Respuestas al golpe (rasgos con trigger y reacciones onHit disponibles): se eligen en una lista que solo muestra el efecto; nada se gasta hasta Confirmar */
  const econOk=cost=>({reaccion:S.turn.r,adicional:S.turn.b}[cost]??1)>0;
  const opts=[...offA.map(([,i])=>"a"+i),...(n>0?[...c.actions.map((a,i)=>a.onHit&&!a.trigger&&econOk(a.cost)&&!(a.res&&S.res[a.res]<=0)&&!(a.only&&!S[a.only])&&known(a)&&!(a.kind==="muscle"&&S.muscle==="def")?"a"+i:""),
    ...SPECIALS.map(s=>s.onHit&&S.turn.sr>0&&S.sr[s.id]>0?"s"+s.id:"")].filter(Boolean):[])];
  if(opts.length)tips.push(tx("Elige cómo respondes para ver el efecto; puedes cambiarla o tocarla otra vez para quitarla. No se gasta nada hasta Confirmar.","Pick how you respond to see the effect; you can change it or tap it again to clear it. Nothing is spent until you Confirm."));

/* Inicio de turno: economía, efectos por turno y duraciones (botón "Nuevo turno" o aviso del DM) */
function startTurn(c){const ask=!S.turnEnded&&S.frenzy,hint=S.turn.attacked||S.turn.hurt||S.hurt;if(!S.turnEnded)fxEndTurn(c);S.turnEnded=false;S.turn=newTurn(c);S.turn.hurt=S.hurt;S.hurt=false;S.muscle="";S.stageAC=false;if(c.companion)S.comp.turnDmg=0;fxTick(c);$("tray").classList.add("hide");log(tx("— Nuevo turno —","— New turn —"));
  /* En frenesí, Postura de hierro se ofrece al inicio de cada turno */
  const ir=c.actions.findIndex(x=>x.kind==="temproll"&&x.perTurn&&x.only&&S[x.only]);
  if(ir>=0)show({title:tx("Inicio de turno · ","Start of turn · ")+c.frenzy.label,html:`<div class="trayact"><button class="btn primary" data-act="${ir}">${c.actions[ir].name}: +${c.actions[ir].temp} ${tx("PV temporales","temporary HP")}</button></div>`,tip:c.frenzy.note});if(ask)thrillAsk(c,hint);fxNotice()}

/* ===================== TURNOS DEL COMBATE (dm.html) ===================== */
/* combat/live (lo escribe dm.html con sesión de DM): active, round, turnId (sube en cada cambio de turno), cur y next {kind: pc | pet | ally | foe, char, name}.
   Los enemigos llegan sin nombre. Sin cuenta se lee la copia local mc:live (DM y app en el mismo navegador). mc:turnseen: último turno ya avisado en este teléfono */
let CB=null;
const CB_KINDS=["pc","pet","ally","foe"],CB_CHARS=["udon","codel","kalgo","sungsopp","ryuga"];
const cbWho=x=>x&&typeof x==="object"&&CB_KINDS.includes(x.kind)?{kind:x.kind,char:CB_CHARS.includes(x.char)?x.char:null,name:x.kind==="foe"?"":String(x.name||"").slice(0,40)}:null;
const cleanCB=v=>v&&typeof v==="object"&&v.active===true&&cbWho(v.cur)?{round:isInt(v.round,1,9999)?v.round:1,turnId:isInt(v.turnId,0,1e9)?v.turnId:0,cur:cbWho(v.cur),next:cbWho(v.next)}:null;
console.assert(cleanCB({active:true,round:2,turnId:5,cur:{kind:"foe",name:"Kaido"},next:{kind:"pc",char:"udon",name:"Udon"}}).cur.name===""&&cleanCB({active:false})===null,"combate");
/* Turno de quién, visto desde este teléfono: mine (es mi personaje), name (escapado) */
const cbMine=x=>!!x&&!admin&&view==="char"&&x.char===cur;
const cbName=x=>x.kind==="foe"?tx("los enemigos","the enemies"):cbMine(x)&&x.kind==="pc"?tx("tú","you"):esc(x.name);
/* ===== Caídos (los publica dm.html en combat/live: fallen = quién está a 0 PV, estable o sin vida; alerts = los últimos avisos) =====
   Cada aviso se muestra una vez por teléfono (mc:alertseen) y solo si es reciente. El jugador caído ya vio su tarjeta en segunda persona */
let FALL=[];
const FA_EV=["down","stable","up","dead"],FA_K=["pc","pet"];
const cleanFallen=v=>Array.isArray(v)?v.filter(x=>x&&CB_CHARS.includes(x.char)&&FA_K.includes(x.kind)&&["down","stable","dead"].includes(x.st)).slice(0,10).map(x=>({char:x.char,kind:x.kind,name:String(x.name||"").slice(0,40),st:x.st})):[];
const FALL_T=(a,self)=>{const n=esc(a.name);return{down:self?tx("¡Caíste a 0 PV!","You dropped to 0 HP!"):a.kind==="pet"?tx(`¡${n} cayó!`,`${n} is down!`):tx(`¡${n} cayó inconsciente!`,`${n} is down!`),
  stable:self?tx("Estás estable","You're stable"):tx(`${n} está estable`,`${n} is stable`),up:self?tx("¡Volviste a levantarte!","You got back up!"):tx(`¡${n} volvió a levantarse!`,`${n} is back up!`),
  dead:self?tx("Has caído para siempre…","You have fallen for good…"):tx(`${n} ha caído para siempre…`,`${n} has fallen for good…`)}[a.ev]};
/* prev: vista previa del DM con una ficha abierta desde Mesa (no se envía a nadie) */
function fallAlert(a,self,prev){let d=$("fa");if(!d){d=document.createElement("div");d.id="fa";d.setAttribute("role","alert");d.addEventListener("click",()=>d.hidden=true);document.body.append(d)}
  d.className="fa "+a.ev;
  d.innerHTML=`${a.kind==="pc"?pic(a.char,"retrato",64,64,a.name||"?"):`<span class="av">${esc(a.name[0]||"?")}</span>`}<span><b>${FALL_T(a,self)}</b><small>${prev?tx("Vista previa: no se envía al grupo · ","Preview: not sent to the party · "):""}${tx("Toca para cerrar","Tap to close")}</small></span>`;
  d.hidden=false;clearTimeout(d._t);d._t=setTimeout(()=>d.hidden=true,7000);buzz(a.ev==="up"||a.ev==="stable"?160:[300,100,300])}
function onFall(raw){FALL=cleanFallen(raw&&raw.fallen);const al=Array.isArray(raw&&raw.alerts)?raw.alerts:[],seen=store.get("mc:alertseen")||0;let top=seen;
  for(const a of al.slice(0,5).reverse()){if(!a||!isInt(a.id,1,1e14)||a.id<=seen||!FA_EV.includes(a.ev)||!CB_CHARS.includes(a.char)||!FA_K.includes(a.kind))continue;top=Math.max(top,a.id);
    if(!isInt(a.at,0,1e14)||Date.now()-a.at>180000)continue; // solo avisos de los últimos 3 minutos
    const mine=!admin&&view==="char"&&a.char===cur,card=$("rcard");
    if(mine&&a.ev==="down"&&card&&!card.hidden)continue; // ya está viendo su tarjeta "¡Caíste a 0 PV!"
    fallAlert({char:a.char,kind:a.kind,name:String(a.name||"").slice(0,40),ev:a.ev},mine&&a.kind==="pc")}
  if(top>seen)store.set("mc:alertseen",top)}
function onCombat(raw){onFall(raw);const prev=CB;CB=cleanCB(raw);
  /* Avanzar tiempo del DM (también sin combate): una vez por aviso, y solo si es reciente */
  if(raw&&raw.adv&&isInt(raw.adv.id,0,1e13)&&isInt(raw.adv.min,1,1440)&&raw.adv.id!==store.get("mc:advseen")){store.set("mc:advseen",raw.adv.id);
    if(S&&!admin&&view==="char"&&Date.now()-raw.adv.id<36e5){fxAdvance(C(),raw.adv.min);fxNotice();save()}}
  /* Fin de tu turno: el DM pasó el turno de tu personaje a otro */
  if(prev&&S&&!admin&&view==="char"&&cbMine(prev.cur)&&prev.cur.kind==="pc"&&(!CB||CB.turnId!==prev.turnId&&!(cbMine(CB.cur)&&CB.cur.kind==="pc"))){endTurn(C());save()}
  if(CB&&S&&!admin&&view==="char"&&CB.turnId!==store.get("mc:turnseen")){store.set("mc:turnseen",CB.turnId);const c=C(),t=CB.cur,n=CB.next;
    if(cbMine(t)&&t.kind==="pc")myTurn(c);
    else if(cbMine(t)&&t.kind==="pet")petTurn(t);
    else if(cbMine(n))cbToast(n.kind==="pet"?tx(`Prepárate: ${esc(n.name)} va después de ${cbName(t)}`,`Get ready: ${esc(n.name)} goes after ${cbName(t)}`):tx(`Prepárate, vas después de ${cbName(t)}`,`Get ready, you're up after ${cbName(t)}`))}
  render()}
const reduceM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}; // Android vibra; iPhone no tiene la función y no pasa nada

  cbBanner(tx(`¡Es tu turno, ${esc(c.name)}!`,`It's your turn, ${esc(c.name)}!`),tx(`Ronda ${CB.round} · tu turno ya empezó: acción, acción adicional y reacción listas`,`Round ${CB.round} · your turn has started: action, bonus action and reaction ready`));render();cbJump("sec-accion")}

document.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el||el.disabled)return;
  const c=C(),ds=el.dataset;
  if(ds.undo!==undefined){undo();return}
  if(ds.lv){lvClick(ds);return}if(ds.lvdm){lvDmClick(ds);return}
  if(ds.pick){$("tray").classList.add("hide");if(ds.pick==="mesa"){view="mesa";render();return}
    if(user){openChar(ds.pick);return}cur=ds.pick;load();save();render();return}
  if(ds.jump){const s=$(ds.jump);if(!s)return;const h2=s.querySelector("h2");
    s.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
    h2.classList.add("flash");setTimeout(()=>h2.classList.remove("flash"),1200);return}
  if(ds.mode){mode=ds.mode;render();return}
  /* Panel de daño: tipo y "Mágico / con Haki" (sin redibujar la bandeja) */
  if(ds.dty!==undefined&&T&&T.hp){T.hp.ty=T.hp.ty===ds.dty?"":ds.dty;hpCalc();return}
  if(ds.dmag!==undefined&&T&&T.hp){T.hp.mag=!T.hp.mag;hpCalc();return}
  /* Respuesta al golpe: elegir solo muestra el efecto (la app tira una vez por opción, para que cambiar no vuelva a tirar) */
  if(ds.resp&&T&&T.resp){const R=T.resp,k=ds.resp;R.sel=R.sel===k?"":k;
    if(R.sel&&!R.rv[k]){const a=respOf(c,k).a,v=R.rv[k]={},dz=respDice(c,a);
      if(!phys()&&dz){const r=roll(dz);v.n=r.tot;v.txt=r.txt}
      if(!phys()&&RVS.includes(a.kind)){const b=a.kind==="flash"?sv(c,"DES"):wStats(c.weapons[a.w]).hit,r=d20();v.d=r.v+b;v.dtxt=`d20 ${r.txt} ${sgn(b)}`;v.crit=a.kind==="deflect"&&r.v>=c.critMin}}
    drawTray();return}
  if(ds.rok!==undefined&&T&&T.resp&&T.resp.sel){T.resp.rv[T.resp.sel].ok=ds.rok==="1";drawTray();return}
  /* Tarjetas: primero la ficha de detalle (salvo Uso rápido en ataques sin límite); data-peek la abre también desde los recordatorios */
  const uk=USE_KEYS.find(k=>ds[k]!==undefined);
  if(uk&&(ds.peek!==undefined||el.classList.contains("act")&&(el.getAttribute("aria-disabled")==="true"||!quickOk(c,uk,ds[uk])))){armed=null;openSheet(uk,ds[uk]);return}
  if(ds.act!==undefined){armed=null;if(c.actions[+ds.act].kind==="info"){openSheet("act",ds.act);return}doAct(+ds.act);return}
  if(ds.sr){armed=null;doSpecial(ds.sr);return}
  if(ds.skill&&phys()){const sk=SKILLS.find(s=>s[0]===ds.skill),v=skillBonus(c,sk[0]),sn=tx(sk[1],sk[2]);
    show({title:`${sn} (${abT(sk[3])})`,d20:0,boxes:[d20Box(tx("Prueba","Check"),v,mode)],p:{mod:v,dmg:[],fmt:tot=>`${sn}: ${tot}`}});log(sn);T.logLine=S.log[0];save();return}
  if(ds.save&&phys()){const v=sv(c,ds.save);
    show({title:SVT_(ds.save),d20:0,boxes:[d20Box(tx("Salvación","Saving throw"),v,mode)],p:{mod:v,dmg:[],fmt:tot=>`${SVT_(ds.save)}: ${tot}`}});log(SVT_(ds.save));T.logLine=S.log[0];save();return}
  if(ds.skill){const sk=SKILLS.find(s=>s[0]===ds.skill),v=skillBonus(c,sk[0]),r=d20(),sn=tx(sk[1],sk[2]);
