<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel del DM</title>
<meta name="theme-color" content="#eef3f7">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Spectral+SC:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: barra de turno fija arriba, lista de criaturas ordenada por iniciativa como tarjetas, formulario para agregar al final */
/* ===== Paletas (mismo bloque en index.html y dm.html) =====
   data-pal en <html>: grand (predeterminada) · bandera · paja. data-theme: light (día) · dark (noche).
   Colores de estado: iguales en todas, salvo el daño en las paletas de acento rojo y los PV temporales en Grand Line (acento azul). */
:root,[data-pal]{--good:#1f7a45;--bad:#b3261e;--warn:#8f5b00;--haki:#3f3486;--temp:#2b5ea8;--foe:#6d2b80;--shadow:rgba(0,0,0,.14);color-scheme:light}
[data-pal][data-theme="dark"]{--good:#5cc98c;--bad:#ff8a80;--warn:#eab14d;--haki:#b7a9f2;--temp:#86b2f0;--foe:#cf9be6;--shadow:rgba(0,0,0,.55);color-scheme:dark}
:root,[data-pal="grand"]{--bg:#eef3f7;--surface:#ffffff;--ink:#10243a;--muted:#4f6378;--line:#cfdae4;--chip:#e1e9f0;--accent:#1d5c8f;--accent-ink:#ffffff;--gold:#8e6607;--temp:#00737a}
[data-pal="bandera"]{--bg:#f2f0ee;--surface:#ffffff;--ink:#1a1a1a;--muted:#5e5a56;--line:#dcd7d2;--chip:#e7e3df;--accent:#b0202a;--accent-ink:#ffffff;--gold:#7d5f17;--bad:#9d1a5f}
[data-pal="paja"]{--bg:#fbf5e6;--surface:#fffdf6;--ink:#2b2416;--muted:#6b5f47;--line:#ebdfc2;--chip:#f2e8cf;--accent:#b8342a;--accent-ink:#ffffff;--gold:#8c6807;--bad:#9d1a5f}
[data-pal="grand"][data-theme="dark"]{--bg:#0b1622;--surface:#13233a;--ink:#e6eef6;--muted:#93a6ba;--line:#22364f;--chip:#1b2d47;--accent:#5fa8e6;--accent-ink:#0b1622;--gold:#e8c15a;--temp:#4fd3dc}
[data-pal="bandera"][data-theme="dark"]{--bg:#0e0e10;--surface:#1a1a1d;--ink:#ededed;--muted:#a3a3a8;--line:#2c2c31;--chip:#242428;--accent:#ff5a5f;--accent-ink:#0e0e10;--gold:#d9b45a;--bad:#ff8fc4}
[data-pal="paja"][data-theme="dark"]{--bg:#1b160c;--surface:#262012;--ink:#f3ead6;--muted:#b5a88a;--line:#3a3120;--chip:#322a19;--accent:#ee7466;--accent-ink:#1b160c;--gold:#f0c24b;--bad:#ff8fc4}
.lk{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(420px,calc(100vw - 32px));box-shadow:0 12px 32px var(--shadow)}
.lk::backdrop{background:var(--shadow)}
.lk-in{padding:14px;display:flex;flex-direction:column}
.lk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lk-top b{font-family:var(--f-display);font-size:20px}
.lk h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.lk-pal{display:flex;flex-direction:column;gap:6px}
.lk-pal button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;text-align:left}
.lk-pal button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.sw{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex-shrink:0}
.sw i{width:14px;height:22px}
.sw i:nth-child(1){background:var(--bg)} .sw i:nth-child(2){background:var(--surface)} .sw i:nth-child(3){background:var(--accent)} .sw i:nth-child(4){background:var(--gold)}
.lk-mode{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px}
.lk-mode button{padding:8px 4px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.lk-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.lk-mode.lk-two{grid-template-columns:1fr 1fr}
.lk-ver{margin:12px 0 0;font-size:11px;color:var(--muted);text-align:center}
.ico{width:20px;height:20px;display:block}
/* ===== fin de paletas ===== */
:root{
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  -webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);min-width:0}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.05}
.round{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.turnbar{display:flex;align-items:center;gap:10px}
.now{flex:1;min-width:0;padding:10px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--accent)}
.now small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.now b{font-size:20px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{padding:10px 14px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.arm{background:var(--gold);color:var(--bg)}
.btn.big{padding:14px 18px;font-size:16px}

.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.card.ko{opacity:.6}
.head{display:flex;align-items:center;gap:10px}
.init{flex:0 0 40px;height:40px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.card.cur .init{background:var(--accent);color:var(--accent-ink)}
.name{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.name b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name span{font-size:12.5px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted)}
.tag.foe{background:var(--foe);color:var(--bg)}
.name b .role{vertical-align:2px;margin-left:4px}
/* Iniciativa de jugadores: la tiran con sus dados y el DM escribe el número */
.initin{width:40px;padding:0;text-align:center;font-weight:700;font-size:18px;border-radius:10px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink)}
.card.cur .initin{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--chip);color:var(--muted);font-weight:700;font-size:14px;line-height:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.name .fr{display:flex;align-items:center;gap:4px;color:var(--foe);font-weight:700}
.fr-ico{width:14px;height:14px;flex-shrink:0}
.hpnum{text-align:right;flex-shrink:0}
.hpnum b{font-size:22px}
.hpnum .t{color:var(--temp);font-weight:700;font-size:14px}
.hpnum small{display:block;font-size:12px;color:var(--muted)}
.name .state{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;color:var(--bg)}
.s-ok{background:var(--good)} .s-mid{background:var(--warn)} .s-low{background:var(--bad)} .s-ko{background:var(--ink)}
.track{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .hp{background:var(--good)} .track .hp.mid{background:var(--warn)} .track .hp.low{background:repeating-linear-gradient(135deg,var(--bad) 0 6px,transparent 6px 9px)}
.track .tp{background:var(--temp)}
.ctrl{display:grid;grid-template-columns:minmax(56px,1fr) auto auto auto;gap:6px}
.ctrl select{grid-column:1 / -1;font-size:14px}
/* Resultado de daño o curación (solo lo ve el DM): aviso arriba unos segundos, se cierra al tocarlo */
.dmt{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:30;width:max-content;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:14px;
  background:var(--surface);color:var(--ink);border:2px solid var(--rc,var(--line));box-shadow:0 6px 18px var(--shadow);font-size:14px;cursor:pointer;text-align:center}
.dmt b{color:var(--rc)} .dmt.d{--rc:var(--bad)} .dmt.h{--rc:var(--good)} .dmt.t{--rc:var(--temp)}
.ctrl input{text-align:center;font-size:17px;width:100%}
.ctrl .d{background:var(--bad);color:var(--bg)} .ctrl .h{background:var(--good);color:var(--bg)} .ctrl .tb{background:var(--temp);color:var(--bg)}
/* Símbolo además del color: en las paletas rojas el daño no depende solo del tono */
.ctrl .d::before{content:"− "} .ctrl .h::before{content:"+ "}
.conds{display:flex;gap:5px;flex-wrap:wrap}
.conds b{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bad);color:var(--bg)}
.more{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px dashed var(--line)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:13px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--bad);color:var(--bg)}
.edit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.edit label,.add label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap}

section h2{font-family:var(--f-display);font-size:19px;margin:0 0 8px}
.add{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}
.add .w3{grid-column:span 3} .add .w2{grid-column:span 2} .add .w1{grid-column:span 1} .add .w6{grid-column:span 6}
.initroll{display:flex;gap:4px}
.initroll input{flex:1}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap} .sync b{color:var(--good)} .sync .btn{padding:6px 10px;font-size:12.5px}
.tag.live{background:var(--good);color:var(--bg)}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.empty{padding:20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
@media (max-width:520px){
  .add{grid-template-columns:repeat(2,minmax(0,1fr))}
  .add .w3,.add .w2,.add .w6{grid-column:span 2} .add .w1{grid-column:span 1}
  .edit{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tools{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Apariencia (paleta y modo): mismo código y misma clave de localStorage en index.html y dm.html */
/* Versión publicada: la escribe sola el hook pre-commit de git (.git/hooks/pre-commit) con la fecha y hora del commit */
const APP_VERSION="2026-10-26 08:46";
/* lang: "es" (predeterminado) o "en". tx(es,en) da el texto de la interfaz en el idioma activo */
const PALS={grand:{es:"Grand Line",en:"Grand Line"},bandera:{es:"Bandera pirata",en:"Pirate Flag"},paja:{es:"Sombrero de paja",en:"Straw Hat"}},MODES={auto:{es:"Automático",en:"Auto"},day:{es:"Día",en:"Day"},night:{es:"Noche",en:"Night"}},
  DICE={fis:{es:"Físicos",en:"Physical"},dig:{es:"Digitales",en:"Digital"}},LANGS={es:{es:"Español",en:"Español"},en:{es:"English",en:"English"}},LOOK_KEY="mc:look";
const ICON=`<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><circle cx="7" cy="5" r="2.2" fill="currentColor"/><circle cx="13" cy="10" r="2.2" fill="currentColor"/><circle cx="8" cy="15" r="2.2" fill="currentColor"/></svg>`;
const darkQ=matchMedia("(prefers-color-scheme: dark)");
/* dice: "fis" (cada jugador tira sus dados y la app da la receta, predeterminado) o "dig" (la app tira) */
/* quick: uso rápido de ataques sin límite (sin ficha de detalle); el ajuste solo aparece en la app de los jugadores (body con data-quick) */
const okLook=v=>v&&PALS[v.pal]&&MODES[v.mode]?{pal:v.pal,mode:v.mode,dice:DICE[v.dice]?v.dice:"fis",lang:v.lang==="en"?"en":"es",quick:v.quick===true||v.quick==="1"}:null;
function readLook(){try{return okLook(JSON.parse(localStorage.getItem(LOOK_KEY)))}catch(e){return null}}
let look=readLook()||{pal:"grand",mode:"auto",dice:"fis",lang:"es",quick:false};
const tx=(es,en)=>look.lang==="en"?en:es;
const isDark=()=>look.mode==="night"||(look.mode==="auto"&&darkQ.matches);
function applyLook(){const r=document.documentElement;r.dataset.pal=look.pal;r.dataset.theme=isDark()?"dark":"light";r.lang=look.lang;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(r).getPropertyValue("--bg").trim();
  const d=document.getElementById("lk");if(d&&d.open)drawLook()}
/* fromCloud: el valor viene de Firebase, no hay que volver a subirlo */
function setLook(v,fromCloud){v=okLook(v);if(!v||JSON.stringify(v)===JSON.stringify(look))return;look=v;
  try{localStorage.setItem(LOOK_KEY,JSON.stringify(look))}catch(e){}
  applyLook();if(typeof onLook==="function")onLook();if(!fromCloud&&typeof lookToCloud==="function")lookToCloud(look)}
function drawLook(){const t=isDark()?"dark":"light",d=document.getElementById("lk"),n=o=>o[look.lang];d.setAttribute("aria-label",tx("Ajustes","Settings"));
  d.innerHTML=`<div class="lk-in"><div class="lk-top"><b>${tx("Ajustes","Settings")}</b><button class="btn" data-lk="close">${tx("Cerrar","Close")}</button></div>
  <h3>${tx("Paleta","Palette")}</h3><div class="lk-pal">${Object.entries(PALS).map(([k,o])=>`<button data-lkpal="${k}" aria-pressed="${look.pal===k}"><span class="sw" data-pal="${k}" data-theme="${t}"><i></i><i></i><i></i><i></i></span>${n(o)}</button>`).join("")}</div>
  <h3>${tx("Modo","Mode")}</h3><div class="lk-mode">${Object.entries(MODES).map(([k,o])=>`<button data-lkmode="${k}" aria-pressed="${look.mode===k}">${n(o)}</button>`).join("")}</div>
  <h3>${tx("Dados","Dice")}</h3><div class="lk-mode lk-two">${Object.entries(DICE).map(([k,o])=>`<button data-lkdice="${k}" aria-pressed="${look.dice===k}">${n(o)}</button>`).join("")}</div>
  <p class="note" style="margin-top:6px">${look.dice==="fis"?tx("Tiras tus dados y la app te dice qué tirar. Puedes anotar el resultado.","You roll your own dice and the app tells you what to roll. You can enter the result."):tx("La app tira los dados por ti.","The app rolls the dice for you.")}</p>
  ${document.body.hasAttribute("data-quick")?`<h3>${tx("Uso rápido para ataques sin límite","Quick use for unlimited attacks")}</h3><div class="lk-mode lk-two">${[["1",tx("Activado","On")],["0",tx("Desactivado","Off")]].map(([k,n])=>`<button data-lkquick="${k}" aria-pressed="${look.quick===(k==="1")}">${n}</button>`).join("")}</div>
  <p class="note" style="margin-top:6px">${tx("Activado: armas, golpes sin arma y trucos se usan con un toque. Lo que tiene usos limitados siempre muestra antes su ficha.","On: weapons, unarmed strikes and cantrips are used with one tap. Anything with limited uses always shows its sheet first.")}</p>`:""}
  <h3>Idioma / Language</h3><div class="lk-mode lk-two">${Object.entries(LANGS).map(([k,o])=>`<button data-lklang="${k}" lang="${k}" aria-pressed="${look.lang===k}">${n(o)}</button>`).join("")}</div>
  <p class="lk-ver">${tx("Versión","Version")} ${APP_VERSION}</p></div>`}
function openLook(){let d=document.getElementById("lk");
  if(!d){d=document.createElement("dialog");d.id="lk";d.className="lk";document.body.append(d);
    d.addEventListener("click",e=>{const b=e.target.closest("button");if(e.target===d||(b&&b.dataset.lk==="close"))return d.close();if(!b)return;
      const k=b.dataset.lkpal?"pal":b.dataset.lkmode?"mode":b.dataset.lklang?"lang":b.dataset.lkquick?"quick":"dice",val=b.dataset["lk"+k];
      setLook({...look,[k]:val});d.querySelector(`[data-lk${k}="${val}"]`)?.focus()})}
  drawLook();d.showModal()}
applyLook();darkQ.addEventListener("change",applyLook);
addEventListener("storage",e=>{if(e.key===LOOK_KEY){const v=readLook();if(v){look=v;applyLook();if(typeof onLook==="function")onLook()}}});
</script>
</head>
<body>

<div class="wrap">
  <header id="top"></header>
  <div class="list" id="list"></div>
  <!-- Textos fijos: data-en (texto), data-enph (placeholder) y data-entitle (title) en inglés; staticT() los cambia según el idioma -->
  <section><h2 data-en="Add Creature">Agregar criatura</h2>
    <form class="add" id="addf">
      <label class="w3"><span data-en="Name">Nombre</span><input id="f-name" required placeholder="Marine raso" data-enph="Marine grunt"></label>
      <label class="w2"><span data-en="Type">Tipo</span><select id="f-type"><option value="foe" data-en="Enemy">Enemigo</option><option value="pc" data-en="Player">Jugador</option><option value="ally" data-en="Ally">Aliado</option></select></label>
      <label class="w1"><span data-en="Qty.">Cant.</span><input id="f-qty" type="number" inputmode="numeric" min="1" max="20" value="1"></label>
      <label class="w2"><span data-en="Initiative">Iniciativa</span><span class="initroll"><input id="f-init" type="number" inputmode="numeric" placeholder="15"><button type="button" class="btn" id="f-roll" title="Tirar d20 + modificador" data-entitle="Roll d20 + modifier">d20</button></span></label>
      <label class="w1">Mod.<input id="f-mod" type="number" inputmode="numeric" placeholder="+2"></label>
      <label class="w1"><span data-en="AC">CA</span><input id="f-ac" type="number" inputmode="numeric" placeholder="14"></label>
      <label class="w2"><span data-en="Max HP">PV máx.</span><input id="f-max" type="number" inputmode="numeric" min="1" required placeholder="30"></label>
      <button class="btn primary w6" type="submit" data-en="Add to combat">Agregar al combate</button>
      <p class="note w6" data-en="With a quantity above 1, numbered copies are created. With &quot;Mod.&quot; and no initiative, each copy rolls its own d20.">Con cantidad mayor a 1 se crean copias numeradas. Con "Mod." y sin iniciativa, cada copia tira su propio d20.</p>
    </form>
  </section>
  <section><h2 data-en="Combat">Combate</h2>
    <div class="tools" id="tools"></div>
  </section>
</div>

<script>
/* Estados: el id (en español) es lo que se guarda; CONDS_EN da el nombre en inglés (mismos nombres que index.html) */
const CONDS=["Agarrado","Apresado","Asustado","Aturdido","Cegado","Derribado","Ensordecido","Envenenado","Hechizado","Incapacitado","Invisible","Paralizado","Concentrado"];
const CONDS_EN={Agarrado:"Grappled",Apresado:"Restrained",Asustado:"Frightened",Aturdido:"Stunned",Cegado:"Blinded",Derribado:"Prone",Ensordecido:"Deafened",Envenenado:"Poisoned",Hechizado:"Charmed",Incapacitado:"Incapacitated",Invisible:"Invisible",Paralizado:"Paralyzed",Concentrado:"Concentrating"};

/* Cambia el contenido sin parpadeo: vuelve a usar las <img> ya cargadas (misma src) y conserva lo escrito sin confirmar,
   el foco y el cursor de las casillas con id, y la posición de la página. Quien usa una casilla la vacía antes de render */
function put(el,html){
  const imgs={},vals={},f=document.activeElement,fid=f&&f.id&&el.contains(f)?f.id:"",y=scrollY;let sel=null;
  el.querySelectorAll("img").forEach(i=>(imgs[i.getAttribute("src")]??=[]).push(i));
  el.querySelectorAll("input[id],select[id],textarea[id]").forEach(i=>{if(i.type!=="checkbox"&&(i.tagName==="SELECT"?![...i.options].some(o=>o.selected&&o.defaultSelected):i.value!==i.defaultValue))vals[i.id]=i.value});
  try{if(fid)sel=[f.selectionStart,f.selectionEnd]}catch(e){}
  el.innerHTML=html;
  el.querySelectorAll("img").forEach(i=>{const o=imgs[i.getAttribute("src")];if(o&&o.length)i.replaceWith(o.shift())});
  for(const id in vals){const i=document.getElementById(id);if(i&&el.contains(i))i.value=vals[id]}
  const n=fid&&document.getElementById(fid);if(n&&el.contains(n)){n.focus({preventScroll:true});try{if(sel&&sel[0]!=null)n.setSelectionRange(sel[0],sel[1])}catch(e){}}
  if(scrollY!==y)scrollTo(0,y)}

/* Enlace con la app: jugador → su personaje; aliado con dueño (Fluffy) → el personaje del dueño */
function linkOf(c){const n=(c.char||c.name||"").trim().toLowerCase(),o=(c.owner||"").trim().toLowerCase();
  if(c.type==="pc"&&CHAR_KEYS.includes(n))return{char:n,kind:"pc"};if(c.type==="ally"&&CHAR_KEYS.includes(o))return{char:o,kind:"pet"};return null}
/* Lo que ven los jugadores: sin nombres, PV ni CA de enemigos */
function liveOf(){const L=sorted(),i=L.findIndex(c=>c.id===S.cur),cu=L[i];let nx=null;
  for(let k=1;k<L.length;k++){const c=L[(i+k)%L.length];if(c.hp>0||c.type==="pc"){nx=c;break}}
  const pub=c=>{if(!c)return null;if(c.type==="foe")return{kind:"foe",char:null,name:""};const l=linkOf(c);return{kind:l?l.kind:"ally",char:l?l.char:null,name:c.name}};
  return{active:!!S.active&&!!cu,round:S.round,turnId:S.turnId||0,cur:pub(cu),next:pub(nx),at:Date.now()}}

/* PV en vivo de cada jugador (state/{personaje}) y de Fluffy (state/sungsopp.comp) */
function liveView(c){const l=isDM&&linkOf(c),s=l&&LIVE.state[l.char];if(!s)return null;
  if(l.kind==="pet"){const k=s.comp||{};return Number.isFinite(k.hp)?{hp:k.hp,temp:k.temp||0,conds:c.conds,max:c.max}:null}
  return Number.isFinite(s.hp)?{hp:s.hp,temp:s.temp||0,conds:Array.isArray(s.conds)?s.conds.filter(x=>CONDS.includes(x)):[],max:s.maxHp||c.max}:null}

function liveMax(){let ch=false;for(const c of S.list){const l=linkOf(c);if(!l||l.kind!=="pc")continue;
  const m=(LIVE.state[l.char]||{}).maxHp||(LIVE.prog[l.char]||{}).maxHp;if(Number.isInteger(m)&&m>0&&m!==c.max){c.hp=c.max==null?m:Math.min(c.hp,m);c.max=m;ch=true}}if(ch)save()}
async function cloudInit(){
  try{const [A,U,F]=await Promise.all(["app","auth","firestore"].map(m=>import(FB+m+".js")));const app=A.initializeApp(FIREBASE);let db;
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    fb={U,F,db,auth:U.getAuth(app)}}catch(e){return} // sin internet y sin la librería: sigue solo en el teléfono
  render();
  fb.U.onAuthStateChanged(fb.auth,async u=>{unsubs.forEach(f=>f());unsubs=[];user=u;isDM=false;firstDm=true;LIVE={state:{},prog:{}};
    if(u)try{isDM=(await fb.F.getDoc(fb.F.doc(fb.db,"admins",u.uid))).exists()}catch(e){}
    if(isDM){const {F,db}=fb;
      /* Otro dispositivo del DM: gana el combate guardado más nuevo */
      unsubs.push(F.onSnapshot(F.doc(db,"combat","dm"),d=>{const v=d.exists()&&d.data();
        if(v&&v.S&&Array.isArray(v.S.list)&&(v.at||0)>(S.at||0)&&!d.metadata.hasPendingWrites){S=v.S;store.set("dm:combat2",S);store.set("mc:live",liveOf());render()}
        if(firstDm){firstDm=false;syncOut()}}));
      unsubs.push(F.onSnapshot(F.collection(db,"state"),q=>{q.forEach(d=>LIVE.state[d.id]=d.data());liveMax();render()}));
      unsubs.push(F.onSnapshot(F.collection(db,"progress"),q=>{q.forEach(d=>LIVE.prog[d.id]=d.data());liveMax();render()}))}
    render()})}

function band(c){if(c.max==null)return"pend";if(c.hp<=0)return"ko";const p=c.hp/c.max;return p>.5?"ok":p>.25?"mid":"low"}

/* Cambia los textos fijos del HTML (data-en, data-enph, data-entitle); el español original queda en data-es, data-esph y data-estitle */
function staticT(){document.querySelectorAll("[data-en]").forEach(el=>{el.dataset.es??=el.textContent;el.textContent=tx(el.dataset.es,el.dataset.en)});
  document.querySelectorAll("[data-enph]").forEach(el=>{el.dataset.esph??=el.placeholder;el.placeholder=tx(el.dataset.esph,el.dataset.enph)});
  document.querySelectorAll("[data-entitle]").forEach(el=>{el.dataset.estitle??=el.title;el.title=tx(el.dataset.estitle,el.dataset.entitle)})}

function applyDamage(c,n){if(n>=c.temp){n-=c.temp;c.temp=0;c.hp-=n}else c.temp-=n;if(c.hp<0)c.hp=0}
/* Tipos de daño (los mismos que index.html) y nombre completo: "daño cortante" / "daño de fuego" */

/* Resultado en tercera persona, solo en este teléfono (nunca se publica) */
function dmToast(cls,html){let d=$("dmt");if(!d){d=document.createElement("div");d.id="dmt";d.setAttribute("role","status");d.addEventListener("click",()=>d.hidden=true);document.body.append(d)}
  d.className="dmt "+cls;d.innerHTML=html;d.hidden=false;clearTimeout(d._t);d._t=setTimeout(()=>d.hidden=true,5000)}
function applyHeal(c,n){c.hp=Math.min(c.max,c.hp+n)}

  const find=id=>S.list.find(c=>c.id===id);

    else if(d.heal){const h0=c.hp;applyHeal(c,n);dmToast("h",tx(`${nm} recuperó <b>${c.hp-h0}</b> PV · Ahora tiene ${c.hp} / ${c.max} PV`,`${nm} regained <b>${c.hp-h0}</b> HP · Now at ${c.hp} / ${c.max} HP`))}
    else{c.temp=n;dmToast("t",tx(`${nm} tiene <b>${n}</b> PV temporales`,`${nm} has <b>${n}</b> temporary HP`))}save();render();return}
  if(d.cond){const c=find(d.cond);c.conds=c.conds.includes(d.c)?c.conds.filter(x=>x!==d.c):[...c.conds,d.c];save();render();return}
  if(d.save){const c=find(d.save);const nm=$("e-name-"+c.id).value.trim();if(nm)c.name=nm;c.init=num("e-init-"+c.id);c.ac=num("e-ac-"+c.id);
    const mx=num("e-max-"+c.id);if(mx>0){c.hp=c.max==null?mx:Math.min(c.hp,mx);c.max=mx}open=null;save();render();return}
  if(d.turn){S.cur=d.turn;S.turnId=(S.turnId||0)+1;S.active=true;open=null;save();render();return}
  if(d.del){if(armed!=="del"+d.del){armed="del"+d.del;render();return}
    const L=sorted(),i=L.findIndex(c=>c.id===d.del);if(S.cur===d.del&&L.length>1)S.cur=L[(i+1)%L.length].id;
    S.list=S.list.filter(c=>c.id!==d.del);armed=null;open=null;if(!S.list.length)S.cur=null;save();render();return}
  const act=d.do;if(!act)return;
  if(act==="look"){openLook();return}
  if(act==="login"){fb.U.signInWithPopup(fb.auth,new fb.U.GoogleAuthProvider()).catch(e=>alert(tx("No se pudo entrar: ","Couldn't sign in: ")+(e.code||e)));return}
  if(act==="logout"){fb.U.signOut(fb.auth);return}
  if(act==="next"||act==="prev"){const L=sorted();if(!L.length)return;let i=L.findIndex(c=>c.id===S.cur);
    for(let k=0;k<L.length;k++){i+=act==="next"?1:-1;
      if(i>=L.length){i=0;S.round++}if(i<0){i=L.length-1;S.round=Math.max(1,S.round-1)}
      if(L[i].hp>0||L[i].type==="pc")break}
    S.cur=L[i].id;S.turnId=(S.turnId||0)+1;S.active=true;armed=null;save();render();return}
  if(["end","heal","foes","reset"].includes(act)){
    if(armed!==act){armed=act;render();return}armed=null;
    if(act==="heal")S.list.forEach(c=>{c.hp=c.max;c.temp=0;c.conds=[]});
    if(act==="foes"){S.list=S.list.filter(c=>c.type!=="foe");S.round=1;S.cur=sorted()[0]?.id||null}
    if(act==="end"){S.active=false;S.round=1}
    if(act==="reset"){S={round:1,cur:null,list:[],v:S.v,active:false,turnId:S.turnId}} // v: que no vuelvan a correr las migraciones
    save();render();return}
});
document.addEventListener("change",e=>{const id=e.target.dataset&&e.target.dataset.initfor;if(!id)return;
  const c=S.list.find(x=>x.id===id),v=parseInt(e.target.value,10);if(!c)return;c.init=isNaN(v)?null:v;save();render()});
$("f-roll").addEventListener("click",()=>{const m=parseInt($("f-mod").value,10)||0;$("f-init").value=1+Math.floor(Math.random()*20)+m});
$("addf").addEventListener("submit",e=>{e.preventDefault();
  const name=$("f-name").value.trim(),max=num("f-max");if(!name||!(max>0))return;
  const qty=Math.min(20,Math.max(1,num("f-qty")||1)),init=num("f-init"),mod=num("f-mod"),ac=num("f-ac"),type=$("f-type").value;
  for(let k=1;k<=qty;k++){
    const ini=init!=null?init:(mod!=null?1+Math.floor(Math.random()*20)+mod:null);
    S.list.push({id:nid(),name:qty>1?`${name} ${k}`:name,type,init:ini,ac,max,hp:max,temp:0,conds:[]})}
  if(!S.cur)S.cur=sorted()[0].id;
  ["f-name","f-init","f-mod","f-ac","f-max"].forEach(i=>$(i).value="");$("f-qty").value=1;
  save();render();
});
/* Lo publicado nunca lleva nombre, PV ni CA de enemigos */
{const t={...S};S={round:2,cur:"e",list:[{id:"e",name:"Kaido",type:"foe",init:20,ac:22,hp:500,max:500,temp:0,conds:[]},{id:"u",name:"Udon",char:"udon",type:"pc",init:10,ac:15,hp:66,max:66,temp:0,conds:[]}],active:true,turnId:3};
  const p=JSON.stringify(liveOf());console.assert(!/Kaido|"hp"|"ac"|"max"/.test(p)&&/"char":"udon"/.test(p),"dm-live: "+p);S=t}
staticT();render();cloudInit();
