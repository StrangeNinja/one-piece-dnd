<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: barra de turno fija arriba, lista de criaturas ordenada por iniciativa como tarjetas, formulario para agregar al final */
/* ===== Paletas (mismo bloque en index.html y dm.html) =====

   Colores de estado: iguales en todas, salvo el daño en las paletas de acento rojo y los PV temporales en Grand Line (acento azul). */
:root,[data-pal]{--good:#1f7a45;--bad:#b3261e;--warn:#8f5b00;--haki:#3f3486;--temp:#2b5ea8;--foe:#6d2b80;--shadow:rgba(0,0,0,.14);color-scheme:light}
[data-pal][data-theme="dark"]{--good:#5cc98c;--bad:#ff8a80;--warn:#eab14d;--haki:#b7a9f2;--temp:#86b2f0;--foe:#cf9be6;--shadow:rgba(0,0,0,.55);color-scheme:dark}
:root,[data-pal="grand"]{--bg:#eef3f7;--surface:#ffffff;--ink:#10243a;--muted:#4f6378;--line:#cfdae4;--chip:#e1e9f0;--accent:#1d5c8f;--accent-ink:#ffffff;--gold:#8e6607;--temp:#00737a}
[data-pal="bandera"]{--bg:#f2f0ee;--surface:#ffffff;--ink:#1a1a1a;--muted:#5e5a56;--line:#dcd7d2;--chip:#e7e3df;--accent:#b0202a;--accent-ink:#ffffff;--gold:#7d5f17;--bad:#9d1a5f}
[data-pal="paja"]{--bg:#fbf5e6;--surface:#fffdf6;--ink:#2b2416;--muted:#6b5f47;--line:#ebdfc2;--chip:#f2e8cf;--accent:#b8342a;--accent-ink:#ffffff;--gold:#8c6807;--bad:#9d1a5f}
[data-pal="grand"][data-theme="dark"]{--bg:#0b1622;--surface:#13233a;--ink:#e6eef6;--muted:#93a6ba;--line:#22364f;--chip:#1b2d47;--accent:#5fa8e6;--accent-ink:#0b1622;--gold:#e8c15a;--temp:#4fd3dc}
[data-pal="bandera"][data-theme="dark"]{--bg:#0e0e10;--surface:#1a1a1d;--ink:#ededed;--muted:#a3a3a8;--line:#2c2c31;--chip:#242428;--accent:#ff5a5f;--accent-ink:#0e0e10;--gold:#d9b45a;--bad:#ff8fc4}
[data-pal="paja"][data-theme="dark"]{--bg:#1b160c;--surface:#262012;--ink:#f3ead6;--muted:#b5a88a;--line:#3a3120;--chip:#322a19;--accent:#ee7466;--accent-ink:#1b160c;--gold:#f0c24b;--bad:#ff8fc4}
.lk{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(420px,calc(100vw - 32px));box-shadow:0 12px 32px var(--shadow)}
.lk::backdrop{background:var(--shadow)}
.lk-in{padding:14px;display:flex;flex-direction:column}
.lk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lk-top b{font-family:var(--f-display);font-size:20px}
.lk h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.lk-pal{display:flex;flex-direction:column;gap:6px}
.lk-pal button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;text-align:left}
.lk-pal button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.sw{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex-shrink:0}
.sw i{width:14px;height:22px}
.sw i:nth-child(1){background:var(--bg)} .sw i:nth-child(2){background:var(--surface)} .sw i:nth-child(3){background:var(--accent)} .sw i:nth-child(4){background:var(--gold)}
.lk-mode{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px}
.lk-mode button{padding:8px 4px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.lk-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.lk-mode.lk-two{grid-template-columns:1fr 1fr}
.lk-ver{margin:12px 0 0;font-size:11px;color:var(--muted);text-align:center}
.ico{width:20px;height:20px;display:block}
/* ===== fin de paletas ===== */
:root{
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;

/* Resultado de daño o curación (solo lo ve el DM): aviso arriba unos segundos, se cierra al tocarlo */
.dmt{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:30;width:max-content;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:14px;
  background:var(--surface);color:var(--ink);border:2px solid var(--rc,var(--line));box-shadow:0 6px 18px var(--shadow);font-size:14px;cursor:pointer;text-align:center}
.dmt b{color:var(--rc)} .dmt.d{--rc:var(--bad)} .dmt.h{--rc:var(--good)} .dmt.t{--rc:var(--temp)}

.fa .av{width:64px;height:64px;border-radius:50%;border:3px solid var(--bg);font-family:var(--f-display);font-size:28px}

.tag.fall{background:var(--bad);color:var(--bg)} .tag.fall.stable{background:var(--warn)}
.ctrl input{text-align:center;font-size:17px;width:100%}
.ctrl .d{background:var(--bad);color:var(--bg)} .ctrl .h{background:var(--good);color:var(--bg)} .ctrl .tb{background:var(--temp);color:var(--bg)}
/* Símbolo además del color: en las paletas rojas el daño no depende solo del tono */
.ctrl .d::before{content:"− "} .ctrl .h::before{content:"+ "}
.conds{display:flex;gap:5px;flex-wrap:wrap}

.row{display:flex;gap:6px;flex-wrap:wrap}

section h2{font-family:var(--f-display);font-size:19px;margin:0 0 8px}
.add{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}

<script>
/* Apariencia (paleta y modo): mismo código y misma clave de localStorage en index.html y dm.html */
/* Versión publicada: la escribe sola el hook pre-commit de git (.git/hooks/pre-commit) con la fecha y hora del commit */
const APP_VERSION="2026-11-22 22:24";
/* lang: "es" (predeterminado) o "en". tx(es,en) da el texto de la interfaz en el idioma activo */
const PALS={grand:{es:"Grand Line",en:"Grand Line"},bandera:{es:"Bandera pirata",en:"Pirate Flag"},paja:{es:"Sombrero de paja",en:"Straw Hat"}},MODES={auto:{es:"Automático",en:"Auto"},day:{es:"Día",en:"Day"},night:{es:"Noche",en:"Night"}},
  DICE={fis:{es:"Físicos",en:"Physical"},dig:{es:"Digitales",en:"Digital"}},LANGS={es:{es:"Español",en:"Español"},en:{es:"English",en:"English"}},LOOK_KEY="mc:look";
const ICON=`<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><circle cx="7" cy="5" r="2.2" fill="currentColor"/><circle cx="13" cy="10" r="2.2" fill="currentColor"/><circle cx="8" cy="15" r="2.2" fill="currentColor"/></svg>`;
const darkQ=matchMedia("(prefers-color-scheme: dark)");
/* dice: "fis" (cada jugador tira sus dados y la app da la receta, predeterminado) o "dig" (la app tira) */
/* quick: uso rápido de ataques sin límite (sin ficha de detalle); el ajuste solo aparece en la app de los jugadores (body con data-quick) */
const okLook=v=>v&&PALS[v.pal]&&MODES[v.mode]?{pal:v.pal,mode:v.mode,dice:DICE[v.dice]?v.dice:"fis",lang:v.lang==="en"?"en":"es",quick:v.quick===true||v.quick==="1"}:null;
function readLook(){try{return okLook(JSON.parse(localStorage.getItem(LOOK_KEY)))}catch(e){return null}}
let look=readLook()||{pal:"grand",mode:"auto",dice:"fis",lang:"es",quick:false};
const tx=(es,en)=>look.lang==="en"?en:es;
const isDark=()=>look.mode==="night"||(look.mode==="auto"&&darkQ.matches);
function applyLook(){const r=document.documentElement;r.dataset.pal=look.pal;r.dataset.theme=isDark()?"dark":"light";r.lang=look.lang;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(r).getPropertyValue("--bg").trim();
  const d=document.getElementById("lk");if(d&&d.open)drawLook()}
/* fromCloud: el valor viene de Firebase, no hay que volver a subirlo */
function setLook(v,fromCloud){v=okLook(v);if(!v||JSON.stringify(v)===JSON.stringify(look))return;look=v;
  try{localStorage.setItem(LOOK_KEY,JSON.stringify(look))}catch(e){}
  applyLook();if(typeof onLook==="function")onLook();if(!fromCloud&&typeof lookToCloud==="function")lookToCloud(look)}

  d.innerHTML=`<div class="lk-in"><div class="lk-top"><b>${tx("Ajustes","Settings")}</b><button class="btn" data-lk="close">${tx("Cerrar","Close")}</button></div>

/* Gesto Atrás del teléfono (botón de Android, deslizar desde el borde en iPhone): cada nivel abierto es una entrada del historial (pushState, sin cambiar la URL).
   Niveles: Ajustes más los que cuente la página (navDepth); Atrás cierra uno (navPop). Cerrar varios a la vez retrocede el historial y HSKIP ignora ese popstate */
let HD=0,HSKIP=0,HT=0;
const lkOpen=()=>!!(document.getElementById("lk")||{}).open;
function navSync(){HT=0;if(HSKIP)return;const d=(lkOpen()?1:0)+(typeof navDepth==="function"?navDepth():0);
  if(d>HD)for(;HD<d;HD++)history.pushState({mc:HD+1},"");
  else if(d<HD){HSKIP=1;history.go(d-HD);HD=d;setTimeout(()=>{if(HSKIP){HSKIP=0;navLater()}},1500)}}
function navLater(){if(!HT)HT=setTimeout(navSync,0)}

  if(lkOpen())document.getElementById("lk").close();else if(typeof navPop==="function")navPop();navLater()});

  b.textContent=tx("Hay una versión nueva · Actualizar","A new version is available · Update");b.onclick=()=>{SWGO=true;b.disabled=true;w.postMessage("skip")};b.hidden=false}

/* ===== Nube (Firebase): combate compartido con los jugadores =====

const FIREBASE={apiKey:"AIzaSyBjywHbBPsTBVvWtOXbKhjQDf4kmbEc-MU",authDomain:"one-piece-dnd.firebaseapp.com",projectId:"one-piece-dnd",storageBucket:"one-piece-dnd.firebasestorage.app",messagingSenderId:"629290049992",appId:"1:629290049992:web:6fe9f692bb47c8878460fd"};

function put(el,html){

  if(scrollY!==y)scrollTo(0,y)}

const ROLES={Codel:{es:"Doctor",en:"Doctor"},Udon:{es:"Primer oficial",en:"First Mate"},Kalgo:{es:"Navegante",en:"Navigator"},Sungsopp:{es:"Capitán",en:"Captain"}};

/* v2: Codel pasó a CA 18 y 62 PV (antes 36) también en combates ya guardados; si estaba con los PV llenos, sigue lleno */

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function sorted(){return S.list.map((c,i)=>[c,i]).sort((a,b)=>(b[0].init??-99)-(a[0].init??-99)||a[1]-b[1]).map(x=>x[0])}
/* Enlace con la app: jugador → su personaje; aliado con dueño (Fluffy) → el personaje del dueño */
function linkOf(c){const n=(c.char||c.name||"").trim().toLowerCase(),o=(c.owner||"").trim().toLowerCase();
  if(c.type==="pc"&&CHAR_KEYS.includes(n))return{char:n,kind:"pc"};if(c.type==="ally"&&CHAR_KEYS.includes(o))return{char:o,kind:"pet"};return null}
/* Lo que ven los jugadores: sin nombres, PV ni CA de enemigos */
function liveOf(){const L=sorted(),i=L.findIndex(c=>c.id===S.cur),cu=L[i];let nx=null;
  for(let k=1;k<L.length;k++){const c=L[(i+k)%L.length];if(c.hp>0||c.type==="pc"){nx=c;break}}

  const fallen=Object.entries(S.fall||{}).map(([k,st])=>{const c=S.list.find(x=>{const l=linkOf(x);return l&&fallKey(l)===k});return c&&{...linkOf(c),name:c.name,st}}).filter(Boolean);
  /* Orden de iniciativa para la pantalla de mesa y los teléfonos: enemigos sin PV ni CA (franja de estado si S.showBand) y sin nombre salvo que el DM lo muestre (c.show; si no, n = número de enemigo) */
  let fi=0;const order=L.map(c=>{const l=linkOf(c),kind=c.type==="foe"?"foe":l?l.kind:"ally",o={id:String(c.id).slice(0,24),kind,char:l?l.char:null,name:c.name,band:"",conds:(c.conds||[]).filter(x=>CONDS.includes(x)),cur:c.id===S.cur};

function tdurLog(){if(S.active&&S.turnAt){const n=Math.round((Date.now()-S.turnAt)/1000);if(n>0)clog({k:"tdur",n})}}
function tdStats(E){const T=E.filter(e=>e.k==="tdur"&&e.o==="dm"&&e.n>0&&e.n<1800&&e.a);if(T.length<2)return null;const fast=T.reduce((a,b)=>b.n<a.n?b:a);return{fast,avg:Math.round(T.reduce((a,b)=>a+b.n,0)/T.length)}}
console.assert((()=>{const r=tdStats([{k:"tdur",o:"dm",n:40,a:"Udon"},{k:"tdur",o:"dm",n:18,a:"Codel"},{k:"tdur",o:"dm",n:5000,a:"X"},{k:"tdur",o:"udon",n:1,a:"Y"}]);return r.fast.a==="Codel"&&r.avg===29&&tdStats([{k:"tdur",o:"dm",n:3,a:"A"}])===null&&durT(75)==="1 min 15 s"})(),"reloj de turno");

/* Franja de estado: >75 % Ileso, >50 % Herido, >25 % Malherido, >0 A punto de caer, 0 Derrotado */
const bandOf=c=>!(c.max>0)||!Number.isFinite(c.hp)?"":c.hp<=0?"ko":c.hp/c.max>.75?"ok":c.hp/c.max>.5?"hurt":c.hp/c.max>.25?"bad":"near";
/* Últimas 5 frases de la crónica del combate en curso; los nombres y apodos de los enemigos ocultos se cambian por "Enemigo N" */
function tickerOf(){if(!S.cid)return[];let L;try{L=buildCron(S.cid).text.split("\n")}catch(e){return[]}
  const ep=L.lastIndexOf(tx("Epílogo","Epilogue")),body=(ep>0?L.slice(0,ep):L).filter(x=>x&&x!==tx("Prólogo","Prologue")&&!/^(Ronda|Round) \d+ · /.test(x));
  const pro=body.length?body.slice(1):[];let s=pro.slice(-3).join(" ").split(/(?<=[.!?…])\s+/).filter(Boolean).slice(-5);
  return s.map(x=>hideTxt(x,false).slice(0,240))}
/* ===== Enemigos ocultos en la mesa: cada enemigo tiene un número fijo en el combate (S.fnm = {id: {n, name, bid, rev}}; rev: el DM mostró su nombre alguna vez).
   La mesa, el ticker y todo lo que se envía a los teléfonos (ataques, golpes, daño en área) usan "Enemigo N" mientras su nombre esté oculto.
   La crónica del panel lleva los nombres reales; al compartirla, los que nunca se mostraron pasan a "Enemigo N" salvo "Revelar todos los nombres en la crónica" ===== */
function foeNums(){S.fnm=S.fnm||{};let m=Math.max(0,...Object.values(S.fnm).map(e=>e.n||0));
  for(const c of sorted())if(c.type==="foe"){const e=S.fnm[c.id]||(S.fnm[c.id]={n:++m});e.name=c.name;e.bid=c.bid||"";if(c.show)e.rev=1}return S.fnm}
const foeLbl=n=>tx(`Enemigo ${n}`,`Enemy ${n}`);
const hiddenFoe=c=>c&&c.type==="foe"&&!c.show;
/* never: solo los que nunca se mostraron (crónica compartida); si no, los que están ocultos ahora (y los que ya salieron sin mostrarse) */
function hideTxt(t,never){const F=foeNums(),rep=[];t=String(t||"");
  for(const [id,e] of Object.entries(F)){const c=S.list.find(x=>x.id===id);if(never?e.rev:(c?c.show:e.rev))continue;const b=e.bid&&BEST.list.find(x=>x.id===e.bid),nm=b&&b.name;
    const L=[e.name,String(e.name||"").replace(/\s\d+$/,""),...(nm?[nm.es,nm.en,typeof nm==="string"?nm:""]:[]).filter(Boolean).flatMap(x=>String(x).split(",").map(y=>y.trim()))];
    for(const n of[...L,...L.map(x=>x.split(" ")).filter(w=>w.length>1&&!/^(el|la|los|las|the)$/i.test(w[0])).map(w=>w[0])])if(n&&n.length>2)rep.push([n,foeLbl(e.n)])} // también el primer nombre ("Zahir")
  rep.sort((a,b)=>b[0].length-a[0].length);for(const [n,al] of rep)t=t.replace(new RegExp("(?<![\\p{L}\\d])"+reEsc(n)+"(?![\\p{L}\\d])","gu"),al);return t.replace(/((?:Enemigo|Enemy) \d+), \1,?/g,"$1")}
const reEsc=x=>x.replace(/[.*+?^$(){}|[\]\\]/g,"\\$&"); // hideTxt cambia palabras completas
function syncOut(){if(typeof sorted!=="function")return;
  if(!fb||!isDM||firstDm)return;clearTimeout(syncT);syncT=setTimeout(()=>{const {F,db}=fb;
    F.setDoc(F.doc(db,"combat","dm"),{S:JSON.parse(JSON.stringify(S)),at:S.at||Date.now()}).catch(e=>console.warn("No se pudo guardar el combate",e));
    F.setDoc(F.doc(db,"combat","live"),liveOf()).catch(e=>console.warn("No se pudo publicar el turno",e))},250)}
/* PV en vivo de cada jugador (state/{personaje}) y de Fluffy (state/sungsopp.comp) */
function liveView(c){const l=isDM&&linkOf(c),s=l&&LIVE.state[l.char];if(!s)return null;
  if(l.kind==="pet"){const k=s.comp||{};return Number.isFinite(k.hp)?{hp:k.hp,temp:k.temp||0,conds:c.conds,max:c.max}:null}
  return Number.isFinite(s.hp)?{hp:s.hp,temp:s.temp||0,conds:Array.isArray(s.conds)?s.conds.filter(x=>CONDS.includes(x)):[],max:s.maxHp||c.max}:null}
/* PV máximos al subir de nivel: los manda el teléfono del jugador (state.maxHp) o la aprobación del DM (progress.maxHp) */
function liveMax(){let ch=false;for(const c of S.list){const l=linkOf(c);if(!l||l.kind!=="pc")continue;
  const m=(LIVE.state[l.char]||{}).maxHp||(LIVE.prog[l.char]||{}).maxHp;if(Number.isInteger(m)&&m>0&&m!==c.max){c.hp=c.max==null?m:Math.min(c.hp,m);c.max=m;ch=true}}if(ch)save()}
async function cloudInit(){

    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    fb={U,F,db,auth:U.getAuth(app)}}catch(e){return} // sin internet y sin la librería: sigue solo en el teléfono
  render();
  fb.U.onAuthStateChanged(fb.auth,async u=>{unsubs.forEach(f=>f());unsubs=[];user=u;isDM=false;firstDm=true;firstBest=true;LIVE={state:{},prog:{}};
    if(u)try{isDM=(await fb.F.getDoc(fb.F.doc(fb.db,"admins",u.uid))).exists()}catch(e){}
    if(isDM){const {F,db}=fb;
      /* Otro dispositivo del DM: gana el combate guardado más nuevo */
      unsubs.push(F.onSnapshot(F.doc(db,"combat","dm"),d=>{const v=d.exists()&&d.data();
        if(v&&v.S&&Array.isArray(v.S.list)&&(v.at||0)>(S.at||0)&&!d.metadata.hasPendingWrites){S=v.S;store.set("dm:combat2",S);render()}

      unsubs.push(F.onSnapshot(F.doc(db,"combat","chronicle"),d=>{const v=d.exists()&&d.data();CHRL=v&&Array.isArray(v.list)?v.list.filter(x=>x&&typeof x.text==="string"):[];render()},()=>{}));
      unsubs.push(F.onSnapshot(F.doc(db,"combat","bestiary"),d=>{const v=d.exists()&&d.data();
        if(v&&v.B&&Array.isArray(v.B.list)&&(v.at||0)>(BEST.at||0)&&!d.metadata.hasPendingWrites){BEST={...v.B,pre:1};if(bestMig())saveBest();else store.set("dm:best",BEST);render()}
        if(firstBest){firstBest=false;if(!v||(BEST.at||0)>(v.at||0))bestOut()}}));
      unsubs.push(F.onSnapshot(F.collection(db,"state"),q=>{q.forEach(d=>LIVE.state[d.id]=d.data());liveMax();render()}));
      unsubs.push(F.onSnapshot(F.collection(db,"progress"),q=>{q.forEach(d=>LIVE.prog[d.id]=d.data());liveMax();render()}))}
    render()})}
/* max null: personaje sin hoja todavía */
function band(c){if(c.max==null)return"pend";if(c.hp<=0)return"ko";const p=c.hp/c.max;return p>.5?"ok":p>.25?"mid":"low"}
const BAND={ok:["s-ok",{es:"Sano",en:"Healthy"}],mid:["s-mid",{es:"Herido",en:"Hurt"}],low:["s-low",{es:"Grave",en:"Critical"}],ko:["s-ko",{es:"KO",en:"KO"}],pend:["s-mid",{es:"Hoja pendiente",en:"Sheet pending"}]};
/* Cambia los textos fijos del HTML (data-en, data-enph, data-entitle); el español original queda en data-es, data-esph y data-estitle */
function staticT(){document.querySelectorAll("[data-en]").forEach(el=>{el.dataset.es??=el.textContent;el.textContent=tx(el.dataset.es,el.dataset.en)});
  document.querySelectorAll("[data-enph]").forEach(el=>{el.dataset.esph??=el.placeholder;el.placeholder=tx(el.dataset.esph,el.dataset.enph)});
  document.querySelectorAll("[data-entitle]").forEach(el=>{el.dataset.estitle??=el.title;el.title=tx(el.dataset.estitle,el.dataset.entitle)})}
function onLook(){staticT();render()}

const DMG_EN={cortante:"slashing",perforante:"piercing",contundente:"bludgeoning",fuego:"fire",frío:"cold",rayo:"lightning",trueno:"thunder",fuerza:"force",necrótico:"necrotic",radiante:"radiant",ácido:"acid",veneno:"poison",psíquico:"psychic",oscuridad:"darkness",luz:"light"};

   Solo este panel publica (es el único que lee los PV de todos): compara los PV de cada jugador y de Fluffy con los de antes (FALLPREV)
   y agrega el aviso a S.alerts (los últimos 5; id = hora) y el estado a S.fall {clave: down | stable | dead}; combat/live los lleva como alerts y fallen.
   Los cambios guardados por la propia cuenta del DM (una ficha abierta desde Mesa en index.html) son pruebas: no avisan */
let FALLPREV={};
const fallKey=l=>(l.kind==="pet"?"pet:":"")+l.char;
const FALL_ST={down:{es:"A 0 PV",en:"At 0 HP"},stable:{es:"Estable",en:"Stable"},dead:{es:"Sin vida",en:"Dead"}};

  d.hidden=false;clearTimeout(d._t);d._t=setTimeout(()=>d.hidden=true,7000);try{navigator.vibrate&&navigator.vibrate(a.ev==="up"||a.ev==="stable"?160:[300,100,300])}catch(e){}}

function watchFall(){let ch=false;S.fall=S.fall||{};
  for(const c of S.list){const l=linkOf(c);if(!l||c.max==null)continue;
    const k=fallKey(l),lv=liveView(c),st=lv&&LIVE.state[l.char],hp=lv?lv.hp:c.hp,p=FALLPREV[k],f=S.fall[k];FALLPREV[k]={hp,live:!!lv};
    if(st&&user&&st.by===user.uid)continue; // prueba del DM desde la app: no avisa
    if(!p||p.live!==!!lv){if(hp>0&&f){delete S.fall[k];ch=true}continue} // primera lectura (o cambia de fuente): solo se ordena, sin aviso
    if(p.hp>0&&hp<=0){S.fall[k]="down";addAlert(c,l,"down");ch=true}
    else if(p.hp<=0&&hp>0&&f){delete S.fall[k];addAlert(c,l,"up");ch=true}

  if(roll){const atk=Number.isFinite(x.hit),nat=atk?d20():0,crit=nat===20,dm=x.dmg?rollDice(x.dmg,crit):null,xd=x.xd?rollDice(x.xd,crit):null;
    if(atk){e.tot=nat+x.hit;e.nat=nat;if(crit)e.crit=true}if(dm){e.dmg=dm.tot+(xd?xd.tot:0);e.ty=x.ty}
    txt=`<b>${esc(nm)}</b>`+(atk?tx(`: <b>${e.tot}</b> para impactar (d20 ${nat})`,`: <b>${e.tot}</b> to hit (d20 ${nat})`)+(crit?tx(" · ¡crítico!"," · critical!"):""):"")
      +(dm?` · <b>${dm.tot}</b> ${esc(tyT(x.ty))}`:"")+(xd?` + <b>${xd.tot}</b> ${esc(tyT(x.xty))}`:"")}
  clog(e);S.lastUse={m:nm,tid:S.turnId||0,ty:x.ty||""};dmToast("t",`${esc(c.name)}: ${txt}`);
  if(x.ab&&(x.dmg||x.sea))aoeOpen({src:nm,cx:x.id,n:e.dmg??"",ty:x.ty||"",ab:x.ab,dc:x.dc||"",half:!!x.half,sea:!!x.sea,rec:x.dmg?`${x.dmg} ${tyT(x.ty)}`:"",by:c.id})}
/* Lo que se ve de la hoja en la tarjeta abierta */

  const cnt=(k,lbl,v,max)=>max?`<div class="cnt"><b>${lbl} ${v}/${max}</b><button class="btn" data-bc="${c.id}" data-k="${k}" data-v="-1" aria-label="${lbl} −1">−</button><button class="btn" data-bc="${c.id}" data-k="${k}" data-v="1" aria-label="${lbl} +1">+</button></div>`:"";
  return`<div class="bsh"><p class="note">${esc(tl2(b.speed))}${sv?` · ${tx("Salvaciones","Saves")} ${sv}`:""}${rs?` · ${tx("Resistencias","Resistances")}: ${esc(rs)}`:""}</p>

      return`<div class="bcd"><div><b>${esc(tl2(x.n))}</b> <span class="tag">${tl(KIND[x.k])}</span>${u?` <span class="tag">${esc(u)}</span>`:""}${r?`<span class="note" style="display:block">${esc(r)}</span>`:""}${x.note?`<span class="note" style="display:block">${esc(tl2(x.note))}</span>`:""}</div>
        <div class="row"><button class="btn primary" data-bu="${c.id}" data-x="${x.id}" ${off?"disabled":""}>${tx("Usar","Use")}</button>${can?`<button class="btn" data-bu="${c.id}" data-x="${x.id}" data-roll="1" ${off?"disabled":""}>${tx("Tirar","Roll")}</button>`:""}${Number.isFinite(x.hit)?`<button class="btn" data-ba="${c.id}" data-x="${x.id}" ${off?"disabled":""}>${tx("Atacar a…","Attack…")}</button>`:""}</div></div>`}).join("")}
    ${b.morale?`<p class="note"><b>${tx("Moral","Morale")}:</b> ${esc(tl2(b.morale))}</p>`:""}
    <div class="row">${["flee","surr"].map(f=>`<button class="btn ${armed===f+c.id?"arm":""}" data-flee="${c.id}" data-f="${f}">${armed===f+c.id?tx("Toca para confirmar","Tap to confirm"):f==="flee"?tx("Huye","Flees"):tx("Se rinde","Surrenders")}</button>`).join("")}</div></div>`}

/* ===================== PANEL (diálogo): editor de hojas, daño en área y crónica =====================
   PANEL.k: edit | aoe | cron. Cuenta como un nivel para el gesto Atrás (navDepth) */
let PANEL=null;
function panOpen(p){PANEL=p;let d=$("pan");

const tySel=(attr,v,none)=>`<select ${attr}><option value="">${none}</option>${DMG.map(t=>`<option value="${t}" ${t===v?"selected":""}>${tyT(t)[0].toUpperCase()+tyT(t).slice(1)}</option>`).join("")}</select>`;
const abSel=(attr,v,none)=>`<select ${attr}><option value="">${none}</option>${ABS.map(a=>`<option value="${a}" ${a===v?"selected":""}>${abT(a)}</option>`).join("")}</select>`;

/* ----- Editor de hojas: ED es una copia; cada casilla escribe su ruta (data-ef) sin redibujar; agregar o quitar cartas sí redibuja ----- */
const EF={atk:["hit","dmg","ty","xd","xty","uses","per","note"],save:["ab","dc","dmg","ty","half","area","uses","per","rech","sea","note"],feat:["dmg","ty","uses","per","rech","note"],react:["uses","per","note"],leg:["cost","hit","ab","dc","dmg","ty","half","area","note"]};
const EFL={hit:L2("Bono de ataque","Attack bonus"),dmg:L2("Daño (dados + mod.)","Damage (dice + mod.)"),ty:L2("Tipo","Type"),xd:L2("Daño extra","Extra damage"),xty:L2("Tipo extra","Extra type"),ab:L2("Salvación","Save"),dc:L2("CD","DC"),
  half:L2("Mitad si supera","Half on a success"),area:L2("Área","Area"),uses:L2("Usos (0: sin límite)","Uses (0: unlimited)"),per:L2("Por","Per"),rech:L2("Recarga (5 = 5–6)","Recharge (5 = 5–6)"),cost:L2("Coste (1–3)","Cost (1–3)"),sea:L2("Kairoseki si falla","Seastone on a failure"),note:L2("Nota","Note")};
const NUMF=["hit","dc","uses","rech","cost","ac","hp","init","lr","la","moraleHp"];
let ED=null,EDO=new Set();
function edOpen(b){ED=JSON.parse(JSON.stringify(b||blank()));EDO=new Set();panOpen({k:"edit",title:tx("Hoja de criatura","Creature sheet")})}
function edField(path,f,x){const v=x[f],a=`data-ef="${path}.${f}"`,lb=tl(EFL[f]);
  if(f==="ty"||f==="xty")return`<label>${lb}${tySel(a,v,tx("Sin tipo","No type"))}</label>`;
  if(f==="ab")return`<label>${lb}${abSel(a,v,tx("Ninguna","None"))}</label>`;
  if(f==="per")return`<label>${lb}<select ${a}><option value="dia" ${v!=="desc"?"selected":""}>${tx("día","day")}</option><option value="desc" ${v==="desc"?"selected":""}>${tx("descanso","rest")}</option></select></label>`;
  if(f==="half"||f==="sea")return`<label class="ck w2"><input type="checkbox" ${a} ${v?"checked":""}>${lb}</label>`;
  if(f==="note"||f==="area")return`<label class="w2">${lb}<input ${a} value="${esc(tl2(v))}" maxlength="${f==="note"?300:60}"></label>`;
  return`<label>${lb}<input ${a} ${NUMF.includes(f)?`type="number" inputmode="numeric"`:`placeholder="1d8+3"`} value="${v??""}"></label>`}
function edHtml(){const b=ED,chips=k=>`<div class="chips">${DMG.map(t=>`<button data-edt="${k}" data-t="${t}" aria-pressed="${(b[k]||[]).includes(t)}">${tyT(t)}</button>`).join("")}</div>`;
  const inp=(f,lb,num,w)=>`<label class="${w||""}">${lb}<input data-ef="${f}" ${num?`type="number" inputmode="numeric"`:""} value="${esc(num?b[f]??"":tl2(b[f]))}"></label>`;
  return panTop(b.id?tx("Editar hoja","Edit sheet"):tx("Nueva hoja","New sheet"))+`
  <div class="fgrid">${inp("name",tx("Nombre","Name"),0,"w2")}<label>${tx("Tipo","Type")}<select data-ef="type"><option value="foe" ${b.type!=="ally"?"selected":""}>${tl(TYPE.foe)}</option><option value="ally" ${b.type==="ally"?"selected":""}>${tl(TYPE.ally)}</option></select></label>
    ${inp("cr",tx("VD (0, 1/8, 1/4, 1/2, 1–30)","CR (0, 1/8, 1/4, 1/2, 1–30)"),0)}${inp("ac",tx("CA","AC"),1)}${inp("hp",tx("PV máx.","Max HP"),1)}${inp("init",tx("Mod. de iniciativa","Initiative mod."),1)}${inp("speed",tx("Velocidad","Speed"),0,"w2")}</div>
  <h3>${tx("Características y salvaciones","Ability scores and saves")}</h3>
  <div class="fgrid g3">${ABS.map(a=>`<label>${abT(a)}<input data-ef="ab.${a}" type="number" inputmode="numeric" value="${b.ab[a]??10}"></label>`).join("")}</div>
  <p class="note">${tx("Salvaciones competentes (vacío: el modificador)","Proficient saves (empty: the modifier)")}</p>
  <div class="fgrid g3">${ABS.map(a=>`<label>${abT(a)}<input data-ef="sv.${a}" type="number" inputmode="numeric" value="${b.sv[a]??""}" placeholder="${sgn(Math.floor(((b.ab[a]??10)-10)/2))}"></label>`).join("")}</div>
  <h3>${tx("Resistencias","Resistances")}</h3>${chips("res")}<h3>${tx("Inmunidades","Immunities")}</h3>${chips("imm")}
  <div class="fgrid">${inp("lr",tx("Resist. legendarias al día","Legendary resist. per day"),1)}${inp("la",tx("Acciones legendarias por ronda","Legendary actions per round"),1)}
    ${inp("morale",tx("Moral (nota)","Morale (note)"),0,"w2")}${inp("moraleHp",tx("Avisar bajo estos PV","Warn below this HP"),1)}${inp("flavor",tx("Línea épica (crónica)","Epic line (chronicle)"),0,"w2")}</div>
  <h3>${tx("Cartas","Cards")} (${b.cards.length})</h3>
  ${b.cards.map((x,i)=>`<details class="edc" data-edo="${i}" ${EDO.has(i)?"open":""}><summary>${esc(tl2(x.n)||"?")} · ${tl(KIND[x.k])}</summary><div class="fgrid">
    <label class="w2">${tx("Nombre","Name")}<input data-ef="cards.${i}.n" value="${esc(tl2(x.n))}" maxlength="60"></label>${EF[x.k].map(f=>edField("cards."+i,f,x)).join("")}</div>
    <button class="btn" data-edx="${i}">${tx("Quitar carta","Remove card")}</button></details>`).join("")}
  <div class="row">${Object.keys(KIND).map(k=>`<button class="btn" data-edadd="${k}">+ ${tl(KIND[k])}</button>`).join("")}</div>

function edSet(path,el){const ks=path.split("."),last=ks.pop();let o=ED;for(const k of ks)o=o[k];const f=last,raw=el.type==="checkbox"?el.checked:el.value;
  if(el.type==="checkbox")o[f]=raw;else if(NUMF.includes(f)||ks[0]==="ab"||ks[0]==="sv"){const n=parseInt(raw,10);if(isNaN(n))delete o[f];else o[f]=n}
  else o[f]=["name","speed","flavor","morale","n","note","area"].includes(f)?setL(o[f],raw.slice(0,300)):raw}

/* ----- Daño en área: varias criaturas, salvación opcional, mitad si supera, kairoseki y fuente. Las enlazadas (jugadores y Fluffy) reciben el golpe en su teléfono ----- */
function aoeOpen(o={}){panOpen({k:"aoe",title:tx("Daño en área","Area damage"),src:o.src||"",n:o.n??"",ty:o.ty||"",ab:o.ab||"",dc:o.dc??"",half:o.half!==false,sea:!!o.sea,rec:o.rec||"",by:o.by||"",cx:o.cx||"",sel:{},sv:{},roll:{}})}
function aoeRow(c){const P=PANEL,on=!!P.sel[c.id],l=linkOf(c),b=sheetOf(c),n=parseInt(P.n,10),r=resOf(b,P.ty),s=P.sv[c.id];
  let body="";if(on){if(l)body=`<span class="note">${tx("Se envía a su teléfono: tira su propia salvación","Sent to their phone: they roll their own save")}</span>`;
    else{const v=n>=0?aoeDmg(n,{saved:P.ab?s==="ok":false,half:P.half,r}):null;
      body=(P.ab?`<div class="row"><button class="btn" data-aor="${c.id}" data-r="roll">${tx("Tirar","Roll")} (${sgn(svB(b,P.ab))})</button><button class="btn" data-aor="${c.id}" data-r="ok" aria-pressed="${s==="ok"}">${tx("Superó","Saved")}</button><button class="btn" data-aor="${c.id}" data-r="ko" aria-pressed="${s==="ko"}">${tx("Falló","Failed")}</button></div>`:"")
        +`<span class="note">${P.roll[c.id]?P.roll[c.id]+" · ":""}${v==null||P.ab&&!s?tx("Falta el resultado","Result missing"):`→ <b>${v}</b>${r==="imm"?tx(" (inmune)"," (immune)"):r==="res"?tx(" (resistente: la mitad)"," (resistant: half)"):""}${P.ab&&s==="ok"?(P.half?tx(" · superó: la mitad"," · saved: half"):tx(" · superó: nada"," · saved: nothing")):""}`}</span>`}}
  return`<div class="aor"><label class="ck"><input type="checkbox" data-aosel="${c.id}" ${on?"checked":""}><b>${esc(c.name)}</b> <span class="tag ${c.type==="foe"?"foe":""}">${tl(TYPE[c.type])}</span></label>${body}</div>`}
function aoeMissing(){const P=PANEL;return!P.ab?[]:sorted().filter(c=>P.sel[c.id]&&!linkOf(c)&&!P.sv[c.id]).map(c=>c.name)}
function aoeHtml(){const P=PANEL,miss=aoeMissing(),n=parseInt(P.n,10),any=sorted().some(c=>P.sel[c.id]);
  return panTop(tx("Daño en área","Area damage"))+`<div class="fgrid">
    <label class="w2">${tx("Fuente (opcional)","Source (optional)")}<input id="ao-src" data-ao="src" maxlength="40" value="${esc(P.src)}"></label>
    <label>${tx("Daño total","Total damage")}<input id="ao-n" data-ao="n" type="number" inputmode="numeric" min="0" value="${P.n}"></label>
    <label>${tx("Tipo","Type")}${tySel('id="ao-ty" data-ao="ty"',P.ty,tx("Sin tipo","No type"))}</label>
    <label>${tx("Salvación","Save")}${abSel('id="ao-ab" data-ao="ab"',P.ab,tx("Sin salvación","No save"))}</label>
    <label>${tx("CD","DC")}<input id="ao-dc" data-ao="dc" type="number" inputmode="numeric" value="${P.dc}"></label>
    <label class="ck w2"><input type="checkbox" data-ao="half" ${P.half?"checked":""}>${tx("Mitad si supera","Half on a success")}</label>
    <label class="ck w2"><input type="checkbox" data-ao="sea" ${P.sea?"checked":""}>${tx("Aplica kairoseki a quienes fallen","Seastone on those who fail")}</label></div>
    ${P.rec?`<p class="note">${tx("Tira","Roll")} ${esc(P.rec)}</p>`:""}
    <div class="row"><button class="btn" data-aoall="foe">${tx("Todos los enemigos","All enemies")}</button><button class="btn" data-aoall="pc">${tx("Todos los jugadores","All players")}</button><button class="btn" data-aoall="">${tx("Nadie","Nobody")}</button></div>
    ${sorted().map(aoeRow).join("")}
    ${miss.length?`<p class="note">${tx("Falta la salvación de: ","Save missing for: ")}${esc(miss.join(", "))}</p>`:""}
    <button class="btn primary big" data-pan="aoego" ${any&&n>=0&&!miss.length&&(!P.ab||parseInt(P.dc,10)>0)?"":"disabled"}>${tx("Aplicar","Apply")}</button>`}
function aoeGo(){const P=PANEL,n=parseInt(P.n,10),dc=parseInt(P.dc,10)||0,out=[];let need=false;
  for(const c of sorted()){if(!P.sel[c.id])continue;const l=linkOf(c);
    if(l){if(sendHit(c,l,{n,type:P.ty,save:P.ab,dc,half:P.half,src:P.src,sea:P.sea}))out.push(`${esc(c.name)}: ${tx("enviado","sent")}`);else need=true;continue}
    const b=sheetOf(c),saved=P.ab?P.sv[c.id]==="ok":null,v=aoeDmg(n,{saved,half:P.half,r:resOf(b,P.ty)});
    const extra=hurt(c,v,P.ty,{aoe:true,...(P.ab?{saved}:{}),...(P.src?{src:P.src}:{}),...(P.cx?{cx:P.cx}:{})});out.push(`${esc(c.name)}: <b>${v}</b>${P.ab?` (${saved?tx("superó","saved"):tx("falló","failed")})`:""}${extra.length?" · "+extra.join(" · "):""}`)}
  panClose();save();render();dmToast("d",(P.src?`<b>${esc(P.src)}</b><br>`:"")+out.join("<br>")+(need?"<br>"+tx("Sin sesión de DM no se puede avisar a los jugadores","Without a DM session the players can't be notified"):""))}

/* ----- Golpes y kairoseki para los jugadores: progress/{personaje}.hit y .sea (merge: no toca nivel, prestigio, propuestas…) ----- */
let SENT={};
function progMerge(ch,data){if(!fb||!isDM)return false;USENT.push(ch);fb.F.setDoc(fb.F.doc(fb.db,"progress",ch),data,{merge:true}).catch(e=>{console.warn("No se pudo enviar",e);dmToast("d",tx("No se pudo enviar al jugador","Couldn't send to the player"))});return true}
/* Lo que llega al teléfono: la fuente sin nombres de enemigos ocultos */
const hitOf=(l,h)=>({id:nid(),n:h.n,type:h.type||"",save:h.save||"",dc:h.dc||0,half:!!h.half,src:hideTxt(h.src,false).slice(0,40),sea:!!h.sea,pet:l.kind==="pet",crit:!!h.crit,at:Date.now()});
function sendHit(c,l,h){const lv=liveView(c),ok=progMerge(l.char,{hit:hitOf(l,h)});
  if(ok){SENT[c.id]={hp:lv?lv.hp:null};clog({k:"hit",target:c.name,n:h.n,ty:h.type||"",src:h.src||"",...(h.save?{save:h.save,dc:h.dc}:{}),...(h.crit?{crit:true}:{}),...(h.save?{aoe:true}:{})})}return ok}
const seaName=n=>n==="Codel"?tx("Kairoseki","Seastone"):tx("Agua o kairoseki","Water or seastone");
/* Lo que se ve en vivo del jugador: reacción, reacciones especiales y concentración (state/{personaje}) */
function liveBadges(c){const l=linkOf(c),s=l&&l.kind==="pc"&&isDM&&LIVE.state[l.char];if(!s)return"";const t=s.turn||{},sr=Number.isFinite(t.sr)?t.sr:null;
  return`<div class="conds">${Number.isFinite(t.r)?`<span class="tag ${t.r>0?"ok":""}">${t.r>0?tx("Reacción lista","Reaction ready"):tx("Reacción usada","Reaction used")}</span>`:""}${sr!=null?`<span class="tag ${sr>0?"ok":""}">${tx("Especiales","Specials")} ${sr}/2</span>`:""}
    ${s.conc&&s.conc.id?`<span class="tag live">${tx("Concentrado en","Concentrating on")} ${esc(String(s.concN||"…").slice(0,40))}</span>`:""}${FRUITS[c.name]&&s.sea?`<span class="tag foe">${seaName(c.name)}</span>`:""}</div>`}
/* Formulario de la tarjeta abierta de un jugador o de Fluffy: Enviar golpe y, con fruta, el kairoseki */
function linkForms(c){const l=linkOf(c);if(!l)return"";const s=LIVE.state[l.char]||{},lu=S.lastUse&&S.lastUse.tid===(S.turnId||0)?S.lastUse:null;
  return`<div class="fxadd"><b>${tx("Enviar golpe","Send hit")}</b><div class="fgrid"><label>${tx("Daño","Damage")}<input id="sh-n-${c.id}" type="number" inputmode="numeric" min="1" placeholder="0"></label>
    <label>${tx("Tipo","Type")}${tySel(`id="sh-ty-${c.id}"`,lu?lu.ty:"",tx("Sin tipo","No type"))}</label>

const parOf=c=>{const b=sheetOf(c);if(!b)return[];return b.cards.filter(x=>x.k==="react").map(x=>{const m=/\+\s*(\d+)\s*(CA|AC)\b/.exec(tl2(x.note)||"")||/\+\s*(\d+)\s*(CA|AC)\b/.exec(x.note&&x.note.es||"");return m?{x,n:+m[1]}:null}).filter(Boolean)};
const akItem=(cx,tid)=>({cx,tid:tid||"",tot:"",nat:null,crit:false,n:"",xn:"",mag:false,par:0,roll:""});
function akOpen(c,cx){const L=sorted().filter(t=>t.id!==c.id),t=L.find(t=>c.type==="foe"?t.type!=="foe":t.type==="foe")||L[0];panOpen({k:"atk",title:tx("Atacar a…","Attack…"),by:c.id,q:[akItem(cx,t?t.id:"")]})}

  const l=t&&linkOf(t),ac=t&&t.ac!=null?t.ac+(it.par||0):null,res=t&&!l&&ac!=null&&Number.isFinite(tot)?atkRes(tot,it.nat,ac):"";return{x,t,l,tot,n:n>=0?n:0,xn:xn>=0?xn:0,ac,res}}
function akHtml(){const P=PANEL,c=S.list.find(y=>y.id===P.by);if(!c)return panTop(tx("Atacar a…","Attack…"));const cards=hitCards(c),ok=P.q.every(it=>{const v=akView(it,c);return v.x&&v.t&&Number.isFinite(v.tot)&&(v.l||v.ac!=null)});

      ${v.x&&v.x.xd?`<label>${tx("Daño extra","Extra damage")} (${esc(v.x.xd)} ${esc(tyT(v.x.xty))})<input id="ak-xn-${i}" data-ak="xn" data-i="${i}" type="number" inputmode="numeric" min="0" value="${esc(it.xn)}"></label>`:""}

/* El ataque que llega al teléfono: atacante oculto = by vacío y byN (el número de la mesa; el teléfono escribe "Enemigo N" en su idioma) */
function atkOf(c,v,it,nm){const hid=hiddenFoe(c);return{id:nid(),kind:"attack",total:v.tot,nat:it.nat||null,crit:!!it.crit,n:v.n,type:v.x.ty||"",extra:v.xn>0?[{n:v.xn,type:v.x.xty||""}]:[],
  src:hideTxt(nm,false).slice(0,40),by:hid?"":c.name,byN:hid?foeNums()[c.id].n:0,magic:!!it.mag,pet:v.l.kind==="pet",at:Date.now()}}
/* Gasta usos, recarga o acciones legendarias de una carta (lo mismo que Usar) */
function bSpend(c,x,nm){c.u=c.u||{};c.rch=c.rch||{};
  if(x.k==="leg"){const k=x.cost||1;if((c.la??0)<k){dmToast("d",tx(`A ${esc(c.name)} no le quedan acciones legendarias para ${esc(nm)}`,`${esc(c.name)} doesn't have legendary actions left for ${esc(nm)}`));return false}c.la-=k}
  if(x.uses>0){if((c.u[x.id]??x.uses)<=0)return false;c.u[x.id]=(c.u[x.id]??x.uses)-1}
  if(x.rech){if(c.rch[x.id]===false)return false;c.rch[x.id]=false}return true}
function akGo(){const P=PANEL,c=S.list.find(y=>y.id===P.by);if(!c)return;const out=[],send={};let need=false;
  for(const it of P.q){const v=akView(it,c);if(!v.x||!v.t)continue;const nm=tl2(v.x.n);if(!bSpend(c,v.x,nm))continue;
    clog({k:v.x.k==="leg"?"leg":"use",m:nm,cx:v.x.id,tot:v.tot,...(it.nat?{nat:it.nat}:{}),...(it.crit?{crit:true}:{})});S.lastUse={m:nm,tid:S.turnId||0,ty:v.x.ty||""};
    if(v.l){const h=atkOf(c,v,it,nm);
      (send[v.l.char]=send[v.l.char]||{l:v.l,L:[]}).L.push({h,t:v.t});continue}
    if(it.par){const p=parOf(v.t).find(p=>p.n===it.par);if(p)clog({k:"react",m:tl2(p.x.n),a:v.t.name})}
    if(v.res==="hit"){const b=sheetOf(v.t),d=aoeDmg(v.n,{r:resOf(b,v.x.ty)})+aoeDmg(v.xn,{r:resOf(b,v.x.xty)}),ex=hurt(v.t,d,v.x.ty||"",{src:nm,cx:v.x.id,...(it.crit?{crit:true}:{})});
      out.push(tx(`${esc(nm)} acierta a ${esc(v.t.name)} (${v.tot} contra CA ${v.ac}): <b>${d}</b> de daño`,`${esc(nm)} hits ${esc(v.t.name)} (${v.tot} vs AC ${v.ac}): <b>${d}</b> damage`)+(ex.length?" · "+ex.join(" · "):""))}
    else{clog({k:"atk",target:v.t.name,res:"miss",tot:v.tot,ac:v.ac,cx:v.x.id});out.push(tx(`${esc(nm)} falla contra ${esc(v.t.name)} (${v.tot} contra CA ${v.ac})`,`${esc(nm)} misses ${esc(v.t.name)} (${v.tot} vs AC ${v.ac})`))}}
  /* Un solo envío por teléfono (jugador y su mascota juntos): el primero en hit y los demás en more, en orden */
  for(const {l,L} of Object.values(send)){const ok=progMerge(l.char,{hit:{...L[0].h,more:L.slice(1).map(x=>x.h)}});
    if(!ok){need=true;continue}for(const {h,t} of L){SENT[t.id]={hp:(liveView(t)||{}).hp??null,at:Date.now()};clog({k:"atks",target:t.name,src:h.src,tot:h.total})}
    for(const t of new Set(L.map(x=>x.t))){const k=L.filter(x=>x.t===t).length;out.push(tx(`${esc(t.name)}: ${k} ${k>1?"ataques enviados":"ataque enviado"} a su teléfono`,`${esc(t.name)}: ${k} ${k>1?"attacks":"attack"} sent to their phone`))}}

/* Lanzar: pregunta si quita los enemigos actuales, agrega todas las copias (numeradas, iniciativa tirada) y muestra el escenario arriba del combate */
function encGo(e){if(S.list.some(c=>c.type==="foe")&&confirm(tx("¿Quitar los enemigos actuales?","Remove the current enemies?"))){S.list=S.list.filter(c=>c.type!=="foe");if(!S.list.some(c=>c.id===S.cur))S.cur=null}
  for(const it of e.items){const b=BEST.list.find(x=>x.id===it.bid);if(b&&it.q>0)addFromSheet(b,it.q,null)}
  if(!S.cur&&S.list.length)S.cur=sorted()[0].id;S.scene={name:tl2(e.name),note:tl2(e.note||""),loot:tl2(e.loot||""),eid:e.id};eOpen=null;save();render();
  dmToast("h",tx(`Encuentro listo: <b>${esc(tl2(e.name))}</b>`,`Encounter ready: <b>${esc(tl2(e.name))}</b>`))}
const sceneHtml=()=>S.scene&&(S.scene.note||S.scene.loot)?`<div class="scene"><div><b>${esc(S.scene.name)}</b>${S.scene.note?`<p class="note">${esc(S.scene.note)}</p>`:""}${S.scene.loot?`<p class="note"><b>${tx("Botín","Loot")}:</b> ${esc(S.scene.loot)}</p>`:""}</div><button class="btn" data-do="scenex" aria-label="${tx("Ocultar el escenario","Hide the scenario")}">✕</button></div>`:"";
function encClick(d){
  if(d.ex){const a=d.ex,e=(BEST.enc||[]).find(x=>x.id===d.e);if(a==="new"){encEdOpen(null);return true}if(!e)return true;
    if(a==="open"){eOpen=eOpen===e.id?null:e.id;armed=null;render();return true}
    if(a==="go"){encGo(e);return true}
    if(a==="edit"){encEdOpen(e);return true}
    if(a==="dup"){const n=JSON.parse(JSON.stringify(e));n.id="e"+nid();n.name=setL(n.name,tl2(n.name)+tx(" (copia)"," (copy)"));BEST.enc.splice(BEST.enc.indexOf(e)+1,0,n);eOpen=n.id;saveBest();render();return true}
    if(a==="del"){if(armed!=="edel"+e.id){armed="edel"+e.id;render();return true}armed=null;BEST.enc=BEST.enc.filter(x=>x!==e);eOpen=null;saveBest();render();return true}
    return true}
  if(d.eq&&EE){let it=EE.items.find(x=>x.bid===d.eq);if(!it)EE.items.push(it={bid:d.eq,q:0});it.q=Math.max(0,Math.min(20,it.q+ +d.v));EE.items=EE.items.filter(x=>x.q>0);drawPan();return true}
  if(d.pan==="eesave"&&EE){if(!tl2(EE.name).trim()||!EE.items.length){dmToast("d",tx("El encuentro necesita nombre y al menos una criatura","The encounter needs a name and at least one creature"));return true}
    if(!EE.id)EE.id="e"+nid();BEST.enc=BEST.enc||[];const i=BEST.enc.findIndex(x=>x.id===EE.id);if(i>=0)BEST.enc[i]=EE;else BEST.enc.push(EE);eOpen=EE.id;saveBest();panClose();render();return true}
  return false}

/* ===================== CRÓNICA DEL COMBATE =====================
   S.clog (máx. 600): eventos del panel mientras hay combate, con cid (S.cid, nace en el primer «Siguiente»), ronda, turnId y actor (de quién es el turno).
   Se mezcla con state/{personaje}.clog de cada jugador del mismo cid y se narra con plantillas (sin API externa) */
function clog(e){if(!S.active)return;S.clog=S.clog||[];const cu=S.list.find(c=>c.id===S.cur);S.clog.push({t:Date.now(),r:S.round,tid:S.turnId||0,a:cu?cu.name:"",...e});if(S.clog.length>600)S.clog=S.clog.slice(-600)}
function cronEvents(cid){const E=(S.clog||[]).filter(e=>!cid||S.cid===cid).map(e=>({...e,o:"dm"}));
  for(const ch of CHAR_KEYS){const s=LIVE.state[ch];if(s&&s.ccid===cid&&Array.isArray(s.clog))for(const e of s.clog)if(e&&typeof e==="object")E.push({...e,o:ch,a:String(e.a||"").slice(0,40)})}
  return E.sort((a,b)=>(a.tid||0)-(b.tid||0)||(a.t||0)-(b.t||0))}
/* Atribución: el daño que el DM aplica durante el turno de alguien es de ese alguien; el golpe toma el nombre de su última jugada en ese turno */
const cardName=id=>{for(const b of BEST.list){const x=b.cards.find(y=>y.id===id);if(x)return tl2(x.n)}return""};
const mvOf=e=>(e.cx&&cardName(e.cx))||e.m||e.src||"";
function attrib(e,E){const u=E.filter(x=>x.tid===e.tid&&x.a===e.a&&(x.k==="use"||x.k==="leg"||x.k==="react")),pre=u.filter(x=>(x.t||0)<=(e.t||0)+30000);const m=(pre.length?pre:u).pop();return{by:e.a,m:e.src||e.cx?mvOf(e):m?mvOf(m):""}}
console.assert((()=>{const E=[{tid:5,t:100,k:"turn",a:"Udon"},{tid:5,t:110,k:"use",a:"Udon",m:"Katana del Shogun Carmesí"},{tid:5,t:200,k:"dmg",a:"Udon",target:"Zahir",n:17}],r=attrib(E[2],E);return r.by==="Udon"&&r.m==="Katana del Shogun Carmesí"})(),"crónica: atribución");
console.assert(aoeDmg(25,{saved:true,half:true,r:"res"})===6&&aoeDmg(25,{saved:false,half:true,r:"res"})===12&&aoeDmg(25,{saved:false,r:"imm"})===0&&aoeDmg(25,{saved:true,half:false})===0&&aoeDmg(9,{saved:null})===9,"daño en área");
console.assert(concDc(9)===10&&concDc(25)===12&&concDc(40)===20,"concentración");

  if(d.lg==="del"){if(armed!=="lg"+x.at){armed="lg"+x.at;render();return true}armed=null;if(!fb||!isDM){noDm();return true}const L=CHRL.filter(y=>y!==x);
    fb.F.setDoc(fb.F.doc(fb.db,"combat","chronicle"),{list:L},{merge:true}).then(()=>dmToast("h",tx("Crónica borrada del diario","Chronicle deleted from the logbook")),e=>{console.warn(e);dmToast("d",tx("No se pudo borrar","Couldn't delete"))});CHRL=L;render();return true}

function rwFoes(cid){const E=cronEvents(cid),st=E.find(e=>e.k==="start"),who=(st&&Array.isArray(st.who)?st.who:[]),

function rwPara(pl,xp){const L=[],each=pl.crew.map(ch=>pl.o[ch].m),same=each.every(v=>v===each[0]);

console.assert((()=>{const p={rw:{eq:true,tot:"1000",per:{},items:[{ch:"udon",n:"Kit",q:"2"}],pr:{udon:{on:true,n:"1",note:"salvar a Codel"}}},cid:"x"},o=rwPlan(p);
